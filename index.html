// ── FLIP generic: memorăm pozițiile „înainte", re-randăm, apoi elementele ALUNECĂ
// elastic din poziția veche spre cea nouă (cu mic decalaj în cascadă). ──────────
function _flipRects(list){
  const m = {};
  list.forEach(([sel, keyFn]) => {
    document.querySelectorAll(sel).forEach(el => {
      const k = keyFn(el); if(k == null || k === '') return;
      m[sel + '|' + k] = el.getBoundingClientRect();
    });
  });
  return m;
}
function _flipAnimate(list, before, dur, stagger){
  dur = dur || 430; stagger = (stagger == null) ? 14 : stagger;
  const moves = [];
  list.forEach(([sel, keyFn]) => {
    document.querySelectorAll(sel).forEach(el => {
      const k = keyFn(el); if(k == null || k === '') return;
      const b = before[sel + '|' + k]; if(!b) return;
      const a = el.getBoundingClientRect();
      const dx = b.left - a.left, dy = b.top - a.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      moves.push({ el, dx, dy });
    });
  });
  if(!moves.length) return;
  moves.forEach(m => { m.el.style.transition = 'none'; m.el.style.transform = 'translate(' + m.dx + 'px,' + m.dy + 'px)'; m.el.style.willChange = 'transform'; });
  void document.body.offsetWidth; // reflow → tranziția pornește din poziția veche
  moves.forEach((m, idx) => {
    m.el.style.transition = 'transform ' + dur + 'ms cubic-bezier(.3,1.35,.55,1) ' + (idx * stagger) + 'ms';
    m.el.style.transform = '';
  });
  setTimeout(() => moves.forEach(m => { m.el.style.transition = ''; m.el.style.willChange = ''; }), dur + moves.length * stagger + 100);
}

// ── PENALIZĂRI + CĂRȚILE LUATE (înlocuiesc panoul lateral) ──────────────────────
// Agregat per jucător pt. modul curent: J♠ / Q×n / K♥ / ♦×n (+ L×n levate la Totale).
function _penAgg(gs, pi){
  let q=0, kh=0, di=0, js=0, lv=0;
  (gs.tricks || []).forEach(t => {
    if(t.winner !== pi) return;
    lv++;
    (t.cards || []).forEach(c => {
      if(c.rank === 'Q') q++;
      if(c.rank === 'K' && c.suit === '♥') kh++;
      if(c.suit === '♦') di++;
      if(c.rank === 'J' && c.suit === '♠') js++;
    });
  });
  return { q, kh, di, js, lv };
}
function penaltyChips(gs, pi){
  if(!gs || gs.mode === 'rentz' || gs.phase === 'selecting' || !gs.tricks || !gs.tricks.length) return '';
  const m = gs.mode, a = _penAgg(gs, pi), out = [];
  const chip = (txt, cls) => '<span class="pen-chip ' + cls + '">' + txt + '</span>';
  if(m === 'totale' && a.lv) out.push(chip('L×' + a.lv, 'lev'));
  if((m === 'jPica' || m === 'totale') && a.js) out.push(chip('J♠', 'js'));
  if((m === 'qMinus' || m === 'totale') && a.q) out.push(chip(a.q > 1 ? 'Q×' + a.q : 'Q', 'q'));
  if((m === 'kInima' || m === 'totale') && a.kh) out.push(chip('K♥', 'kh'));
  if((m === 'romb' || m === 'totale') && a.di) out.push(chip('♦×' + a.di, 'di'));
  return out.join('');
}
function penaltyChipsRow(gs, pi){
  const c = penaltyChips(gs, pi);
  return c ? '<div class="pen-row">' + c + '</div>' : '';
}

// „deblochează" la prima interacțiune (cerință de browser). Comutabil din bifa difuzor din header.
const SFX = (() => {
  let ctx = null, master = null;
  const VOL = 3.6; // multiplicator global de volum (gain-urile per-notă sunt relative)
  let enabled = (localStorage.getItem('rentz_sound') || '1') === '1'; // implicit PORNIT
  function ac() {
    if(!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
      master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination); // tavan anti-clipping

    if(ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }

  function note(c, freq, t0, dur, gain, type, sweepTo) {

  }

// Generarea pachetului în funcție de numărul de jucători setat din cameră
function dealCards(maxPlayers) {
  const deck = [];
  const activeRanks = maxPlayers === 3 ? ['9','10','J','Q','K','A'] : ['7','8','9','10','J','Q','K','A'];
  for(const s of SUITS) {
    for(const r of activeRanks) {
      deck.push({suit:s,rank:r});
    }
  }
  const sh = shuffle(deck);
  if(maxPlayers === 3) {
    return [sh.slice(0,8), sh.slice(8,16), sh.slice(16,24)]; // 8 cărți per om
  }
  return [sh.slice(0,8), sh.slice(8,16), sh.slice(16,24), sh.slice(24,32)];
}

// ── SLOTURI FIXE PE MASĂ (jocuri non-etalate) ────────────────────────────────
// Rândul de sus = boții (în ORDINEA din panelul oponenților); rândul de jos = Eu.
// Slot gol = chenar (mărimea cărții) cu watermark = numele; slot ocupat = nume sus +
// carte + glow. Folosit ȘI de overlay-ul „mână luată" (aceleași sloturi, câștigător evidențiat).
function _trickSlotCellHtml(pi, players, playsByPlayer, winnerIdx, currentPlayer, glowKey) {
  const name = (players && players[pi]) || '?';
  // În partidele hibride marcăm boții cu „AI" și în sloturile de pe masă.
  const isBotSeat = !window.isSinglePlayer && roomData && roomData.players && roomData.players[pi] && roomData.players[pi].isBot;
  const aiTag = isBotSeat ? '<span class="trick-slot-ai">AI</span>' : '';
  const card = playsByPlayer ? playsByPlayer[pi] : null;
  const winCls = (winnerIdx === pi) ? ' is-winner' : '';
  if(card) {
    const key = card.rank + card.suit;
    const glow = (glowKey && glowKey === (key + pi)) ? ' glow' : '';
    const img = CARD_IMG[key]
      ? `<img src="${CARD_IMG[key]}" alt="${key}" draggable="false"/>`
      : `<span class="slot-fallback">${card.rank}${card.suit}</span>`;
    return `<div class="trick-slot${winCls}" data-player="${pi}">
      <div class="trick-slot-name">${aiTag}${name}</div>
      <div class="trick-slot-frame filled${glow}">${img}</div>
    </div>`;
  }
  const curCls = (currentPlayer === pi) ? ' is-current' : '';
  // Numele „fantomă" sus (vizibilitate ascunsă) ⇒ chenarul stă la aceeași înălțime ca slotul ocupat.
  return `<div class="trick-slot${curCls}" data-player="${pi}">
    <div class="trick-slot-name" style="visibility:hidden;">${aiTag}${name}</div>
    <div class="trick-slot-frame empty"><span class="wm">${name}</span></div>
  </div>`;
}

function renderTrickSlots(hostEl, opts) {
  const { topOrder, meIndex, players, playsByPlayer, winnerIdx, currentPlayer, glowKey } = opts;
  const ord = topOrder || [];
  const cell = pi => _trickSlotCellHtml(pi, players, playsByPlayer, winnerIdx, currentPlayer, glowKey);
  // ROMB (citirea circulară păstrată): oppOrder[0]=STÂNGA, [1]=SUS (față-în-față), [2]=DREAPTA;
  // la 3 jucători (2 adversari): stânga + dreapta (triunghi). Eu — mereu JOS. Centrul e liber
  // (acolo face zoom cartea câștigătoare la reveal).
  let left = '', topC = '', right = '';
  if(ord.length >= 3){ left = cell(ord[0]); topC = cell(ord[1]); right = cell(ord[2]); }
  else if(ord.length === 2){ left = cell(ord[0]); right = cell(ord[1]); }
  else if(ord.length === 1){ topC = cell(ord[0]); }
  hostEl.innerHTML = `<div class="trick-slots ts-diamond" id="trickSlots">
    <div class="ts-pos ts-top">${topC}</div>
    <div class="ts-pos ts-left">${left}</div>
    <div class="ts-pos ts-mid"></div>
    <div class="ts-pos ts-right">${right}</div>
    <div class="ts-pos ts-bottom">${cell(meIndex)}</div>
  </div>`;
}

function sizeTrickSlots(slotsEl) {
  if(!slotsEl) return;
  const host = slotsEl.parentElement;
  if(!host) return;
  const RATIO = 110 / 75;
  // ── ANCORARE COMUNĂ pe .table-area: masa ȘI overlay-ul de levată își calculează
  // dimensiunile și pozițiile din ACEEAȘI cutie de referință. Înainte, fiecare măsura
  // propriul host (tableContent vs. overlay inset:0) — cutii ușor diferite ⇒ la ultima
  // carte, în crossfade, lateralele și slotul meu „tremurau" câțiva pixeli. Acum sunt
  // identice pixel-cu-pixel. ──
  const ta = host.closest('.table-area') || host;
  const taR = ta.getBoundingClientRect();
  const hostR = host.getBoundingClientRect();
  const availW = taR.width - 6;
  const availH = taR.height - 6;
  if(availW < 20 || availH < 20) return;
  const hasTop = !!slotsEl.querySelector('.ts-top .trick-slot');
  const gap = 8, nameH = 16, EXTRA = 4, minMid = 14;
  const EDGE = hasTop ? (_effViewW() > 899 ? 18 : 12) : 48; // 4j: 12 (mobil) / 18 (desktop, ×1.5); 3j: 48 (×4)
  // ȚINTA = mărimea cărților din mâna mea (măsurată live; fallback --card-w).
  const handC = document.querySelector('#handCards .card');
  let target = handC ? Math.round(handC.getBoundingClientRect().width) : 0;
  if(!(target > 20)) target = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 75;
  // LĂȚIME: stânga + centru + dreapta trebuie să încapă una lângă alta.
  const wByWidth = Math.floor((availW - gap * 2) / 3);
  // ÎNĂLȚIME: la 4j — două benzi (sus + jos) cu golul minim și EDGE respectate;
  // la 3j — lateralele (sus) și slotul meu (jos) sunt pe COLOANE diferite, deci NU se
  // pot atinge: mărimea nu e penalizată de golul mare (48px), rămâne cea a mâinii.
  const wByHeight = hasTop
    ? Math.floor(((availH - minMid - EDGE * 2) / 2 - nameH - EXTRA) / RATIO)
    : Math.floor(((availH - EDGE * 2) - nameH - EXTRA) / RATIO);
  let cardW = Math.min(target, wByWidth, wByHeight);
  cardW = Math.max(cardW, 16);
  const cardH = Math.round(cardW * RATIO);
  const nameFont = Math.max(8, Math.min(13, Math.round(cardW * 0.30)));
  const wmFont   = Math.max(7, Math.round(cardW * 0.20));
  slotsEl.querySelectorAll('.trick-slot').forEach(s => { s.style.width = cardW + 'px'; });
  slotsEl.querySelectorAll('.trick-slot-frame').forEach(f => { f.style.width = cardW + 'px'; f.style.height = cardH + 'px'; });
  slotsEl.querySelectorAll('.trick-slot-name').forEach(n => { n.style.fontSize = nameFont + 'px'; n.style.maxWidth = cardW + 'px'; });
  slotsEl.querySelectorAll('.trick-slot-frame.empty .wm').forEach(w => { w.style.fontSize = wmFont + 'px'; });
  slotsEl.querySelectorAll('.trick-slot-frame .slot-fallback').forEach(w => { w.style.fontSize = Math.max(10, Math.round(cardW * 0.30)) + 'px'; });
  // ── Poziționare (toate coordonatele pornesc din taR, convertite în locale) ──
  const toX = vx => (vx - hostR.left) + 'px';
  const toY = vy => (vy - hostR.top) + 'px';
  const cxMid = taR.left + taR.width / 2;
  const slotFullH = nameH + 3 + cardH; // nume + margine + carte
  // SUS (doar la 4 jucători): centrat, la EDGE px de marginea de sus a mesei.
  const topPos = slotsEl.querySelector('.ts-top');
  if(topPos && topPos.querySelector('.trick-slot')){
    topPos.style.left = toX(cxMid); topPos.style.top = toY(taR.top + EDGE);
    topPos.style.bottom = 'auto'; topPos.style.transform = 'translateX(-50%)';
  }
  // JOS (eu): la EDGE px de marginea de jos (ACEEAȘI distanță ca sus) — înălțimea REALĂ
  // a slotului e măsurată după dimensionare (nume + carte), nu estimată.
  const botPos = slotsEl.querySelector('.ts-bottom');
  if(botPos){
    botPos.style.left = toX(cxMid);
    const bh = botPos.offsetHeight || slotFullH;
    botPos.style.top = toY(taR.bottom - EDGE - bh);
    botPos.style.bottom = 'auto'; botPos.style.transform = 'translateX(-50%)';
  }
  // LATERALE: X = sub MIJLOCUL panoului adversarului corespunzător; Y = centrul mesei la
  // 4 jucători, respectiv RÂNDUL DE SUS la 3 jucători (la EDGE px de marginea de sus —
  // aceeași distanță ca a slotului meu față de marginea de jos ⇒ ansamblu centrat).
  ['ts-left', 'ts-right'].forEach(cls => {
    const pos = slotsEl.querySelector('.' + cls);
    const slot = pos && pos.querySelector('.trick-slot');
    if(!pos || !slot) return;
    // Pe durata alunecării FLIP (schimbarea sensului), panourile sunt transformate —
    // centrele lor măsurate ar fi FALSE. Păstrăm X-ul deja corect (setat sincron
    // înainte de FLIP); doar Y/transform se actualizează (nu depind de panouri).
    const flipHold = window._panelsFlipUntil && Date.now() < window._panelsFlipUntil;
    if(!flipHold){
      const panel = document.querySelector('#opponentsRow .opponent[data-player="' + slot.dataset.player + '"]');
      const pr = panel ? panel.getBoundingClientRect() : null;
      let cx = pr ? (pr.left + pr.width / 2) : (cls === 'ts-left' ? taR.left + taR.width * 0.18 : taR.left + taR.width * 0.82);
      const half = cardW / 2 + 4; // clemă: cartea să rămână întreagă pe masă
      cx = Math.max(taR.left + half, Math.min(taR.right - half, cx));
      pos.style.left = toX(cx);
    }
    pos.style.right = 'auto'; pos.style.bottom = 'auto';
    if(hasTop){
      pos.style.top = toY(taR.top + taR.height / 2);
      pos.style.transform = 'translate(-50%, -50%)';
    } else {
      pos.style.top = toY(taR.top + EDGE);
      pos.style.transform = 'translateX(-50%)';
    }
  });
}

// ── ANIMAȚIE „CARTE CARE ZBOARĂ PE MASĂ" ──────────────────────────────────────────────────────
// Când se joacă o carte (etalate sau sloturi live), un SPATE de carte zboară repede de la jucător
// (zoom mic→mare) și se așază pe slot/celulă; abia la ATERIZARE apare glow-ul. Totul ~1s. Aditiv și
// cu degradare grațioasă: dacă rect-urile nu se pot calcula, cartea apare normal (cu glow imediat).
// Robust la re-randări (ecouri realtime / boți rapizi): ținem un registru al zborurilor active; după
// fiecare randare a mesei re-ascundem destinațiile încă „în zbor" (applyCardFlightHide), iar la
// aterizare regăsim elementul-destinație CURENT (re-randarea îi schimbă identitatea în DOM).
window._cardFlights = window._cardFlights || {};
const FLIGHT_MS = 1000, FLIGHT_REVEAL_AT = 0.82;
function _flightRegKey(mode, cardKey, player){ return mode + ':' + cardKey + ':' + player; }

// Elementul-destinație CURENT al unui zbor (supraviețuiește re-randării mesei).
function findFlightDest(f){
  if(!f) return null;
  if(f.mode === 'slot'){
    // Cât timp există overlay-ul de levată, sub el RĂMÂNE și grila mesei (crossfade) —
    // căutăm ținta DOAR în overlay, altfel selectorul ar nimeri rama de dedesubt.
    const scope = document.getElementById('trickTakenOverlay') || document;
    return scope.querySelector('#trickSlots .trick-slot[data-player="' + f.player + '"] .trick-slot-frame.filled');
  }
  // etalate: celula cu data-card potrivit (evităm unicode în selector → iterăm)
  const cells = document.querySelectorAll('.rentz-row-card');
  for(const c of cells){ if(c.dataset && c.dataset.card === f.cardKey) return c; }
  return null;
}

// Re-ascunde destinațiile zborurilor încă active (apelat după fiecare randare a mesei).
function applyCardFlightHide(){
  const map = window._cardFlights;
  for(const k in map){ const dest = findFlightDest(map[k]); if(dest) dest.style.visibility = 'hidden'; }
}

// Dreptunghiul-sursă al zborului (zona jucătorului). Fallback: centru sus/jos viewport.
function _flightSourceRect(player){
  const meIdx = (window._humanIndex ?? myIndex);
  let el = null;
  if(player === meIdx){ el = document.getElementById('handCards'); }
  else { const opp = document.querySelector('.opponent[data-player="' + player + '"]'); el = opp ? (opp.querySelector('.opp-cards') || opp) : null; }
  if(el){ const r = el.getBoundingClientRect(); if(r.width > 2 && r.height > 2) return r; }
  const W = window.innerWidth, H = window.innerHeight;
  return (player === meIdx) ? { left: W/2 - 20, top: H - 60, width: 40, height: 56 }
                            : { left: W/2 - 20, top: 20, width: 40, height: 56 };
}

// Pornește un zbor: spate de carte de la jucător → slot/celulă, apoi glow la aterizare.
// onLanded(destElCurent) primește elementul-destinație curent ca să-i pună glow-ul potrivit.
function flyCardToTable(player, mode, cardKey, onLanded){
  const regKey = _flightRegKey(mode, cardKey, player);
  const land = (el) => { try { if(onLanded) onLanded(el); } catch(e){} };
  let dest = null;
  try { dest = findFlightDest({ mode, cardKey, player }); } catch(e){ dest = null; }
  if(!dest){ delete window._cardFlights[regKey]; land(null); return; }
  // Înainte de a măsura slotul-destinație ne asigurăm că sloturile au mărimea FINALĂ (nu mărimea
  // naturală a PNG-ului dintr-un frame tocmai re-randat) → ținta zborului e corectă, fără „cât toată masa".
  if(mode === 'slot'){ try { sizeTrickSlots(document.getElementById('trickSlots')); } catch(e){} }
  const dr = dest.getBoundingClientRect();
  if(dr.width < 6 || dr.height < 6){ delete window._cardFlights[regKey]; dest.style.visibility = ''; land(dest); return; }

  const isMe = (player === (window._humanIndex ?? myIndex));
  // Sursa: pentru cartea MEA folosim poziția EXACTĂ a cărții din mână, capturată la click (înainte
  // să fie scoasă). Pentru adversari, zona panoului lor. Fallback: _flightSourceRect.
  let sr, exactMine = false;
  const po = window._myPlayOrigin;
  if(isMe && po && po.key === cardKey && (Date.now() - po.ts) < 6000){
    sr = { left: po.left, top: po.top, width: po.width, height: po.height };
    window._myPlayOrigin = null; exactMine = true;     // consumat
  } else {
    sr = _flightSourceRect(player);
  }

  dest.style.visibility = 'hidden';                 // ascundem cartea reală cât zboară cea animată
  const fly = document.createElement('div');
  if(isMe){
    // Cartea MEA vine cu FAȚA (o văd oricum în mână) — exact cartea jucată.
    fly.className = 'fly-card-face';
    const img = CARD_IMG[cardKey];
    if(img){ fly.innerHTML = '<img src="' + img + '" alt="' + cardKey + '" draggable="false" style="width:100%;height:100%;border-radius:6px;display:block;"/>'; }
    else { const suit = cardKey.slice(-1), rank = cardKey.slice(0, -1); const red = (suit==='♥'||suit==='♦'); fly.textContent = rank + suit; fly.style.color = red ? '#d22' : '#222'; }
  } else {
    fly.className = 'fly-card-back';                 // adversarii vin cu SPATELE
  }
  fly.style.width = dr.width + 'px'; fly.style.height = dr.height + 'px';
  fly.style.left = dr.left + 'px';   fly.style.top = dr.top + 'px';
  document.body.appendChild(fly);

  const sx = (sr.left + sr.width/2) - (dr.left + dr.width/2);
  const sy = (sr.top + sr.height/2) - (dr.top + dr.height/2);
  const rot = isMe ? -6 : 8;
  // Cartea mea pleacă de la mărimea REALĂ din mână (se așază natural în slot); adversarii fac zoom-in.
  let startScale = isMe ? (exactMine ? (sr.width / dr.width) : 0.85) : 0.40;
  if(!(startScale > 0.15)) startScale = 0.40;
  if(startScale > 2.2) startScale = 2.2;
  const startOpacity = isMe ? 1 : 0.25;
  const midScale = startScale + (1 - startScale) * 0.78;

  let revealed = false;
  const reveal = () => {
    if(revealed) return; revealed = true;
    delete window._cardFlights[regKey];
    const cur = findFlightDest({ mode, cardKey, player });   // re-găsim dest-ul CURENT (post re-randare)
    if(cur){ cur.style.visibility = ''; land(cur); } else { land(null); }
  };

  let anim = null;
  try {
    anim = fly.animate([
      { transform: `translate(${sx}px, ${sy}px) scale(${startScale}) rotate(${rot}deg)`, opacity: startOpacity },
      { transform: `translate(${sx*0.18}px, ${sy*0.18}px) scale(${midScale}) rotate(${rot*0.3}deg)`, opacity: 1, offset: 0.7 },
      { transform: 'translate(0px,0px) scale(1) rotate(0deg)', opacity: 1, offset: FLIGHT_REVEAL_AT },
      { transform: 'translate(0px,0px) scale(1) rotate(0deg)', opacity: 0 }
    ], { duration: FLIGHT_MS, easing: 'cubic-bezier(.22,.7,.25,1)', fill: 'forwards' });
  } catch(e){ fly.remove(); reveal(); return; }   // Web Animations indisponibil → carte + glow direct

  const cleanup = () => { try { fly.remove(); } catch(e){} };
  const revealTimer = setTimeout(reveal, Math.round(FLIGHT_MS * FLIGHT_REVEAL_AT)); // arătăm cartea reală sub cea care se dizolvă
  anim.onfinish = () => { clearTimeout(revealTimer); reveal(); cleanup(); };
  anim.oncancel = () => { clearTimeout(revealTimer); reveal(); cleanup(); };
  setTimeout(() => { reveal(); cleanup(); }, FLIGHT_MS + 250);  // plasă de siguranță dură
}

// Un PAS: o carte cu „Pas" scris pe ea zboară de la jucătorul care a pasat spre CENTRUL tablei și
// se stinge (nu are slot unde să aterizeze). Originea arată DE LA CINE vine pasul — la fel ca la
// cărțile jucate. Aditiv și cu degradare grațioasă (dacă nu se pot calcula pozițiile, nu apare nimic).
function flyPassCard(player){
  try {
    const board = document.getElementById('rentzBoard') || document.querySelector('.table-area');
    if(!board) return;
    const br = board.getBoundingClientRect();
    if(br.width < 10 || br.height < 10) return;
    // Mărimea: ~ ca o celulă din tablă; altfel un default rezonabil din --card-w.
    let cw = 0, chh = 0;
    const sampleCell = board.querySelector('.rentz-row-card');
    if(sampleCell){ const cr = sampleCell.getBoundingClientRect(); if(cr.width > 8){ cw = cr.width; chh = cr.height; } }
    if(!(cw > 8)){ const cssW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 60; cw = cssW; chh = Math.round(cw * 110/75); }
    // Plasă anti-„Pas gigant": dacă am prins o celulă încă NESCALATĂ (tabla tocmai
    // reconstruită, applyRentzScale n-a rulat încă), limităm la o mărime rezonabilă.
    const _capW = Math.max(44, Math.min(120, Math.round(Math.min(br.width, br.height) * 0.26)));
    if(cw > _capW){ cw = _capW; chh = Math.round(cw * 110/75); }
    const destCx = br.left + br.width/2, destCy = br.top + br.height/2;
    const sr = _flightSourceRect(player);
    const isMe = (player === (window._humanIndex ?? myIndex));

    const fly = document.createElement('div');
    fly.className = 'fly-card-pass';
    fly.textContent = 'Pas';
    fly.style.width = cw + 'px'; fly.style.height = chh + 'px';
    fly.style.left = (destCx - cw/2) + 'px';
    fly.style.top = (destCy - chh/2) + 'px';
    fly.style.fontSize = Math.max(11, Math.round(cw * 0.30)) + 'px';
    document.body.appendChild(fly);

    const sx = (sr.left + sr.width/2) - destCx;
    const sy = (sr.top + sr.height/2) - destCy;
    const rot = isMe ? -6 : 8;

    let anim = null;
    try {
      anim = fly.animate([
        { transform: `translate(${sx}px, ${sy}px) scale(0.45) rotate(${rot}deg)`, opacity: 0.25 },
        { transform: `translate(${sx*0.18}px, ${sy*0.18}px) scale(0.96) rotate(${rot*0.3}deg)`, opacity: 1, offset: 0.6 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1, offset: 0.8 },
        { transform: 'translate(0,0) scale(1.05) rotate(0deg)', opacity: 0 }
      ], { duration: FLIGHT_MS, easing: 'cubic-bezier(.22,.7,.25,1)', fill: 'forwards' });
    } catch(e){ fly.remove(); return; }
    const cleanup = () => { try { fly.remove(); } catch(e){} };
    anim.onfinish = cleanup; anim.oncancel = cleanup;
    setTimeout(cleanup, FLIGHT_MS + 250);
  } catch(e){}
}

// ── MOTOR „SPARGERE ÎN CIOBURI" ───────────────────────────────────────────────
// Cele 8 cioburi triunghiulare (decupaje din aceeași imagine) + direcția radială în care
// fuge fiecare (dx,dy normalizate spre marginea exterioară a triunghiului).
const SHATTER_WEDGES = [
  { clip:'polygon(50% 50%, 0 0, 50% 0)',          dx:-0.5, dy:-1   },
  { clip:'polygon(50% 50%, 50% 0, 100% 0)',       dx: 0.5, dy:-1   },
  { clip:'polygon(50% 50%, 100% 0, 100% 50%)',    dx: 1,   dy:-0.5 },
  { clip:'polygon(50% 50%, 100% 50%, 100% 100%)', dx: 1,   dy: 0.5 },
  { clip:'polygon(50% 50%, 100% 100%, 50% 100%)', dx: 0.5, dy: 1   },
  { clip:'polygon(50% 50%, 50% 100%, 0 100%)',    dx:-0.5, dy: 1   },
  { clip:'polygon(50% 50%, 0 100%, 0 50%)',       dx:-1,   dy: 0.5 },
  { clip:'polygon(50% 50%, 0 50%, 0 0)',          dx:-1,   dy:-0.5 }
];

// Sparge O carte (element cu <img> înăuntru) în 8 cioburi animate. mode: 'scatter' | 'grow'.
function shatterCard(cardEl, mode) {
  if(!cardEl || cardEl.dataset.shattered === '1') return false;
  const img = cardEl.querySelector('img');
  if(!img || !img.src) return false; // fără imagine (fallback text) nu fragmentăm
  const bg = `url("${img.src}")`;
  cardEl.dataset.shattered = '1';
  const cs = getComputedStyle(cardEl);
  if(cs.position === 'static') cardEl.style.position = 'relative';
  cardEl.style.overflow = 'visible';
  const isGrow = (mode === 'grow');
  const layer = document.createElement('div');
  layer.className = 'shatter-layer';
  const jit = () => (Math.random() - 0.5);
  for(let i = 0; i < 8; i++) {
    const w = SHATTER_WEDGES[i];
    const shard = document.createElement('div');
    shard.className = 'shard ' + (isGrow ? 'grow' : 'scatter');
    shard.style.backgroundImage = bg;
    shard.style.clipPath = w.clip;
    shard.style.webkitClipPath = w.clip;
    const dist = isGrow ? (10 + Math.random() * 20) : (34 + Math.random() * 48);
    shard.style.setProperty('--dx', (w.dx * dist + jit() * 10).toFixed(1) + 'px');
    shard.style.setProperty('--dy', (w.dy * dist + jit() * 10).toFixed(1) + 'px');
    shard.style.setProperty('--rot', (jit() * (isGrow ? 35 : 140)).toFixed(1) + 'deg');
    if(isGrow) shard.style.setProperty('--sc', (1.5 + Math.random() * 0.7).toFixed(2));
    shard.style.animationDelay = (Math.random() * (isGrow ? 140 : 70)).toFixed(0) + 'ms';
    layer.appendChild(shard);
  }
  img.style.visibility = 'hidden';
  cardEl.appendChild(layer);
  return true;
}

// Sparge TOATE cărțile (cu imagine) dintr-un container. Întoarce câte au fost sparte.
function shatterAllIn(container, cardSelector, mode) {
  if(!container) return 0;
  let n = 0;
  container.querySelectorAll(cardSelector).forEach(el => { if(shatterCard(el, mode)) n++; });
  return n;
}

let _trickTakenTimeout = null;

// ── Rearanjează sloturile din overlay-ul de levată după SENSUL curent — exact aceeași
// construcție ca la creare (topOrder + _swapSeats), apelată la comutatorul de sens, ca
// overlay-ul să se miște la fel ca panourile adversarilor (care funcționau corect). ──
function resyncTrickOverlaySlots(){
  const ov = document.getElementById('trickTakenOverlay');
  if(!ov) return;
  const s = roomData, gs = s && s.gameState;
  if(!gs) return;
  const td = gs.pendingTrick || gs.spTrickDisplay;

  const maxP = s.maxPlayers || td.trick.length;
  const meIndex = (window._humanIndex != null) ? window._humanIndex : (typeof myIndex === 'number' ? myIndex : 0);
  const topOrder = [];
  for(let k = 1; k < maxP; k++) topOrder.push((meIndex + k) % maxP);

// ── Numărătoare inversă „Confirm mâna" (3→0) cu auto-confirmare ───────────────
// Butonul arată „(5)…(4)…(3)…(2)…(1)…(0)" și dacă jucătorul NU apasă, levata se confirmă
// singură la 0. Cheia per-levată (rundă + nr. levate) ⇒ nu repornește la re-randări,
// dar repornește la o levată nouă. Valoarea curentă se re-injectează în span la fiecare
// randare (statusBar se reconstruiește), deci numărul nu „clipește".
window._cdTimer = window._cdTimer || null;
window._cdKey = window._cdKey || null;
window._cdVal = (window._cdVal != null) ? window._cdVal : 5;
function updateConfirmCountdownLabel(){
  const el = document.getElementById('confirmCountdown');
  if(el) el.textContent = ' (' + Math.max(0, window._cdVal) + ')';
}
function startConfirmCountdown(key, onTimeout){
  if(window._cdKey === key && window._cdTimer) return; // deja pornit pt. această levată
  clearConfirmCountdown();
  window._cdKey = key;
  window._cdVal = 5;
  updateConfirmCountdownLabel();
  window._cdTimer = setInterval(() => {
    window._cdVal--;
    updateConfirmCountdownLabel();
    if(window._cdVal <= 0){
      clearConfirmCountdown();
      try { onTimeout && onTimeout(); } catch(e){}
    }
  }, 1000);
}
function clearConfirmCountdown(){
  if(window._cdTimer){ clearInterval(window._cdTimer); window._cdTimer = null; }
  window._cdKey = null;
}

function showTrickTakenOverlay(trick, winnerName, winnerIdx, players, confirmed) {
  // Anulăm un eventual timer de „zoom out" rămas de la levata anterioară, ca să nu cumva
  // să șteargă acest overlay nou (altfel levata următoare ar dispărea prematur).
  if(_trickTakenTimeout) { clearTimeout(_trickTakenTimeout); _trickTakenTimeout = null; }
  // „Reveal" ultima carte: se mărește cât masa, apoi coboară DIRECT în slotul ei (fără fantomă).
  // Butonul „Confirmă mâna" rămâne ascuns până aterizează (window._trickRevealAnimating), ca să nu
  // se suprapună cu zoom-in-ul de DUPĂ confirmare. Curățăm timerele unei reveal-ări anterioare.
  if(window._trickRevealTimers) { window._trickRevealTimers.forEach(t => clearTimeout(t)); }
  window._trickRevealTimers = [];
  window._trickRevealAnimating = true;
  const old = document.getElementById('trickTakenOverlay');
  if(old) old.remove();

  const tableArea = document.querySelector('.table-area');
  if(!tableArea) return;

  // Aceleași sloturi ca pe masă: sus = boții (ordinea din panel), jos = Eu. Toate ocupate
  // cu cărțile levatei, slotul câștigătorului evidențiat.
  const maxP = (roomData && (roomData.maxPlayers || (roomData.players && roomData.players.length))) || trick.length;
  const meIndex = (window._humanIndex != null) ? window._humanIndex : (typeof myIndex === 'number' ? myIndex : 0);
  const topOrder = [];
  for(let k=1; k<maxP; k++) topOrder.push((meIndex + k) % maxP);
  if(window._swapSeats) topOrder.reverse(); // același sens ca masa (comutatorul din header)
  const playsByPlayer = {};
  trick.forEach(p => { playsByPlayer[p.player] = p.card; });

  const ov = document.createElement('div');
  ov.id = 'trickTakenOverlay';
  ov.innerHTML = `
    <div id="trickSlotsOverlayHost" style="position:relative;z-index:1;flex:1;min-height:0;width:100%;display:flex;"></div>
    <div class="trick-confirm-list" id="trickConfirmList" style="position:relative;z-index:1;display:none;"></div>
    <div id="trickConfirmBtn" style="display:none;"></div>
  `;
  tableArea.appendChild(ov);

  const host = ov.querySelector('#trickSlotsOverlayHost');
  renderTrickSlots(host, { topOrder, meIndex, players, playsByPlayer, winnerIdx, currentPlayer: -1, glowKey: null });
  // ULTIMA carte (cea care a închis levata) o aducem ÎN ZBOR spre slotul ei — la fel ca cele
  // intermediare (înainte trecea „direct" prin overlay). O ascundem ACUM, sincron (înainte de paint),
  // ca să nu clipească; reveal-ul cărții CÂȘTIGĂTOARE pornește abia după ce aterizează.
  const _lastPlayed = (trick && trick.length) ? trick[trick.length - 1] : null;
  let _lastCk = null;
  if(_lastPlayed && _lastPlayed.card){
    _lastCk = _lastPlayed.card.rank + _lastPlayed.card.suit;
    window._cardFlights[_flightRegKey('slot', _lastCk, _lastPlayed.player)] = { mode:'slot', cardKey: _lastCk, player: _lastPlayed.player };
    applyCardFlightHide();
  }
  const slotsEl = host.querySelector('#trickSlots');
  const doSize = () => sizeTrickSlots(slotsEl);
  // SINCRON, înainte de primul paint: fără asta, sloturile overlay-ului rămâneau
  // nedimensionate ~3 cadre (dimensionarea venea abia după 3×rAF) și cărțile
  // „dispăreau" apoi reapăreau brusc. Acum overlay-ul se naște gata dimensionat;
  // reîncercările async de mai jos rămân drept corectori (layout târziu / rotiri).
  doSize();
  requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(() => {
    doSize(); setTimeout(doSize, 0); setTimeout(doSize, 130);
    updateTrickOverlayContent(confirmed, players);
    // Reveal-ul câștigătorului (zoom mare → în slot). Îl pornim DUPĂ aterizarea cărții în zbor.
    const startReveal = () => { window._trickRevealTimers.push(setTimeout(() => _revealLastTrickCard(ov, host, trick), 120)); };
    if(_lastPlayed && _lastCk){
      requestAnimationFrame(() => requestAnimationFrame(() => {
        flyCardToTable(_lastPlayed.player, 'slot', _lastCk, (el) => { if(el) el.classList.add('glow'); SFX.play('trick'); startReveal(); });
      }));
    } else {
      SFX.play('trick');
      startReveal();
    }
  })));
}

// „Reveal": ultima carte jucată crește mare (cât masa, centrat), ține o clipă, apoi coboară DIRECT
// în slotul ei (aceeași carte, fără fantomă/zoom-out). La final arătăm cartea reală din slot, scoatem
// clona și abia atunci apare butonul „Confirmă mâna" (re-randăm statusBar).
function _revealLastTrickCard(ov, host, trick) {
  try {
    if (!ov || !ov.isConnected || !host || !trick || !trick.length) {
      window._trickRevealAnimating = false;
      return;
    }

    // Calculăm cartea câștigătoare a levatei
    // (Presupunem că RV este disponibil global, altfel înlocuiește cu obiectul tău de valori)
    const leadSuit = trick[0].card.suit;
    let lastPlay = trick[0];

    for (let i = 1; i < trick.length; i++) {
      if (trick[i].card.suit === leadSuit) {
        if (lastPlay.card.suit !== leadSuit || RV[trick[i].card.rank] > RV[lastPlay.card.rank]) {
          lastPlay = trick[i];
        }
      }
    }

    const slotEl = host.querySelector('.trick-slot[data-player="' + lastPlay.player + '"]');
    const frame = slotEl ? slotEl.querySelector('.trick-slot-frame.filled') : null;
    const ovRect = ov.getBoundingClientRect();
    const slotRect = frame ? frame.getBoundingClientRect() : null;

    if (!frame || !slotRect || slotRect.width < 4 || ovRect.height < 4) {
      window._trickRevealAnimating = false;
      return;
    }

    const clone = frame.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.margin = '0';
    clone.style.left = (slotRect.left - ovRect.left) + 'px';
    clone.style.top  = (slotRect.top  - ovRect.top)  + 'px';
    clone.style.width = slotRect.width + 'px';
    clone.style.height = slotRect.height + 'px';
    clone.style.zIndex = '6';
    clone.style.transformOrigin = 'center center';
    clone.style.pointerEvents = 'none';

    ov.appendChild(clone);
    frame.style.visibility = 'hidden';

    const scH = (ovRect.height * 0.82) / slotRect.height;
    const scW = (ovRect.width  * 0.92) / slotRect.width;
    const sc  = Math.max(1.05, Math.min(scH, scW));
    const cloneCx = (slotRect.left - ovRect.left) + slotRect.width / 2;
    const cloneCy = (slotRect.top  - ovRect.top)  + slotRect.height / 2;
    const dx = (ovRect.width / 2) - cloneCx;
    const dy = (ovRect.height / 2) - cloneCy;

    clone.style.transition = 'none';
    clone.style.transform = 'translate(0,0) scale(1)';
    clone.getBoundingClientRect();

    requestAnimationFrame(() => {
      clone.style.transition = 'transform 0.42s cubic-bezier(.2,.7,.3,1)';
      clone.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ')';
    });

    const t1 = setTimeout(() => {
      if(!clone.isConnected) return;
      clone.style.transition = 'transform 0.46s cubic-bezier(.4,0,.2,1)';
      clone.style.transform = 'translate(0,0) scale(1)';
    }, 620);

    const t2 = setTimeout(() => {
      if(frame) frame.style.visibility = '';
      if(clone.parentNode) clone.parentNode.removeChild(clone);
      window._trickRevealAnimating = false;
      const st = roomData && roomData.gameState;
      if(st && (st.pendingTrick || st.spTrickDisplay)) { try { renderGame(); } catch(e){} }
    }, 1120);

    window._trickRevealTimers.push(t1, t2);
  } catch(e) {
    window._trickRevealAnimating = false;
  }
}

function updateTrickOverlayContent(confirmed, players) {
  // Overlay-ul arată doar cărțile — confirmat names sunt în statusBar
  const listEl = document.getElementById('trickConfirmList');
  if(listEl) listEl.style.display = 'none';
}

async function confirmTrick() {
  if(window._pendingConfirm) return;
  if(!roomData.gameState.pendingTrick) return;
  if((roomData.gameState.pendingTrick.confirmed || []).includes(myIndex)) return;

  window._pendingConfirm = true;
  // Forțăm re-render statusBar să arate "Se confirmă..." (doar dacă randarea nu e suprimată, ex. bot)
  if(!window._suppressRender) {
    const sb = document.getElementById('statusBar');
    if(sb) sb.innerHTML = `<span style="color:#ffdd80;opacity:0.7;">Se confirmă...</span>`;
  }

  if(window.isSinglePlayer) {
    const s = roomData;
    const maxP = s.maxPlayers || s.players.length || 4;
    const humanIdx = window._humanIndex ?? myIndex;
    const confirmed = s.gameState.pendingTrick.confirmed || [];
    if(!confirmed.includes(humanIdx)) confirmed.push(humanIdx);
    s.gameState.pendingTrick.confirmed = confirmed;
    if(confirmed.length >= maxP) s.gameState.pendingTrick = null;
    roomData = s;
    window._pendingConfirm = false;
    onRoomUpdate();
    scheduleBotTurnIfNeeded();
    return;
  }

  const fresh = await getRoom(roomId);
  if(!fresh) { window._pendingConfirm = false; return; }
  const s = fresh.state || fresh;
  if(!s.gameState.pendingTrick) { window._pendingConfirm = false; roomData = s; return; }
  const confirmed = s.gameState.pendingTrick.confirmed || [];
  if(confirmed.includes(myIndex)) { window._pendingConfirm = false; roomData = s; return; }
  confirmed.push(myIndex);
  s.gameState.pendingTrick.confirmed = confirmed;
  // Mâna se închide când au confirmat TOȚI OAMENII. Boții nu confirmă (la multiplayer pur
  // toți sunt oameni, deci e identic cu „toți"; la hibrid, boții sunt excluși din socoteală).
  const maxPc = s.maxPlayers || s.players.length || 4;
  let allHumansConfirmed = true;
  for(let i = 0; i < maxPc; i++) {
    if(s.players[i] && !s.players[i].isBot && !confirmed.includes(i)) { allHumansConfirmed = false; break; }
  }
  if(allHumansConfirmed) s.gameState.pendingTrick = null;

  s._src = myPlayerId || ''; // semnăm scrierea — ecoul ei propriu va fi ignorat în handler
  await db.from('rentz_rooms').update({state: s}).eq('id', roomId);
  window._pendingConfirm = false;
  roomData = s;   // aplicăm + randăm LOCAL imediat (înainte, redarea confirmării venea din ecou;
  onRoomUpdate(); // tot de aici pornește și zoom+spargerea când au confirmat toți oamenii)

  // Verificare după 1.5s dacă confirmare s-a pierdut
  await new Promise(r => setTimeout(r, 1500));
  if(roomData.gameState?.pendingTrick && !(roomData.gameState.pendingTrick.confirmed||[]).includes(myIndex)) {
    const sbNow = document.getElementById('statusBar');
    if(sbNow) sbNow.innerHTML = `<span style="color:#ff5555;font-size:13px;font-weight:700;">⚠ Confirmare eșuată — încearcă din nou</span>`;
    // Auto-revine la randarea normală după 2.5s (chiar dacă nu vine update din Supabase)
    setTimeout(() => { renderGame(); }, 2500);
  }
}

// ─── BACKEND ACCESSORS ────────────────────────────────────────────────────────
async function getRoom(id) {
  if(window.isSinglePlayer) return {state: roomData};
  const {data, error} = await db.from('rentz_rooms').select('*').eq('id', id).single();
  if(error) return null; return data;
}
async function updateRoom(id, patch) {
  roomData = patch;
  if(window.isSinglePlayer) {
    try { localStorage.setItem('rentz_sp_state', JSON.stringify({myName, myIndex: (window._humanIndex ?? myIndex), state: patch})); } catch(e) {}
    onRoomUpdate();
    scheduleBotTurnIfNeeded();
    return;
  }
  // MULTIPLAYER — flux „ca la single-player": semnăm scrierea cu id-ul nostru (_src) ca
  // ecoul ei să fie IGNORAT în handler-ul realtime, apoi aplicăm și randăm LOCAL imediat
  // (onRoomUpdate conduce și lanțul boților prin scheduleBotTurnIfNeeded). Redarea NU mai
  // depinde de round-trip-ul rețelei; scrierea pleacă spre Supabase doar pentru CEILALȚI.
  patch._src = myPlayerId || '';
  try { onRoomUpdate(); } catch(e) {}
  await db.from('rentz_rooms').update({state: patch}).eq('id', id);
}
async function createRoomDB(id, state) {
  if(window.isSinglePlayer) { roomData = state; return true; }
  const {error} = await db.from('rentz_rooms').insert({id, state, created_at: new Date().toISOString()});
  return !error;
}
async function deleteRoomDB(id) {
  if(window.isSinglePlayer) return;
  await db.from('rentz_rooms').delete().eq('id', id);
}

// ─── REALTIME LISTENER ────────────────────────────────────────────────────────
function subscribeRoom(id) {
  if(realtimeSub) { try { db.removeChannel(realtimeSub); } catch(e){} realtimeSub=null; }
  if(window._hostGoneTimer) { clearTimeout(window._hostGoneTimer); window._hostGoneTimer = null; }
  window._sawHost = false;

  const meHostNow = () => !!roomData && (window._humanIndex ?? myIndex) === roomData.host;
  const hostInPresence = () => {
    try {
      const st = (realtimeSub && realtimeSub.presenceState && realtimeSub.presenceState()) || {};
      let found = false;
      Object.values(st).forEach(arr => (arr || []).forEach(m => { if(m && m.role === 'host') found = true; }));
      return found;
    } catch(e) { return true; } // în caz de eroare presupunem că gazda e prezentă (nu deconectăm degeaba)
  };

  realtimeSub = db.channel('room-'+id, { config: { presence: { key: myPlayerId || ('p-'+Math.random().toString(36).slice(2)) } } })
    .on('postgres_changes',{event:'*',schema:'public',table:'rentz_rooms',filter:`id=eq.${id}`},
      payload => {
        if (payload.eventType === 'DELETE') {
          // ATENȚIE: în Supabase Realtime, evenimentele DELETE IGNORĂ filtrul (id=eq.X) și
          // ajung la TOȚI clienții abonați la tabel, iar RLS nu se aplică la delete. De aceea
          // reacționăm DOAR dacă e camera NOASTRĂ — altfel curățarea (cron/trigger) altor
          // camere ne-ar arunca afară din jocul curent. payload.old conține cheia (id).
          if (payload.old && payload.old.id === roomId) {
            // Dacă jocul s-a ÎNCHEIAT deja (suntem pe Clasamentul Final), DELETE-ul NU e o anulare,
            // ci doar curățarea camerei făcută de gazdă la final (vezi renderFinal: deleteRoomDB
            // după 3s). Fără garda asta, DELETE-ul (care ajunge la TOȚI, inclusiv la gazdă) ne-ar
            // scoate din ecranul final după 3s, cu un mesaj greșit de „anulare". Rămânem pe loc —
            // ieșirea se face manual din buton (numărătoarea de 60s).
            if (roomData && roomData.screen === 'final') return;
            toast('Partida a fost anulată de către gazdă!');
            quitToHome();
          }
          return;
        }
        // ── FLUX „CA LA SINGLE-PLAYER": ecoul PROPRIILOR scrieri e IGNORAT ──────
        // updateRoom aplică orice scriere proprie LOCAL, sincron, și randează imediat —
        // exact ca la SP. Supabase însă ne trimite înapoi și ECOUL propriilor scrieri
        // (~100–300ms mai târziu), care re-randa tabla în MIJLOCUL animațiilor: cartea
        // botului „apărea brusc" înainte să pornească zborul, iar „Pas"-ul se măsura pe
        // o tablă în curs de reconstrucție (⇒ carte gigant). Fiecare scriere poartă acum
        // semnătura clientului care a făcut-o (state._src); ecourile PROPRII le aruncăm —
        // de la Supabase aplicăm DOAR scrierile altora. În gazdă+boți (toate scrierile
        // sunt ale gazdei) asta înseamnă zero ecouri aplicate = comportament identic SP.
        const inc = payload.new && payload.new.state;
        if (inc && inc._src && myPlayerId && inc._src === myPlayerId) return;
        // ── GARDĂ ANTI-REGRES pt. scrierile ALTORA (hibrid/online, RENTZ) ───────
        // Și ecourile străine pot sosi dezordonat. Fără gardă, un ecou VECHI regresa
        // starea: cărți care „dispar", chei de animație resetate (⇒ aceeași carte
        // „zboară de două ori") și — cel mai grav — botTurnKey vechi ≠ _botActedKey ⇒
        // gazda REPROGRAMA botul pe o mișcare deja jucată ⇒ mutare dublă reală.
        // La RENTZ avem un contor strict crescător per mișcare (gs.rentzSeq, incrementat
        // și la carte, și la pas), deci refuzăm determinist stările mai VECHI din ACEEAȘI
        // rundă — starea nu mai poate merge decât ÎNAINTE, exact ca la single-player.
        // (Stările cu seq EGAL trec — pot purta alte noutăți: finished, jucători, notice.)
        try {
          const cur = roomData;
          if (inc && cur && inc.gameState && cur.gameState
              && (inc.roundNumber || 0) === (cur.roundNumber || 0)
              && inc.gameState.mode === 'rentz' && cur.gameState.mode === 'rentz'
              && (inc.gameState.rentzSeq || 0) < (cur.gameState.rentzSeq || 0)) {
            return; // ecou întârziat cu stare mai veche — local suntem deja mai avansați
          }
        } catch(e) {}
        roomData = payload.new.state;
        onRoomUpdate();
      })
    .on('presence', { event: 'sync' }, () => {
      // Toată logica de deconectare/migrare/înlocuire-cu-bot stă în handlePresenceTimeouts.
      try { handlePresenceTimeouts(); } catch(e) {}
    })
    .subscribe(async (status) => {
      if(status === 'SUBSCRIBED') {
        // Ne anunțăm prezența. Gazda se marchează 'host' ca ceilalți să știe când dispare/revine.
        try { await realtimeSub.track({ role: meHostNow() ? 'host' : 'guest', idx: (window._humanIndex ?? myIndex) }); } catch(e) {}
      }
    });
}

// ─── RECONECTARE LA REVENIRE ÎN PRIM-PLAN / LA REȚEA ──────────────────────────
// Pe mobil, când aplicația stă în fundal (ecran blocat, schimbi aplicația), browserul SUSPENDĂ
// WebSocket-ul Supabase → „cazi" din presence, iar ceilalți te cred deconectat (și după răgaz se
// închide partida). La revenire ne RE-abonăm (canal nou + re-track) și resincronizăm starea, ca
// gazda să REAPARĂ repede în presence și partida să nu mai pice dintr-o pauză scurtă. La fel îi
// ajută și pe clienți să prindă din nou update-urile pierdute cât au fost suspendați.
let _resumeBusy = false, _lastResume = 0;
async function resumeRealtime() {
  if (window.isSinglePlayer || !roomId || !roomData || _resumeBusy) return;
  if (Date.now() - _lastResume < 2000) return; // anti back-to-back (focus + visibilitychange trag împreună)
  _resumeBusy = true; _lastResume = Date.now();
  try {
    const fresh = await getRoom(roomId);      // recuperăm update-urile pierdute cât am fost suspendați
    if (fresh && fresh.state) roomData = fresh.state;
    if(roomData && roomData._notice){ markNoticeSeen(roomData._notice.id); window._lastNoticeTs = roomData._notice.ts || 0; } else { window._lastNoticeTs = 0; } // nu reafișa anunțuri vechi la revenire
    subscribeRoom(roomId);                     // canal nou + re-anunțăm prezența (rol corect host/guest)
    maybeReclaimSeat();                        // dacă locul meu a devenit bot cât am lipsit, mi-l iau înapoi
    onRoomUpdate();
  } catch (e) {} finally { _resumeBusy = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeRealtime(); });
window.addEventListener('focus', resumeRealtime);
window.addEventListener('online', resumeRealtime);

// ─── REZILIENȚĂ MULTIPLAYER: deconectări, răgaz, migrare gazdă, înlocuire cu bot ─────────────
// Idee: când un jucător chiar lipsește (>răgaz), nu mai închidem partida. Îl înlocuim cu un BOT
// (același nume + bandaj 🤖), iar dacă cel plecat era GAZDA, mutăm gazda la alt jucător prezent.
// Așa, pe rând, până rămâne un singur om — care e gazdă (cu „Anulează") și fără termen de grație.
// Reguli anti-conflict: doar ARBITRUL (cel mai mic index de om PREZENT) scrie schimbările.
const ABSENCE_GRACE_MS = 60000; // răgaz până un absent e transformat în bot
window._absenceTimers = window._absenceTimers || {};
window._absenceSince  = window._absenceSince  || {};

function presentIdxSet() {
  const out = new Set();
  try {
    const st = (realtimeSub && realtimeSub.presenceState && realtimeSub.presenceState()) || {};
    Object.values(st).forEach(arr => (arr||[]).forEach(m => { if(m && typeof m.idx === 'number') out.add(m.idx); }));
  } catch(e) {}
  return out;
}
// Cel mai mic index de jucător UMAN prezent (arbitrul / candidatul la gazdă). -1 dacă nu există.
function lowestPresentHuman(present, s) {
  if(!s || !s.players) return -1;
  for(let i=0;i<s.players.length;i++){ const p=s.players[i]; if(p && !p.isBot && present.has(i)) return i; }
  return -1;
}

// Rulează la fiecare „presence sync". Pornește/oprește răgazul pentru fiecare om absent.
function handlePresenceTimeouts() {
  const s = roomData;
  if(window.isSinglePlayer || !s || !s.players || s.screen !== 'game') { clearAllAbsence(); return; }
  const me = (window._humanIndex ?? myIndex);
  const present = presentIdxSet();
  for(let i=0;i<s.players.length;i++){
    const p = s.players[i];
    const absent = p && !p.isBot && i !== me && !present.has(i);
    if(absent){
      if(!window._absenceSince[i]) window._absenceSince[i] = Date.now();
      if(!window._absenceTimers[i]) window._absenceTimers[i] = setTimeout(() => onAbsenceExpired(i), ABSENCE_GRACE_MS);
    } else {
      clearAbsence(i); // a revenit / e bot / sunt eu
    }
  }
  updateAbsenceBanner();
  ensureAbsenceTicker();
}
function clearAbsence(i){
  if(window._absenceTimers[i]){ clearTimeout(window._absenceTimers[i]); delete window._absenceTimers[i]; }
  if(window._absenceSince[i] != null) delete window._absenceSince[i];
}
function clearAllAbsence(){
  Object.keys(window._absenceTimers).forEach(k=>{ try{ clearTimeout(window._absenceTimers[k]); }catch(e){} });
  window._absenceTimers = {}; window._absenceSince = {};
  if(window._absenceTicker){ clearInterval(window._absenceTicker); window._absenceTicker = null; }
  if(window._stuckTicker){ clearInterval(window._stuckTicker); window._stuckTicker = null; }
  window._stuckKey = null;
  const b = document.getElementById('absenceBanner'); if(b) b.remove();
  clearTurnIdle();
  const rb = document.getElementById('reclaimSeatBtn'); if(rb) rb.remove();
}

function onAbsenceExpired(i){
  delete window._absenceTimers[i];
  const s = roomData;
  if(window.isSinglePlayer || !s || !s.players || s.screen !== 'game') return;
  const present = presentIdxSet();
  const p = s.players[i];
  if(!p || p.isBot || present.has(i)) { clearAbsence(i); return; }     // a revenit / deja bot
  const me = (window._humanIndex ?? myIndex);
  if(lowestPresentHuman(present, s) !== me) return;                    // doar ARBITRUL scrie
  replaceAbsentWithBot(i);
}

// Arbitrul transformă slotul absent în bot și, dacă era gazda, mută gazda la alt om prezent.
function replaceAbsentWithBot(i, reason){
  const s = roomData;
  const p = s.players[i]; if(!p || p.isBot) return;
  const leftName = p.name;
  const wasHost = (i === s.host);
  const why = reason === 'inactiv' ? 'a devenit inactiv(ă)' : 's-a deconectat';
  // 1) slotul devine bot (păstrăm numele; reținem id-ul uman pentru eventuala revenire)
  s.players[i] = { name: leftName, id: 'botseat-'+i, isBot: true, _wasHuman: true, _humanId: p.id };
  // 2) dacă a plecat GAZDA, mutăm rolul la alt OM prezent (cel mai mic index)
  let msg;
  if(wasHost){
    const present = presentIdxSet();
    let nh = lowestPresentHuman(present, s);
    if(nh === -1){ // presence gol/nesigur → alegem determinist din STARE: primul loc UMAN, altul decât i
      for(let j=0;j<s.players.length;j++){ if(j!==i && s.players[j] && !s.players[j].isBot){ nh=j; break; } }
    }
    if(nh !== -1){ s.host = nh; msg = `👑 ${leftName} (gazda) ${why}.\n${s.players[nh].name} este noua gazdă.\n${leftName} continuă ca bot 🤖.`; }
    else { s.host = i; msg = `${leftName} ${why}.`; }
  } else {
    msg = `🤖 ${leftName} ${why} și a fost înlocuit(ă) cu un bot.\nPartida continuă.`;
  }
  // 3) anunț pentru TOȚI (afișat o singură dată) + scriem starea (un singur scriitor)
  s._notice = mkNotice(msg);
  updateRoom(roomId, s);
  const me = (window._humanIndex ?? myIndex);
  if(s.host === me){ try { realtimeSub.track({ role:'host', idx: me }); } catch(e){} }
  clearAbsence(i);
  onRoomUpdate();
  scheduleBotTurnIfNeeded();
}

// La RECONECTARE: dacă locul meu a fost transformat în bot cât am lipsit, mi-l revendic înapoi.
function maybeReclaimSeat(){
  const s = roomData;
  if(window.isSinglePlayer || !s || !s.players) return false;
  const me = (window._humanIndex ?? myIndex);
  const p = s.players[me];
  if(p && p.isBot && p._wasHuman && p._humanId === myPlayerId){
    s.players[me] = { name: myName, id: myPlayerId };
    // Dacă nu mai există gazdă-OM (ex. toți deveniseră boți între runde), preiau EU gazda — altfel
    // butonul PROGRESEAZĂ (doar la gazdă) n-ar avea cine să-l apese și jocul ar rămâne blocat.
    if(!s.players[s.host] || s.players[s.host].isBot) s.host = me;
    s._notice = mkNotice(`✅ ${myName} a revenit la masă.`);
    updateRoom(roomId, s);
    try { realtimeSub.track({ role: (me === s.host ? 'host':'guest'), idx: me }); } catch(e){}
    return true;
  }
  return false;
}

// ─── DE-DUPLICARE ANUNȚURI (robustă la diferențe de ceas între dispozitive) ───────────────────
// Înainte comparam s._notice.ts > _lastNoticeTs, dar ts vine din Date.now() pe ceasul FIECĂRUI
// dispozitiv (telefon vs PC), iar ceasurile nu-s sincronizate perfect. Dacă cel ce scrie „revenit"
// avea ceasul în urmă față de cel ce scrisese „deconectat", anunțul ieșea suprimat (ts mai mic).
// Soluție: fiecare anunț are un id unic; afișăm un id O SINGURĂ dată, indiferent de ts. Păstrăm și
// _lastNoticeTs ca rezervă pentru anunțuri vechi (fără id) din timpul tranziției.
window._seenNoticeIds = window._seenNoticeIds || [];
function mkNotice(msg){
  return { msg, ts: Date.now(), id: (myPlayerId||'x') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8) };
}
function markNoticeSeen(id){
  if(!id) return;
  const a = window._seenNoticeIds;
  if(a.indexOf(id) === -1){ a.push(id); if(a.length > 40) a.shift(); }
}
function noticeAlreadySeen(id){ return !!id && window._seenNoticeIds.indexOf(id) !== -1; }

// Popup intuitiv (auto-dispare în 7s, dar are și buton OK).
function showInfoPopup(msg){
  try{
    const old = document.getElementById('infoPopup'); if(old) old.remove();
    const ov = document.createElement('div');
    ov.id = 'infoPopup'; ov.className = 'info-popup-overlay';
    ov.innerHTML = `<div class="info-popup-box"><div class="info-popup-msg">${String(msg).replace(/\n/g,'<br>')}</div><button class="btn btn-primary info-popup-ok">OK</button></div>`;
    const close = () => { if(ov._t) clearTimeout(ov._t); try{ ov.remove(); }catch(e){} };
    ov.querySelector('.info-popup-ok').onclick = close;
    ov.addEventListener('click', e => { if(e.target===ov) close(); });
    document.body.appendChild(ov);
    ov._t = setTimeout(close, 7000);
  }catch(e){}
}

// Banner cu numărătoare pentru jucătorii absenți (până sunt înlocuiți cu bot).
function ensureAbsenceTicker(){
  if(window._absenceTicker) return;
  if(Object.keys(window._absenceSince).length === 0) return;
  window._absenceTicker = setInterval(updateAbsenceBanner, 1000);
}
function updateAbsenceBanner(){
  let el = document.getElementById('absenceBanner');
  const s = roomData;
  const keys = Object.keys(window._absenceSince || {});
  if(window.isSinglePlayer || !s || s.screen !== 'game' || keys.length === 0){
    if(el) el.remove();
    if(window._absenceTicker && keys.length === 0){ clearInterval(window._absenceTicker); window._absenceTicker = null; }
    return;
  }
  if(!el){ el = document.createElement('div'); el.id = 'absenceBanner'; el.className = 'absence-banner'; document.body.appendChild(el); }
  const parts = keys.map(k=>{
    const i = +k; const nm = (s.players[i] && s.players[i].name) || '?';
    const left = Math.max(0, Math.ceil((ABSENCE_GRACE_MS - (Date.now() - window._absenceSince[k]))/1000));
    return `${nm} (${left}s)`;
  });
  el.innerHTML = `⏳ Se așteaptă reconectarea: ${parts.join(', ')}`;
}

// ─── INACTIVITATE LA RÂND ────────────────────────────────────────────────────────────────────
// Dacă e rândul TĂU și nu joci în TURN_IDLE_MS, primești mesajul de păsuire („mai ai nevoie de
// timp?"). Confirmi → mai primești un minut (toți văd „X a mai cerut un minut"). Ieși / expiră
// numărătoarea → devii bot (același nume + 🤖), exact ca la deconectare. Dacă revii, ai buton
// „Revino la joc". Fiecare client își urmărește DOAR propriile ture (nicio coordonare necesară).
const TURN_IDLE_MS = 60000;     // cât stai fără să muți până apare păsuirea
const IDLE_REPRIEVE_MS = 15000; // cât mai ai după mesaj, până devii bot (dacă nu confirmi)

// Jocul așteaptă o acțiune de la MINE? (aleg jocul / confirm levata / pun cartea)
function isWaitingOnMe(s){
  if(window.isSinglePlayer || !s || !s.gameState || s.screen !== 'game') return false;
  const me = (window._humanIndex ?? myIndex);
  const p = s.players[me];
  if(!p || p.isBot) return false;                 // sunt deja bot / spectator
  const gs = s.gameState;
  if(gs.finished) return false;                   // între runde (PROGRESEAZĂ) nu numărăm aici
  if(gs.phase === 'selecting') return s.pickerIndex === me;
  if(gs.pendingTrick) return Array.isArray(gs.pendingTrick.confirmed) && !gs.pendingTrick.confirmed.includes(me);
  return gs.currentPlayer === me;
}
function turnKey(s){
  const gs = s.gameState || {};
  return [s.roundNumber, gs.phase, gs.currentPlayer, s.pickerIndex,
          gs.pendingTrick ? (gs.pendingTrick.confirmed||[]).length : -1,
          s._turnPing || 0].join(':');
}
function manageTurnIdle(s){
  if(!isWaitingOnMe(s)){ clearTurnIdle(); return; }
  const key = turnKey(s);
  if(window._turnIdleKey === key) return;          // deja pornit pt. această acțiune
  clearTurnIdle();
  window._turnIdleKey = key;
  window._turnIdleTimer = setTimeout(onMyTurnIdle, TURN_IDLE_MS);
}
function clearTurnIdle(){
  if(window._turnIdleTimer){ clearTimeout(window._turnIdleTimer); window._turnIdleTimer = null; }
  window._turnIdleKey = null;
  if(window._idleCountdownTimer){ clearInterval(window._idleCountdownTimer); window._idleCountdownTimer = null; }
  const pp = document.getElementById('idlePrompt'); if(pp) pp.remove();
}
function onMyTurnIdle(){
  window._turnIdleTimer = null;
  if(!isWaitingOnMe(roomData)){ clearTurnIdle(); return; }
  // Offline (ex. a picat WiFi-ul comun): păsuirea n-are rost — oricum nu poți juca, iar ceilalți
  // te tratează prin răgazul de deconectare. Reîncerc când revine netul.
  if(!navigator.onLine){ window._turnIdleTimer = setTimeout(onMyTurnIdle, 5000); return; }
  showIdlePrompt();
}
function showIdlePrompt(){
  const old = document.getElementById('idlePrompt'); if(old) old.remove();
  let left = Math.ceil(IDLE_REPRIEVE_MS/1000);
  const ov = document.createElement('div');
  ov.id = 'idlePrompt'; ov.className = 'info-popup-overlay';
  ov.innerHTML = `<div class="info-popup-box">
      <div class="info-popup-msg">⏳ Mai ai nevoie de timp?<br>
        <span style="font-size:13px; opacity:.85">Altfel devii bot în <b id="idleLeft">${left}</b>s.</span></div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-primary" id="idleStay" style="width:auto;">Da, rămân</button>
        <button class="btn btn-secondary" id="idleLeave" style="width:auto;">Ies (bot)</button>
      </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#idleStay').onclick = idleGrantMore;
  ov.querySelector('#idleLeave').onclick = idleBecomeBot;
  if(window._idleCountdownTimer) clearInterval(window._idleCountdownTimer);
  window._idleCountdownTimer = setInterval(()=>{
    left--; const el = document.getElementById('idleLeft'); if(el) el.textContent = left;
    if(left <= 0) idleBecomeBot();
  }, 1000);
}
function idleGrantMore(){
  const pp = document.getElementById('idlePrompt'); if(pp) pp.remove();
  if(window._idleCountdownTimer){ clearInterval(window._idleCountdownTimer); window._idleCountdownTimer = null; }
  const s = roomData; if(!s) return;
  const me = (window._humanIndex ?? myIndex);
  const nm = (s.players[me] && s.players[me].name) || myName;
  s._notice = mkNotice(`⏳ ${nm} a mai cerut un minut.`);
  markNoticeSeen(s._notice.id);                    // nu mi-l reafișa mie (eu am apăsat butonul)
  s._turnPing = Date.now();                         // resetează și backstop-ul de „tură blocată" la toți
  updateRoom(roomId, s);
  window._turnIdleKey = null;                       // forțează repornirea răgazului de 60s
  manageTurnIdle(roomData);
}
function idleBecomeBot(){
  // Dacă suntem offline, NU ne transformăm local în bot (scrierea ar eșua oricum, iar starea de pe
  // server ne-ar readuce „om" la reconectare). Offline = ești deja tratat ca deconectat de ceilalți.
  if(!navigator.onLine){ clearTurnIdle(); return; }
  clearTurnIdle();
  const s = roomData; if(!s) return;
  const me = (window._humanIndex ?? myIndex);
  if(!s.players[me] || s.players[me].isBot) return;
  replaceAbsentWithBot(me, 'inactiv');              // devin bot (cu migrare gazdă dacă era cazul)
  manageReclaimSpectatorBtn(roomData);              // arăt butonul „Revino la joc"
}

// Buton „Revino la joc" pentru cine a fost făcut bot (din inactivitate) dar e încă în aplicație.
function manageReclaimSpectatorBtn(s){

// ─── BACKSTOP „TURĂ BLOCATĂ" (independent de Supabase Presence) ───────────────────────────────
// Presence-ul pică uneori (mai ales după reconectări) și o deconectare reală nu e prinsă — jocul
// rămâne „blocat" pe cel plecat. Aici verificăm periodic: dacă jocul așteaptă de prea mult un
// jucător care NU sunt eu și care nu mai mută, îl transformăm în bot. Rulează pe TOȚI cei prezenți
// (idempotent: replaceAbsentWithBot iese dacă deja e bot), deci NU depinde de presence.
const STUCK_TURN_MS = 90000; // mai lung decât păsuirea proprie (60s + 15s), ca să n-o calce

// Pe cine așteaptă jocul acum? (cine alege / cine n-a confirmat levata / cine e la rând)
function waitedOnIndex(s){
  if(!s || !s.gameState) return -1;
  const gs = s.gameState;
  if(gs.finished) return -1;
  if(gs.phase === 'selecting') return (typeof s.pickerIndex === 'number') ? s.pickerIndex : -1;
  if(gs.pendingTrick){
    const conf = gs.pendingTrick.confirmed || [];
    for(let i=0;i<s.players.length;i++){ const p=s.players[i]; if(p && !p.isBot && !conf.includes(i)) return i; }
    return -1;
  }
  return (typeof gs.currentPlayer === 'number') ? gs.currentPlayer : -1;
}
function ensureStuckTurnTicker(){
  if(window._stuckTicker) return;
  window._stuckTicker = setInterval(checkStuckTurn, 5000);
}
function checkStuckTurn(){
  const s = roomData;
  if(window.isSinglePlayer || !s || !s.gameState || s.screen !== 'game'){ window._stuckKey = null; return; }
  const me = (window._humanIndex ?? myIndex);
  const waited = waitedOnIndex(s);
  if(waited < 0 || waited === me){ window._stuckKey = null; return; } // nimeni / eu (am popup propriu)
  const p = s.players[waited];
  if(!p || p.isBot){ window._stuckKey = null; return; }
  const key = turnKey(s);
  if(window._stuckKey !== key){ window._stuckKey = key; window._stuckSince = Date.now(); return; } // tură nouă → repornesc cronometrul
  if(Date.now() - (window._stuckSince || 0) < STUCK_TURN_MS) return;
  // Blocat prea mult pe un jucător care nu răspunde → îl facem bot (prinde deconectările pe care
  // presence nu le-a prins). Idempotent + last-write-wins dacă mai mulți clienți o fac simultan.
  window._stuckKey = null; window._stuckSince = 0;
  replaceAbsentWithBot(waited, 'deconectat');
}

  window._rentzShatterRound = null; window._rentzShatterDone = null;
  window._trickShatterRound = null; window._trickShatterDone = null;

  if(_trickTakenTimeout) { clearTimeout(_trickTakenTimeout); _trickTakenTimeout = null; }

  if(window._trickRevealTimers) { window._trickRevealTimers.forEach(t => clearTimeout(t)); window._trickRevealTimers = []; }
  // Overlay-ul levatei e atașat la .table-area și ar fi reutilizat de partida următoare → la „joc nou"
  // se declanșa spargerea cărților din levata VECHE (ca după „Confirmă mâna"). Îl scoatem din DOM aici.
  const _ttOv = document.getElementById('trickTakenOverlay'); if(_ttOv) _ttOv.remove();
  window._pendingConfirm = false;
  if(window._gameTimerInterval) { clearInterval(window._gameTimerInterval); window._gameTimerInterval = null; }
  if(realtimeSub) { try { db.removeChannel(realtimeSub); } catch(e){} realtimeSub=null; }
  clearAllAbsence();
  showScreen('home');
}
function quitToHomeWithCountdown() {
  if (window._quitRunning) return; // anti double click
  window._quitRunning = true;
    // 🔴 OPRIM realtime imediat ca să nu mai primim evenimente care ne scot din joc
  if (realtimeSub) {
    try { db.removeChannel(realtimeSub); } catch (e) {}
    realtimeSub = null;
  }
  let seconds = 60;
  const el = document.getElementById('quitCountdown');

  function finish() {
    clearInterval(interval);

    idbClear();

    if (window.isSinglePlayer) {
      try { localStorage.removeItem('rentz_sp_state'); } catch (e) {}
    }

    myName = '';
    myIndex = -1;
    roomId = '';
    myPlayerId = '';
    roomData = null;

    window.isSinglePlayer = false;
    window._botActing = false;
    window._spTrickDelay = false;
    window._botActedKey = '';
    window._botSchedKey = '';
    window._sawHost = false;
    window._rentzShatterRound = null;
    window._rentzShatterDone = null;
    window._trickShatterRound = null;
    window._trickShatterDone = null;

    if (window._hostGoneTimer) {
      clearTimeout(window._hostGoneTimer);
      window._hostGoneTimer = null;
    }

    if (_trickTakenTimeout) {
      clearTimeout(_trickTakenTimeout);
      _trickTakenTimeout = null;
    }

    window._trickRevealAnimating = false;

    if (window._trickRevealTimers) {
      window._trickRevealTimers.forEach(t => clearTimeout(t));
      window._trickRevealTimers = [];
    }

    const _ttOv2 = document.getElementById('trickTakenOverlay'); if(_ttOv2) _ttOv2.remove();
    window._pendingConfirm = false;

    if (window._gameTimerInterval) {
      clearInterval(window._gameTimerInterval);
      window._gameTimerInterval = null;
    }

    if (realtimeSub) {
      try { db.removeChannel(realtimeSub); } catch (e) {}
      realtimeSub = null;
    }

    clearAllAbsence();
    window._quitRunning = false;
    showScreen('home');
  }

  // CLICK TO SKIP
  if (el) {
    el.onclick = finish;
  }

  if (el) {
    el.innerText = `Revenire la meniu în ${seconds}... (click pentru skip)`;
  }

  const interval = setInterval(() => {
    seconds--;

    if (seconds <= 0) {
      finish();
      return;
    }

    if (el) {
      el.innerText = `Revenire la meniu în ${seconds}... (click pentru skip)`;
    }
  }, 1000);
}

async function cancelRoom() {
  const msg = window.isSinglePlayer
    ? 'Sigur vrei să anulezi partida?'
    : 'Sigur vrei să anulezi partida? Toți jucătorii vor fi scoși.';
  if (confirm(msg)) {
    if(window.isSinglePlayer) {
      quitToHome();
      return;
    }
    // Anularea NU se mai bazează pe DELETE (RLS permite ștergerea doar pentru camere 'final').
    // Punem un flag 'cancelled' în stare și o marcăm 'final': toți ceilalți primesc UPDATE-ul
    // (livrat garantat, spre deosebire de DELETE) și ies imediat — vezi onRoomUpdate. Camera
    // devine astfel și ștergibilă, așa că o curățăm pe loc; dacă ștergerea nu prinde, e reaped.
    const s = roomData;
    s.cancelled = true;
    s.screen = 'final';
    await updateRoom(roomId, s);
    try { await deleteRoomDB(roomId); } catch(e) {}
    quitToHome();
  }
}

window.addEventListener('load', async () => {
  // Încărcăm memoria permanentă a botului din IndexedDB cât mai devreme,
  // ca deciziile AI să aibă acces sincron la ea, și actualizăm UI-ul.
  try { await loadBotMemory(); refreshBotMemoryUI(); } catch(e) {}

  // Restaurăm sesiunea single-player, dacă există una salvată
  try {
    const spRaw = localStorage.getItem('rentz_sp_state');
    if(spRaw) {
      const sp = JSON.parse(spRaw);
      if(sp && sp.state && sp.state.screen) {
        window.isSinglePlayer = true;
        myName = sp.myName;
        myIndex = sp.myIndex; window._humanIndex = sp.myIndex;
        roomId = 'LOCAL';
        roomData = sp.state;
        onRoomUpdate();
        scheduleBotTurnIfNeeded(); // reia lanțul de boți dacă jocul era blocat la refresh
        return; // nu mai verificăm sesiunea multiplayer
      }
    }
  } catch(e) {}

  const savedRoom    = await idbGet('rentz_room_id');
  const savedPlayerId= await idbGet('rentz_player_id');
  const savedIndex   = await idbGet('rentz_player_idx');
  const savedName    = await idbGet('rentz_player_name');

  if (savedRoom && savedPlayerId && savedIndex !== null && savedName) {
    const room = await getRoom(savedRoom);
    const seat = room && room.state && room.state.players[parseInt(savedIndex)];
    const seatMatches = seat && (seat.id === savedPlayerId || (seat._wasHuman && seat._humanId === savedPlayerId));
    if (seatMatches) {
      roomId = savedRoom;
      myPlayerId = savedPlayerId;
      myIndex = parseInt(savedIndex); window._humanIndex = myIndex;
      myName = savedName;
      roomData = room.state;
      if(room.state._notice){ markNoticeSeen(room.state._notice.id); window._lastNoticeTs = room.state._notice.ts || 0; } else { window._lastNoticeTs = 0; } // nu reafișa anunțuri vechi la reconectare
      subscribeRoom(roomId);
      maybeReclaimSeat();   // dacă între timp locul meu a devenit bot, mi-l revendic
      onRoomUpdate();
      toast('Te-ai reconectat cu succes!');
    } else {
      await idbClear();
    }
  }
});
