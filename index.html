    if(mode !== 'kInima' && mode !== 'qMinus' && mode !== 'totale') return null;
    if(diff === 'easy' || !leading) return null;
    if(!rollStrat()) return null;
    const qOutAtOpp = (su) => !playedBySuit[su].has('Q') && !hand.some(c => c.suit === su && c.rank === 'Q');
    const kHeartOutAtOpp = !playedBySuit['♥'].has('K') && !hand.some(c => c.rank === 'K' && c.suit === '♥');
    const isPenCard = (c) =>
      ((mode === 'kInima' || mode === 'totale') && c.rank === 'K' && c.suit === '♥') ||
      ((mode === 'qMinus' || mode === 'totale') && c.rank === 'Q') ||
      (mode === 'totale' && c.suit === '♦');
    const worthForcing = (su) => {
      if(mode === 'qMinus') return qOutAtOpp(su);
      if(mode === 'kInima') return su === '♥' && kHeartOutAtOpp;
      return su === '♦' || qOutAtOpp(su) || (su === '♥' && kHeartOutAtOpp); // totale
    };
    let best = null, bestForced = -1;
    ['♠','♥','♦','♣'].forEach(su => {
      const mine = hand.filter(c => c.suit === su).sort((a,b) => RV[a.rank] - RV[b.rank]);
      if(mine.length === 0) return;
      const low = mine[0];
      if(isPenCard(low)) return;                  // nu conduc CHIAR cu o penalizare proprie
      if(!oppHasSuit(su)) return;                 // adversarii n-o mai au → nu forțez pe nimeni
      const lowerOut = RANKS.some(r => RV[r] < RV[low.rank]
        && !playedBySuit[su].has(r) && !hand.some(c => c.suit === su && c.rank === r));
      if(lowerOut) return;                        // cineva poate pune SUB mine → aș putea lua EU
      const topOut = highestOutstanding(su);
      if(topOut <= RV[low.rank]) return;          // adversarii n-au nimic peste mine → nu forțez
      if(!worthForcing(su)) return;               // culoarea nu ascunde o penalizare relevantă
      if(topOut > bestForced) { bestForced = topOut; best = low; } // forțez cartea cea mai mare
    });
    return best;
  };
  // FORȚAREA PENALIZĂRII LA DESCHIDERE (toate jocurile de minus, mai puțin ♦):
  // Dacă am o carte-penalizare (K♥ / o damă), e EXPUSĂ (n-am o carte mai mică ne-penalizatoare
  // de aceeași culoare cu care s-o ascund) și mai există MĂCAR o carte mai mare la adversari,
  // CONDUC chiar cu cartea-penalizare. Cineva poate fi obligat s-o supraliciteze și s-o
  // ÎNGHITĂ. Nu cer ca TOATE cărțile rămase la adversari să fie mai mari: chiar dacă mai e și
  // una mică pe la ei, poate fi la ALT jucător decât cel cu cartea mare → tot iese forțarea.
  // Botul nu știe distribuția, dar MĂCAR ÎNCEARCĂ — în cel mai rău caz iese la fel ca acum
  // (o ia tot el), iar în cazul bun adversarul mănâncă penalizarea. Dacă în schimb aș conduce
  // cu un As păstrând dama, adversarul și-ar scăpa cartea mare curat, iar eu aș rămâne blocat
  // cu dama și aș lua-o GARANTAT la final. Folosește cărțile ieșite (playedBySuit).
  if(leading && (mode === 'kInima' || mode === 'qMinus' || mode === 'totale') && rollStrat()) {
    const penValue = c =>
      (((mode === 'kInima' || mode === 'totale') && c.rank === 'K' && c.suit === '♥') ? 5 :
       ((mode === 'qMinus' || mode === 'totale') && c.rank === 'Q') ? 3 : 0);
    const forceable = playable.filter(pc => {
      if(penValue(pc) === 0) return false;
      // K♥ (-5) NU se conduce ca să forțezi: adversarul cu Asul de cupă face DUCK cu o cupă
      // mai mică (chiar cu Q♥!) și o iei TU — plus ce-ți mai aruncă în mână. Mult mai bine îl
      // ȚII și-l scapi OFF-SUIT (când rămâi fără culoarea cerută), atunci îl ia cine câștigă
      // mâna aceea, fără să-l iei tu. Deci forțăm DOAR cu dame (-3), nu cu K♥.
      if(pc.rank === 'K' && pc.suit === '♥') return false;
      const S = pc.suit;
      // Cărțile de culoarea S încă la adversari = neieșite ȘI nedeținute de mine.
      const outAtOpp = RANKS.filter(r => !playedBySuit[S].has(r) && !hand.some(c => c.suit === S && c.rank === r));
      // (a) măcar o carte mai mare la adversari → cineva POATE fi forțat s-o ia.
      const someHigherOut = outAtOpp.some(r => RV[r] > RV[pc.rank]);
      // (b) NU am o carte mai mică ne-penalizatoare de aceeași culoare (altfel m-aș ascunde
      //     cu ea și aș păstra penalizarea → nu merită riscul). Fără ea sunt EXPUS: oricum
      //     rămân blocat cu penalizarea, deci încercarea de a o forța nu mă costă nimic în plus.
      const haveSafeLower = hand.some(c => c.suit === S && RV[c.rank] < RV[pc.rank] && penValue(c) === 0);
      return someHigherOut && !haveSafeLower;
    });
    // Dintre dame, o pun pe adversar să înghită pe cea mai mare (deși toate-s -3).
    if(forceable.length > 0){
      forceable.sort((a,b) => RV[b.rank] - RV[a.rank]);
      return forceable[0];
    }
  }

  // HARD/ADAPTIVE: când DESCHIDE, folosește profilul PER-MOD al umanului ca să-l forțeze
  // să joace cărți incomode. Dacă în ACEST mod e probabil să țină pericolul (sau evită
  // penalizările), conduce mic pe culoarea pe care el o ELIMINĂ cel mai des — ca să-l
  // silească fie să rămână fără ea, fie să arunce pericol off-suit.
  if((diff === 'hard' || diff === 'adaptive') && leading && mode !== 'rentz') {
    const p = _modeProfile(mode);
    const minConf = (diff === 'adaptive') ? 0.25 : 0.45;   // adaptive se bazează mai devreme
    const holdsLikely = humanLikelyHoldsDanger(mode);
    const avoids = p.traits.avoidsPenalty.v;
    if(_modeConf(p) >= minConf && (holdsLikely > 0.55 || avoids > 0.5)) {
      // Țintă = culoarea cu cel mai mare „dump" istoric, penalizând cazul în care probabil
      // a rămas deja fără ea (presiunea n-ar mai avea efect).
      let target = null, best = -1;
      _SUIT_KEYS.forEach(su => {
        const score = (p.suitDump[su] || 0) * (1 - humanLikelyVoid(mode, su) * 0.5);
        if(score > best){ best = score; target = su; }
      });
      if(target && best > 0.15 && oppHasSuit(target)){
        const pressure = playable.filter(c => c.suit === target && RV[c.rank] <= RV['10']);
        if(pressure.length > 0) return [...pressure].sort(byRankAsc)[0]; // mic, ca să nu luăm noi mâna
      }
    }
  }

  if(mode === 'jPica') {
    // SUBIT J♠: cine CÂȘTIGĂ mâna în care se află J♠ primește +10. Deci:
    //  • dacă AM J♠ → vreau să-l joc EU într-o mână pe care o câștig EU;
    //  • dacă NU am J♠ → vreau să câștig mâna în care îl joacă altcineva.
    const myJ = playable.find(c => c.rank === 'J' && c.suit === '♠');
    const hasJPica = !!myJ;
    const trickHasJPica = gs.currentTrick.some(p => p.card.rank === 'J' && p.card.suit === '♠');
    const spadesPlayable = playable.filter(c => c.suit === '♠').sort(byRankAsc);

    // Câte ♠ mai mari decât J♠ sunt ÎNCĂ la adversari (Q/K/A♠ neieșite și nedeținute de mine)?
    const higherSpadesOut = ['Q','K','A'].filter(r =>
      !playedBySuit['♠'].has(r) && !hand.some(c => c.suit === '♠' && c.rank === r)
    ).length;
    // J♠ e „imbatabil" dacă nicio ♠ mai mare nu mai e la adversari → dacă-l conduc, îl iau.
    const jIsTopSpade = higherSpadesOut === 0;

    if(leading) {
      if(hasJPica) {
        // Dacă J♠ e cea mai mare ♠ rămasă în joc → îl conduc ȘI ÎL IAU (nimeni nu pune peste).
        if(jIsTopSpade) return myJ;

        const myBigSpades = spadesPlayable.filter(c => RV[c.rank] > RV['J']);   // K/Q/A♠ ale mele
        const mySmallSpades = spadesPlayable.filter(c => RV[c.rank] < RV['J']);  // pici sub J

        // STRATEGIA „rămân major": dacă am o pică mare (K/Q♠) ȘI o pică mică de sondare,
        // conduc cu pica MICĂ — adversarii sunt forțați să-și arunce picile mari (ex. A♠),
        // iar pica mea mare + J♠ rămân stăpâne pe culoare → iau eu mâna cu J♠ mai târziu.
        if(myBigSpades.length > 0 && mySmallSpades.length > 0) {
          const myTopSpadeVal = Math.max(...myBigSpades.map(c => RV[c.rank]));
          const biggerOutThanMine = ['Q','K','A'].some(r =>
            RV[r] > myTopSpadeVal && !playedBySuit['♠'].has(r) && !hand.some(c => c.suit === '♠' && c.rank === r)
          );
          // dacă adversarii încă au pici peste pica mea mare → sondez cu mică să-i scot afară
          if(biggerOutThanMine) return mySmallSpades[0];
          // altfel pica mea mare e deja top → o conduc, iau mâna și controlez J♠
          return myBigSpades[myBigSpades.length - 1];
        }

        // Am pici mari dar fără mică de sondare → conduc cu cea mai mare ca să trag afară.
        if(myBigSpades.length > 0) return myBigSpades[myBigSpades.length - 1];
        // N-am ♠ mari → conduc cu altă culoare mică și păstrez J♠.
        const nonSpade = playable.filter(c => c.suit !== '♠').sort(byRankAsc);
        if(nonSpade.length > 0) return nonSpade[0];
        return myJ; // doar J♠ (+ poate ♠ mici) am — n-am încotro
      }
      // NU am J♠. Conduc cu ♠ MARE ca să câștig eu mâna dacă cineva aruncă J♠.
      const bigSpades = spadesPlayable.filter(c => RV[c.rank] > RV['J']);
      if(bigSpades.length > 0) return bigSpades[bigSpades.length - 1]; // A♠/K♠ — controlez mâna
      // n-am ♠ mari → joc mic neutru (nu vreau să rămân „sus" inutil)
      return [...playable].sort(byRankAsc)[0];
    }

    // ── URMEZ (nu conduc) ──
    // STRATEGIA „J♠ major rămas în mână": dacă J♠ e cea mai mare pică din joc (jIsTopSpade)
    // și NU conduc eu, renunț la „dau numai cărți mici". Scopul: să CÂȘTIG una din mâinile
    // următoare ca să preiau CONDUCEREA, apoi conduc J♠ tura următoare → +10 garantat
    // (nimeni nu mai are pică peste J ca să-l bată). În jPica câștigarea unei mâini FĂRĂ J♠
    // nu costă nimic, deci e „gratis" să iau mâna doar ca să ajung la conducere.
    if(hasJPica && jIsTopSpade) {
      // (1) Pe atu de pică: dacă J♠ bate vârful curent, nimeni din spate nu-l poate întrece
      //     (nu mai există pică peste J la adversari) → îl joc ACUM și încasez +10 direct.
      if(lead === '♠' && hasSuit && RV['J'] > topInLead) return myJ;
      // (2) Pot câștiga mâna asta cu o carte ≠ J♠ (pică mare la atu de pică, sau cartea cerută
      //     la lead non-♠)? Dacă da, o iau cu cea mai MICĂ carte câștigătoare → preiau
      //     conducerea și păstrez J♠ pentru tura următoare (când îl conduc și-l încasez sigur).
      if(hasSuit) {
        const seize = sameSuit.filter(c => RV[c.rank] > topInLead && !(c.rank === 'J' && c.suit === '♠'));
        if(seize.length > 0) return [...seize].sort(byRankAsc)[0];
      }
      // (3) Nu pot câștiga mâna acum (off-suit, ori n-am carte peste vârf) → cad pe logica de
      //     mai jos: fac duck cu cea mai mică și păstrez J♠ pentru când prind conducerea.
    }
    if(hasSuit && lead === '♠') {
      const winners = sameSuit.filter(c => RV[c.rank] > topInLead); // ♠ care câștigă mâna acum
      if(trickHasJPica) {
        // J♠ e pe masă → dacă pot câștiga mâna, O IAU (cu cea mai mică ♠ câștigătoare).
        if(winners.length > 0) return [...winners].sort(byRankAsc)[0];
        return sameSuit.sort(byRankAsc)[0]; // nu-l pot lua → joc mic
      }
      // J♠ NU e pe masă. Am eu J♠ și-l pot juca câștigând chiar eu mâna?
      if(myJ) {
        // îl joc DOAR dacă, fiind ultimul, J♠ câștigă mâna (e peste vârful actual) → prind +10.
        if(amLast && RV['J'] > topInLead) return myJ;
        // ALTFEL: NU irosesc o pică mare pe o mână FĂRĂ J♠ (câștig fără valoare) și nu risc J♠.
        // Regula „3 pici incl. J♠ → cea mai mică pică": duck cu cea mai mică pică (≠ J♠),
        // păstrând J♠ protejat și picile mari ca gărzi.
        const small = sameSuit.filter(c => !(c.rank === 'J' && c.suit === '♠')).sort(byRankAsc);
        return small.length ? small[0] : myJ;
      }
      // Nu am J♠ și J♠ NU e pe masă → câștigarea ACESTEI mâini nu-mi aduce NIMIC (+10 e
      // doar pe mâna cu J♠). Picile mele MARI (Q/K/A♠) sunt GĂRZILE cu care prind J♠-ul când
      // umanul e forțat să-l joace. Deci fac DUCK cu cea mai MICĂ pică și mi le păstrez.
      // (Bug vechi: arunca pica mare aici „ca să preseze" și rămânea fără cum să mai ia J♠ —
      //  exact cum a lăsat jucătorul major cu J♠.)
      return [...sameSuit].sort(byRankAsc)[0];
    }

    // Lead non-♠ și AM culoarea cerută. Dacă J♠ a fost ARUNCAT în mâna asta și pot câștiga,
    // O IAU (prind +10!). Altfel NU irosesc cărți mari pe o mână fără valoare → fac duck cu
    // cea mai MICĂ și păstrez cărțile mari (cu ele pot lua J♠ dacă apare mai târziu).
    if(hasSuit) {
      if(trickHasJPica) {
        const winners = sameSuit.filter(c => RV[c.rank] > topInLead);
        if(winners.length > 0) return [...winners].sort(byRankAsc)[0]; // câștig cu cea mai mică suficientă
      }
      return [...sameSuit].sort(byRankAsc)[0];
    }
    // OFF-SUIT (nu am culoarea cerută): descărcarea NU poate câștiga mâna.
    // REGULA „dai J♠ fără jenă celui de pe ultimul loc": dacă J♠ e FĂRĂ SPERANȚĂ (NU e cea
    // mai mare pică rămasă ȘI n-am nicio pică peste J ca să-l protejez → un adversar mi-l ia
    // oricum când îl joc), iar AICI sunt ULTIMUL și mâna o ia chiar jucătorul de pe ULTIMUL
    // loc (scor total minim), atunci îi arunc J♠ LUI: +10 ajută cel mai puțin pe cineva care
    // oricum pierde, nu pe un lider. Probabilistic (90%), pe baza cărților ieșite + scoruri.
    if(myJ && amLast && gs.currentTrick.length > 0) {
      const highSpadesOverJ = hand.filter(c => c.suit === '♠' && RV[c.rank] > RV['J']).length;
      const jHopeless = !jIsTopSpade && highSpadesOverJ === 0;
      const scores = (roomData && roomData.totalScores) || [];
      if(jHopeless && scores.length > 0) {
        let lastIdx = -1, lastScore = Infinity;
        scores.forEach((sc, i) => { if(sc < lastScore){ lastScore = sc; lastIdx = i; } });
        const winnerIdx = evaluateTrickWinner(gs.currentTrick, lead);
        if(lastIdx >= 0 && winnerIdx === lastIdx && winnerIdx !== botIdx && Math.random() < 0.9) {
          return myJ; // i-l dau fără jenă
        }
      }
    }
    // Altfel: scap de cea mai MICĂ carte și PĂSTREZ cărțile mari — în jPica cărțile mari prind
    // J♠ când e aruncat într-o mână pe care o câștig. NU arunc J♠ (l-ar lua cine câștigă mâna).
    const dumpables = playable.filter(c => !(c.rank === 'J' && c.suit === '♠'));
    if(dumpables.length === 0) return myJ; // doar J♠ am
    const nonSpadeDump = dumpables.filter(c => c.suit !== '♠'); // prefer să țin picile (gărzi pt. J♠)
    const pool = nonSpadeDump.length ? nonSpadeDump : dumpables;
    return [...pool].sort(byRankAsc)[0]; // cea mai MICĂ carte (păstrez cărțile mari)
  }

  if(mode === 'kInima') {
    // K♥ valorează -5 — vrei SĂ EVIȚI să îl iei.
    const trickHasKInima = gs.currentTrick.some(p => p.card.rank === 'K' && p.card.suit === '♥');
    const hasKInima = hand.some(c => c.rank === 'K' && c.suit === '♥');

    if(leading) {
      if(hasKInima) {
        // NU conduc NICIODATĂ cu K♥ doar ca să-l iau eu. Cazul în care chiar merită condus
        // (doar Asul a mai rămas la adversari → sunt forțați să-l înghită) e tratat MAI SUS,
        // la „forțarea penalizării". Aici doar îl PĂSTREZ: golesc/atac pe alte culori și scap
        // de K♥ off-suit mai târziu (când n-am culoarea cerută) sau sub A♥ când iese pe masă.
        const v = tryVoidLead();
        if(v && v.suit !== '♥') return v;
        // Atac pe culoarea pe care sunt cel mai „lung" cu cărți mici, ca să forțez rundele.
        // Evit culorile unde sunt SOLIST (le-aș câștiga singur).
        const nonHeart = dropSoleSuits(playable.filter(c => c.suit !== '♥'));
        if(nonHeart.length > 0) return [...nonHeart].sort(byRankAsc)[0];
        return [...dropSoleSuits(playable)].sort(byRankAsc)[0];
      }
      // Nu am K♥: încerc void, apoi atac mic evitând ♥ înalt ȘI culorile unde sunt solist.
      const v = tryVoidLead();
      if(v) return v;
      { const ll = tryLoadingLead(); if(ll) return ll; } // ies cu cea mică → flushez K♥-ul cuiva
      const safeLead = dropSoleSuits(playable.filter(c => !(c.suit === '♥' && RV[c.rank] >= RV['J'])));
      return [...(safeLead.length ? safeLead : dropSoleSuits(playable))].sort(byRankAsc)[0];
    }

    if(hasSuit) {
      // „Ce bine e să fii ultimul": mână curată + As/K (nu K♥) + carte mică pe culoare → prind.
      { const w = tryLastCleanWin(); if(w) return w; }
      const sorted = [...sameSuit].sort(byRankAsc);
      const kInimaCard = sameSuit.find(c => c.rank === 'K' && c.suit === '♥');

      // Trebuie să urmez ♥ și am K♥ în mână:
      if(kInimaCard) {
        // Dacă K♥ NU câștigă mâna (cineva are deja ceva peste el sau eu nu sunt
        // ultimul dar oricum e sub vârf), scap de el ACUM — e ocazia perfectă.
        if(RV['K'] < topInLead) return kInimaCard;
        // K♥ ar câștiga (e cea mai mare ♥ din trick până acum). Dacă sunt ultimul,
        // sigur l-aș lua → joc altă ♥ mică în loc. Dacă nu sunt ultimul, e riscant
        // să-l țin (poate iese A♥ după mine și l-aș fi putut scăpa) — dar regula
        // cere să urmez culoarea, deci aleg cea mai mică ♥ care nu e K♥.
        const smallHearts = sorted.filter(c => !(c.rank === 'K' && c.suit === '♥'));
        if(smallHearts.length > 0) return smallHearts[0];
        return kInimaCard; // doar K♥ am pe ♥ — n-am încotro
      }

      // Nu am K♥ pe mână, dar urmez ♥:
      if(trickHasKInima) {
        // K♥ e deja în trick — NU vreau să-l câștig eu. Dacă sunt ultimul și pot
        // pierde, arunc cea mai mare ♥ care tot pierde (curăț o carte mare în siguranță).
        const ducking = sorted.filter(c => RV[c.rank] < topInLead);
        if(ducking.length > 0) return ducking[ducking.length - 1];
        return sorted[0]; // nu pot evita → cea mai mică
      }
      // Trick fără K♥ încă: joc mic ca să nu rămân eu „sus" și să trag K♥-ul cuiva.
      const ducking = sorted.filter(c => RV[c.rank] < topInLead);
      if(ducking.length > 0) return ducking[ducking.length - 1];
      return sorted[0];
    }

    // Nu am culoarea cerută (off-suit) — ȘANSA DE AUR pentru K♥: îl arunc fără risc!
    const kInima = playable.find(c => c.rank === 'K' && c.suit === '♥');
    if(kInima) return kInima;
    // Altfel descărcare inteligentă (golesc culori scurte, scap de cărți mari).
    return smartDiscard(playable);
  }

  if(mode === 'qMinus') {
    // Fiecare Q luată = -3 — scapă de Dame, dar nu trage Q-ul nimănui în mâna ta.
    const trickHasQ = gs.currentTrick.some(p => p.card.rank === 'Q');
    const myQueens = hand.filter(c => c.rank === 'Q');

    if(leading) {
      // Strategia „rămâi fără o culoare" (cu excepția 50% pe Q non-♦ deja tratată în helper).
      const v = tryVoidLead();
      if(v) return v;
      { const ll = tryLoadingLead(); if(ll) return ll; } // ies cu cea mică → scot o damă din mâna adversarului
      // FINEȚE: atac mic pe o culoare unde NU am Q, păstrând Damele pentru descărcare off-suit.
      if(myQueens.length > 0) {
        const nonQueen = dropSoleSuits(playable.filter(c => c.rank !== 'Q'));
        // conduc cu cea mai mică non-Q de pe o culoare pe care adversarii o mai au
        // (a conduce cu o Q = mi-o câștig singur; a conduce o culoare unde sunt solist = la fel!)
        if(nonQueen.length > 0) return [...nonQueen].sort(byRankAsc)[0];
        return myQueens[0]; // doar Dame am — n-am încotro
      }
      return [...dropSoleSuits(playable)].sort(byRankAsc)[0];
    }

    if(hasSuit) {
      // „Ce bine e să fii ultimul": mână curată + As/K + carte mică pe culoare → prind.
      { const w = tryLastCleanWin(); if(w) return w; }
      const sorted = [...sameSuit].sort(byRankAsc);
      const qCard = sameSuit.find(c => c.rank === 'Q');
      if(qCard) {
        if(RV['Q'] < topInLead) return qCard; // Q nu câștigă → scap de ea
        const notQ = sorted.filter(c => c.rank !== 'Q');
        if(notQ.length > 0) return followToLose(notQ); // joc altă carte, nu-mi trag Q
        return qCard;
      }
      return followToLose(sameSuit);
    }

    // Off-suit — ocazie să arunc o Damă fără s-o câștig.
    const q = playable.find(c => c.rank === 'Q');
    if(q) return q;
    return smartDiscard(playable);
  }

  if(mode === 'romb') {
    // Fiecare ♦ luat = -1 → NU vrei să câștigi mâna (mai ales una cu ♦ în ea).
    // (topInLead e calculat o singură dată sus, în scope-ul funcției — îl refolosim.)

    if(leading) {
      const myDiamonds = playable.filter(c => c.suit === '♦').sort(byRankAsc);
      // OFENSIV (medium+): dacă avem cel mai MIC ♦ rămas în joc și adversarii încă au ♦,
      // îl CONDUCEM. Sunt obligați să urmeze, iar cel mai mare ♦ jucat ia -1 — nu noi
      // (cartea noastră mică nu câștigă niciodată dacă cineva pune un ♦ mai mare peste).
      // Așa scăpăm de un romb ȘI penalizăm un adversar, în loc să rămânem ultimii cu ♦.
      if(myDiamonds.length > 0 && rollStrat()) {
        const lowDia = myDiamonds[0];
        // E vreun ♦ MAI MIC ca al nostru încă neieșit (l-ar putea juca un adversar sub noi)?
        const lowerOut = RANKS.filter(r => RV[r] < RV[lowDia.rank])
          .some(r => !playedBySuit['♦'].has(r) && !hand.some(c => c.suit === '♦' && c.rank === r));
        // Mai au adversarii ♦ în mâini (altfel l-am câștiga NOI degeaba)?
        const diaOutAtOpp = (RANKS.length - playedBySuit['♦'].size - suitCounts['♦']) > 0;
        // REZERVĂ DE SCĂPARE: dacă mai am ȘI un ♦ MARE de care risc să rămân blocat (dețin cea
        // mai mare ♦ rămasă → nimeni nu mă poate „duce sub" ea), NU arunc acum ♦-ul mic — îl țin
        // ca duck pentru viitoarele levate de ♦. Altfel aș rămâne forțat să câștig o levată grasă
        // de romburi cu ♦-ul mare și aș lua mai multe minusuri decât dacă păstram cartea mică.
        const stuckHighDia = myDiamonds.length > 1 && !amCoveredInSuit('♦');
        if(!lowerOut && diaOutAtOpp && !stuckHighDia) return lowDia;
      }
      // Strategia „rămâi fără o culoare" (NU pe ♦ dacă am A/K/Q♦ — tratat în helper).
      const v = tryVoidLead();
      if(v && v.suit !== '♦') return v;
      // Altfel conduc cu cea mai mică NON-♦ de pe o culoare pe care adversarii o MAI au
      // (dacă sunt SOLIST pe ea — toate celelalte au ieșit, indiferent că am 1, 2 sau mai
      // multe — a o conduce = câștig sigur și mi-ar arunca romburi în mână). Dacă am doar ♦
      // sau doar culori-solist, conduc cu cea mai mică.
      const nonDia = dropSoleSuits(playable.filter(c => c.suit !== '♦'));
      if(nonDia.length > 0) return [...nonDia].sort(byRankAsc)[0];
      return [...dropSoleSuits(playable)].sort(byRankAsc)[0];
    }

    if(hasSuit) {
      return followToLose(sameSuit);
    }

    // Off-suit (nu avem culoarea cerută) — aici chiar putem scăpa de ♦ în siguranță,
    // pentru că nu putem câștiga mâna jucând altă culoare.
    const dia = playable.filter(c => c.suit === '♦');
    if(dia.length > 0) return [...dia].sort(byRankDesc)[0]; // scăpăm de cel mai mare ♦
    return smartDiscard(playable); // altfel descărcare inteligentă (golim culori scurte)
  }

  if(mode === 'totale') {
    // La totale: evită să iei mâini (fiecare mână = -1), K♥ (-5), Q (-3), ♦ (-1)
    // J♠ nu contează la totale
    const isBad = c => (c.rank === 'K' && c.suit === '♥') || c.rank === 'Q' || c.suit === '♦';
    const trickHasBad = gs.currentTrick.some(p => isBad(p.card));
    // (topInLead e calculat o singură dată sus, în scope-ul funcției — îl refolosim.)

    // ── SACRIFICIUL la TOTALE ──────────────────────────────────────────────────
    // Când CONDUC și am: (a) o carte SAFE (mică, pe o culoare pe care adversarii o mai
    // au și unde sunt acoperit → 100% n-o iau dacă o conduc) ȘI (b) pe ALTĂ culoare o
    // carte MARE (As/K, nu K♥) NEACOPERITĂ (n-am cărți mici sub ea ȘI dețin cea mai mare
    // rămasă din culoare → o voi câștiga oricum cândva) — atunci pot s-o DUC intenționat
    // ACUM (pierdere mică, controlată), iar mâna următoare ies cu cea safe.
    //   • 60% sacrific / 40% ies direct safe;
    //   • dacă culoarea de sacrificiu e ♦, sau (e ♥ și K♥ încă afară), sau dama ei e încă
    //     afară → riscul de a-mi pica -5/-3/-1 crește → joc safe direct în 95% (5% sacrific).
    // Anti-lanț: după un sacrificiu, data viitoare când conduc ies SAFE (nu sacrific iar).
    const tryTotaleSacrifice = () => {
      if(diff === 'easy') return null;
      if(!window._totaleSacBy) window._totaleSacBy = {};
      if(window._totaleSacBy[botIdx]) { window._totaleSacBy[botIdx] = false; return null; }
      // (a) cartea SAFE = cea mai mică carte NON-rea de pe o culoare acoperită pe care
      //     adversarii o mai au.
      let safeCard = null;
      ['♠','♥','♦','♣'].forEach(su => {
        if(!oppHasSuit(su)) return;        // solist → aș câștiga-o, nu e safe
        if(!amCoveredInSuit(su)) return;   // am o carte peste rămasul adversarilor → aș putea câștiga
        const myLow = hand.filter(c => c.suit === su).sort(byRankAsc)[0];
        if(!myLow || isBad(myLow)) return; // nu pasez cu o carte rea (♦/Q/K♥)
        if(!safeCard || RV[myLow.rank] < RV[safeCard.rank]) safeCard = myLow;
      });
      if(!safeCard) return null;
      // (b) cartea MARE neacoperită pe ALTĂ culoare (As/K, nu K♥; cea mai mare rămasă din
      //     culoare → câștig garantat; fără cărți mici de protecție pe culoarea aia).
      let sacCard = null;
      ['♠','♥','♦','♣'].forEach(su => {
        if(su === safeCard.suit) return;
        if(!oppHasSuit(su)) return;                                // dacă-s solist, ar dumpa ORICE penalizare în mâna mea → nu
        const myY = hand.filter(c => c.suit === su);
        if(myY.length === 0) return;
        const top = [...myY].sort(byRankDesc)[0];
        if(RV[top.rank] < RV['K']) return;                         // doar As/K = „majoră"
        if(top.rank === 'K' && top.suit === '♥') return;           // K♥ nu se sacrifică (-5)
        if(RV[top.rank] < highestOutstanding(su)) return;          // un adversar are una mai mare → nu garantez câștigul
        if(myY.some(c => RV[c.rank] <= RV['10'])) return;          // are protecție (cărți mici) → nu e „neacoperită"
        if(!sacCard || RV[top.rank] > RV[sacCard.rank]) sacCard = top;
      });
      if(!sacCard) return null;
      // (c) risc pe culoarea de sacrificiu → crește șansa „safe direct".
      const sSuit = sacCard.suit;
      const qOut = !playedBySuit[sSuit].has('Q') && !hand.some(c => c.suit === sSuit && c.rank === 'Q');
      const kHeartOut = sSuit === '♥' && !playedBySuit['♥'].has('K') && !hand.some(c => c.rank === 'K' && c.suit === '♥');
      const risky = sSuit === '♦' || kHeartOut || qOut;
      const sacChance = risky ? 0.05 : 0.60;
      if(Math.random() > sacChance) return null; // ies SAFE direct (cad pe deschiderea normală)
      window._totaleSacBy[botIdx] = true;        // marchez: data viitoare ies safe
      return sacCard;                            // DUC cartea mare acum (sacrificiu controlat)
    };

    // SQUEEZE / TAFREESH de final (doar endgame, hard/adaptive, conservator): la totale fiecare
    // levată = -1. Dacă pot CONDUCE o carte mică pe o culoare unde GARANTAT nu câștig EU (un
    // adversar deține o carte mai mare ȘI e obligat să urmeze), atunci -1 merge la el, nu la mine,
    // și scap și de o carte mică. Dacă din void-urile DEDUSE public un singur adversar mai poate
    // urma, îl pot ȚINTI pe liderul la scor. Garduri stricte: nu conduc carte rea, nu conduc dacă
    // aș putea câștiga EU levata (solist sau dețin top-ul rămas).
    const tryEndgameSqueeze = () => {
      if(diff !== 'hard' && diff !== 'adaptive') return null;
      if(hand.length > 4) return null;            // doar finalul rundei
      if(!rollStrat()) return null;
      const scores = (roomData && roomData.totalScores) || [];
      const oppIdxs = [];
      for(let i=0;i<maxP;i++) if(i !== botIdx) oppIdxs.push(i);
      let plain = null, targeted = null, targetedScore = -Infinity;
      ['♠','♥','♦','♣'].forEach(su => {
        const mine = hand.filter(c => c.suit === su).sort(byRankAsc);
        if(mine.length === 0) return;
        const low = mine[0];
        if(isBad(low)) return;             // conduc doar cu o carte „bună" (nu ♦/Q/K♥)
        if(!oppHasSuit(su)) return;        // dacă-s solist pe ea, aș câștiga-o EU — nu
        if(!amCoveredInSuit(su)) return;   // dețin top-ul rămas → aș putea câștiga eu — nu
        if(!plain || RV[low.rank] < RV[plain.rank]) plain = low; // garantat -1 la un adversar
        const followers = oppIdxs.filter(i => !(playerVoid[i] && playerVoid[i].has(su)));
        if(followers.length === 1) {       // un singur adversar poate urma → el ia sigur levata
          const sc = scores[followers[0]] != null ? scores[followers[0]] : 0;
          if(sc > targetedScore) { targetedScore = sc; targeted = low; } // lovim liderul la scor
        }
      });
      return targeted || plain;
    };

    if(leading) {
      // SQUEEZE de final — prioritar în endgame (pasează sigur un -1 unui adversar).
      { const sq = tryEndgameSqueeze(); if(sq) return sq; }
      // Sacrificiul controlat (vezi mai sus) — prioritar față de deschiderea obișnuită.
      { const sac = tryTotaleSacrifice(); if(sac) return sac; }
      // Strategia „rămâi fără o culoare" (cu excepțiile A/K♥, A/K/Q♦, 50% Q — în helper).
      const v = tryVoidLead();
      if(v) return v;
      { const ll = tryLoadingLead(); if(ll) return ll; } // ies cu cea mică → forțez o levată grasă
      // La atac NU conduc cu o carte rea (aș câștiga eu mâna și aș lua minusul!).
      // Conduc cu cea mai mică carte „bună", de pe o culoare pe care adversarii o MAI au
      // (dacă sunt solist pe ea, oricum o câștig singur).
      const good = dropSoleSuits(playable.filter(c => !isBad(c)));
      if(good.length > 0) return [...good].sort(byRankAsc)[0];
      // Doar cărți rele în mână → conduc cu cea mai mică, dar tot de pe o culoare pe care
      // adversarii o MAI au (dacă sunt solist, mi-ar arunca și mai multe penalizări în mână).
      return [...dropSoleSuits(playable)].sort(byRankAsc)[0];
    }

    if(hasSuit) {
      // „Ce bine e să fii ultimul": mână curată (romburi-număr tolerate) + As/K (nu K♥)
      // + carte mică pe culoare → prind, scap de cartea mare și iau inițiativa.
      { const w = tryLastCleanWin(); if(w) return w; }
      return followToLose(sameSuit);
    }
    // Off-suit — scapă de cărți rele dacă trick-ul nu are deja
    const bad = playable.filter(isBad);
    if(bad.length > 0 && !trickHasBad) {
      // scăpăm de cea mai „grea" carte rea: K♥ > Q > ♦ mare
      const worst = [...bad].sort((a,b) => {
        const w = c => (c.rank==='K'&&c.suit==='♥') ? 100 : (c.rank==='Q' ? 50 : 0) + RV[c.rank];
        return w(b) - w(a);
      })[0];
      return worst;
    }
    if(bad.length > 0 && trickHasBad) {
      // Trick-ul deja are ceva rău — nu adăuga altă carte rea, descarcă inteligent din rest
      const notBad = playable.filter(c => !isBad(c));
      if(notBad.length > 0) return smartDiscard(notBad);
    }
    return smartDiscard(playable);
  }

  // Fallback
  return [...playable].sort(byRankAsc)[0];
}

// Alege UN nume de bot care nu se repetă (excludem numele tuturor jucătorilor prezenți).
function pickOneBotName(usedLowerSet) {
  let pool = BOT_NAMES_POOL.filter(n => !usedLowerSet.has(n.name.trim().toLowerCase())).map(n => ({...n}));
  if(pool.length === 0) {
    let k = 1; while(usedLowerSet.has(('bot ' + k))) k++;
    return 'Bot ' + k; // fallback dacă s-au epuizat numele
  }
  const total = pool.reduce((a, n) => a + n.weight, 0);
  let r = Math.random() * total, idx = 0;
  for(; idx < pool.length; idx++) { r -= pool[idx].weight; if(r <= 0) break; }
  if(idx >= pool.length) idx = pool.length - 1;
  return pool[idx].name;
}

// La pornirea partidei hibride înlocuim măștile din lobby („Bot 1"…) cu nume REALE, diferite de
// ale jucătorilor umani (și unele de altele). Oamenii își păstrează numele; fiecare bot capătă un
// nume liber din pool. (Analog cu regula din single-player, unde boții exclud numele tău.)
function assignRealBotNames(s) {
  if(!s || !s.players) return;
  const maxP = s.maxPlayers || s.players.length || 4;
  const norm = x => (x || '').trim().toLowerCase();
  const used = new Set();
  for(let i = 0; i < maxP; i++) { const p = s.players[i]; if(p && !p.isBot) used.add(norm(p.name)); }
  for(let i = 0; i < maxP; i++) {
    const p = s.players[i];
    if(!p || !p.isBot) continue;
    const fresh = pickOneBotName(used);
    p.name = fresh;
    used.add(norm(fresh));
  }
}

// GAZDA umple un slot gol cu un bot (sincronizat la toți prin Supabase).
async function addBotToSlot(i) {
  const s = roomData;
  if(window.isSinglePlayer) return;
  if((window._humanIndex ?? myIndex) !== s.host) return; // doar gazda
  const maxP = s.maxPlayers || 4;
  if(i < 0 || i >= maxP || s.players[i]) return; // slot invalid sau deja ocupat
  const botCount = s.players.filter(p => p && p.isBot).length;
  const cap = maxBotsAllowed(maxP);
  if(botCount >= cap) {
    toast(`Maxim ${cap} ${cap === 1 ? 'bot' : 'boți'} — rămân cel puțin 2 jucători umani.`);
    return;
  }
  // În LOBBY botul poartă o mască generică („Bot 1", „Bot 2"…), nu un nume real — ca să nu se
  // confunde cu un jucător uman care s-ar putea alătura. Numele real se atribuie la startGame.
  const usedMasks = new Set(s.players.filter(p => p && p.isBot).map(p => p.name));
  let n = 1; while(usedMasks.has('Bot ' + n)) n++;
  s.players[i] = {
    name: 'Bot <span class="zar-animat">🎲</span>',
    id: 'bot-' + i + '-' + Math.random().toString(36).slice(2, 7),
    isBot: true
  };
    await updateRoom(roomId, s);
    renderLobby(); // randare imediată pentru gazdă (ecoul realtime randează și la ceilalți)
  }

// GAZDA scoate un bot dintr-un slot (redevine gol, disponibil pentru un om).
async function removeBotFromSlot(i) {
  const s = roomData;
  if(window.isSinglePlayer) return;
  if((window._humanIndex ?? myIndex) !== s.host) return;
  if(!s.players[i] || !s.players[i].isBot) return;
  s.players[i] = null;
  await updateRoom(roomId, s);
  renderLobby();
}

function renderLobby() {
  const s = roomData;
  const maxP = s.maxPlayers || 4;

  if(window.isSinglePlayer) {
    document.getElementById('lobbyTitleType').textContent = `Single Player (${maxP} Jucători)`;
    document.getElementById('lobbyCode').style.display = 'none';
  } else {
    document.getElementById('lobbyTitleType').textContent = `Cod Cameră (${maxP} Jucători)`;
    document.getElementById('lobbyCode').style.display = '';
    document.getElementById('lobbyCode').textContent = roomId;
  }

  // Panoul de dificultate + învățare apare doar în Single Player.
  const spOpts = document.getElementById('spOptions');
  if(spOpts) {
    spOpts.style.display = window.isSinglePlayer ? '' : 'none';
    if(window.isSinglePlayer) refreshBotMemoryUI();
  }

  const isHost = (window._humanIndex ?? myIndex) === s.host;
  const allowBots = !window.isSinglePlayer && isHost; // doar GAZDA umple sloturi cu boți (online)
  const botCount = s.players.filter(p => p && p.isBot).length;
  const botCap = maxBotsAllowed(maxP);

  const pDiv = document.getElementById('playerSlots');
  pDiv.innerHTML = '';
  for(let i=0; i<maxP; i++){
    const p = s.players[i];
    const isMe = i === myIndex;
    const div = document.createElement('div');
    div.className = 'player-slot ' + (p ? 'filled' : 'empty') + (isMe ? ' me' : '');
    // Controlul gazdei: pe slot GOL → adaugă bot (cât timp suntem sub plafon); pe slot de BOT → scoate.
    let hostCtrl = '';
    if(allowBots && !p && botCount < botCap) {
      hostCtrl = `<button class="lobby-bot-btn add" onclick="addBotToSlot(${i})">🤖 Adaugă bot</button>`;
    } else if(allowBots && p && p.isBot) {
      hostCtrl = `<button class="lobby-bot-btn rem" onclick="removeBotFromSlot(${i})" title="Scoate botul">✖</button>`;
    }
    div.innerHTML = `
      <span class="slot-icon">${p?'✅':'⏳'}</span>
      <span class="slot-name">${p ? p.name : `Așteptare Jucător ${i+1}...`}</span>
      ${isMe ? '<span class="slot-badge">TU</span>' : ''}
      ${p && p.isBot ? '<span class="slot-badge slot-badge-ai">🤖 AI</span>' : ''}
      ${hostCtrl}
    `;
    pDiv.appendChild(div);
  }

  // Mesaj pentru gazdă despre regula boților (doar online, fără single-player).
  const hintEl = document.getElementById('lobbyBotHint');
  if(hintEl) {
    if(allowBots) {
      const emptyCount = s.players.filter(p => !p).length;
      hintEl.style.display = '';
      hintEl.textContent = botCount > 0
        ? `Partidă hibridă: ${botCount} ${botCount===1?'bot joacă':'boți joacă'} la nivel GREU.` +
          (emptyCount > 0 ? ` Mai aștepți ${emptyCount} ${emptyCount===1?'jucător uman':'jucători umani'}.` : '')
        : `Poți umple sloturi cu boți (max ${botCap}). Fără boți rămâne multiplayer clasic.`;
    } else {
      hintEl.style.display = 'none';
    }
  }

  const allFull = s.players.every(p => p !== null);

  document.getElementById('cancelBtnLobby').textContent = window.isSinglePlayer ? '❌ ANULEAZĂ' : '❌ ANULEAZĂ CAMERĂ';
  document.getElementById('cancelBtnLobby').style.display = isHost ? 'block' : 'none';

  if(isHost){
    const btn = document.getElementById('startBtn');
    btn.style.display = 'block'; btn.disabled = !allFull;
    document.getElementById('lobbyWait').textContent = '';
  } else {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('lobbyWait').textContent = allFull ? 'Gazda va porni partida...' : 'Se așteaptă conectarea tuturor jucătorilor...';
  }
}

async function startGame() {
  const s = roomData;
  if(!s.players.every(p => p !== null)) return;

  // Hibrid: înlocuim măștile din lobby cu nume REALE, diferite de ale jucătorilor umani (care
  // s-au putut alătura după ce gazda a pus boții). Oamenii își păstrează numele.
  // (Analog cu regula din single-player, unde boții exclud numele tău.)
  assignRealBotNames(s);

  s.screen = 'game';
  s.roundNumber = 1;
  s.pickerIndex = 0;
  s.gameStartedAt = Date.now(); // pentru cronometru
  window._peekBotCards = false;  // bifa de „arată cărțile" pornește mereu NEBIFATĂ
  window._totaleSacBy = {};       // anti-lanț pt. sacrificiul de la totale (per bot)
  prepareSelectionPhase(s);
  await updateRoom(roomId, s);
}

function prepareSelectionPhase(s) {
  const maxP = s.maxPlayers || 4;
  const cards = dealCards(maxP);

  // Adaptăm configurația de cărți în funcție de numărul de jucători
  if(maxP === 3) {
    RANKS = ['9','10','J','Q','K','A'];
    RV = {'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  } else {
    RANKS = ['7','8','9','10','J','Q','K','A'];
    RV = {'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  }

  s.gameState = {
    phase: 'selecting',
    hands: cards,
    mode: null,
    currentTrick: [],
    tricks: [],
    currentPlayer: s.pickerIndex,
    leadSuit: null,
    finished: false,
    roundScores: null,
    // Rentz Specific Data
    columns: {'♠':[],'♥':[],'♦':[],'♣':[]},
    colStarted: {'♠':false,'♥':false,'♦':false,'♣':false},
    upNext: {'♠':5,'♥':5,'♦':5,'♣':5},
    downNext: maxP === 3 ? {'♠':2,'♥':2,'♦':2,'♣':2} : {'♠':3,'♥':3,'♦':3,'♣':3},
    finishOrder: [],
    passCount: 0
  };
}

// ─── ROUTER PE UPDATE REALTIME ────────────────────────────────────────────────
function onRoomUpdate() {
  const s = roomData;
  if(!s) return; // ex.: un timer de animație (spargere cioburi) se declanșează după ce am ieșit din joc
  // Anunțuri broadcast (deconectare / migrare gazdă / revenire) — afișate O SINGURĂ dată la toți.
  if(!window.isSinglePlayer && s._notice){
    const n = s._notice;
    const fresh = n.id ? !noticeAlreadySeen(n.id) : (n.ts > (window._lastNoticeTs || 0));
    if(fresh){
      if(n.id) markNoticeSeen(n.id);
      window._lastNoticeTs = n.ts || Date.now();
      showInfoPopup(n.msg);
    }
  }
  // Inactivitate la rândul meu + buton „Revino la joc" pentru spectatorul devenit bot.
  // (Recuperarea AUTOMATĂ a locului se face DOAR la reconectare reală — vezi resumeRealtime și
  //  restaurarea sesiunii — ca să NU anulăm o transformare voită prin inactivitate.)
  if(!window.isSinglePlayer){ manageTurnIdle(s); manageReclaimSpectatorBtn(s); ensureStuckTurnTicker(); }
  // Gazda a anulat partida: flag pus în stare și propagat prin UPDATE la toți. Reacționăm
  // ÎNAINTEA oricărei randări — ieșim la home, fără să mai trecem prin ecranele de joc/final.
  if(s.cancelled && !window.isSinglePlayer) {
    toast('Partida a fost anulată de către gazdă!');
    quitToHome();
    return;
  }
  const maxP = s.maxPlayers || 4;
  if(maxP === 3) {
    RANKS = ['9','10','J','Q','K','A'];
    RV = {'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  } else {
    RANKS = ['7','8','9','10','J','Q','K','A'];
    RV = {'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  }

  // Cât timp un bot acționează (myIndex e temporar setat la indexul botului),
  // nu randăm UI-ul — ar arăta mâna botului ca fiind "a mea". Randarea reală
  // se face după ce funcția bot își restaurează myIndex la jucătorul uman.
  if(window._suppressRender) return;

  // Mâna s-a confirmat (pendingTrick/spTrickDisplay au dispărut) și overlay-ul încă există →
  // cărțile fac un scurt „zoom in", apoi se SPARG ÎN CIOBURI (8 fragmente care se împrăștie,
  // fac glow și dispar), iar apoi închidem overlay-ul. Mâna următoare se randează DEDESUBT.
  const existingOverlay = document.getElementById('trickTakenOverlay');
  if(existingOverlay && s.gameState && !s.gameState.pendingTrick && !s.gameState.spTrickDisplay) {
    if(existingOverlay.dataset.zooming !== '1') {
      existingOverlay.dataset.zooming = '1';
      existingOverlay.classList.add('zooming');
      // BONUS: indicatorii de rând + beep-ul de tură stau pe pauză până se împrăștie cioburile.
      window._fxBusyUntil = Date.now() + 1450;
      // Dacă mâna asta a ÎNCHEIAT runda (mod cu levate), ținem panoul de scor pe pauză până se
      // termină spargerea cioburilor — la fel ca la etalate (vezi gardele din renderGame).
      const endsRound = !!(s.gameState.finished && s.gameState.mode !== 'rentz');
      if(endsRound) window._trickShatterRound = s.roundNumber;
      if(_trickTakenTimeout) { clearTimeout(_trickTakenTimeout); }
      // după zoom-in (~0.5s), spargem cărțile din sloturi
      setTimeout(() => {
        const ov = document.getElementById('trickTakenOverlay');
        if(ov) { try { shatterAllIn(ov.querySelector('#trickSlots'), '.trick-slot-frame.filled', 'scatter'); } catch(e){} }
      }, 470);
      // scoatem overlay-ul după ce s-au împrăștiat cioburile (zoom 0.5s + cioburi ~0.9s)
      _trickTakenTimeout = setTimeout(() => {
        const ov2 = document.getElementById('trickTakenOverlay');
        if(ov2) ov2.remove();
        _trickTakenTimeout = null;
        // Abia ACUM eliberăm indicatorii de rând + beep-ul (mâna următoare „începe" vizual).
        window._fxBusyUntil = 0;
        // Spargerea finală s-a terminat → re-randăm ca să apară panoul cu „PROGRESEAZĂ".
        if(endsRound) { window._trickShatterDone = s.roundNumber; onRoomUpdate(); }
        else { try { renderGame(); } catch(e){} }
      }, 1380);
    }
    // NU facem return: lăsăm randarea de mai jos să pregătească mâna următoare în spate.
  }

  if(s.screen === 'lobby') { showScreen('lobby'); renderLobby(); return; }
  if(s.screen === 'game') {
    const staleOv = document.getElementById('roundOverlay'); if(staleOv) staleOv.remove();
    showScreen('game'); calibrateCardSize(); renderGame();
    // Conduce boții: în single-player (oricum) și în multiplayer hibrid DOAR pe clientul gazdei.
    // Are gărzi interne (exact-o-dată / _botActing), deci e sigur să-l chemăm la fiecare update.
    scheduleBotTurnIfNeeded();
    return;
  }
  if(s.screen === 'final') {
    const staleOv = document.getElementById('roundOverlay'); if(staleOv) staleOv.remove();
    showScreen('final'); renderFinal(); return;
  }
}

// ─── MAIN GAME RENDERER ───────────────────────────────────────────────────────
function calibrateCardSize() {
  const isDesktop = _effViewW() >= 900;
  const root = document.documentElement;
  const sh = window.screen.height;
  const iw = window.innerHeight;

  if(isDesktop) {
    // Proporții NOI din înălțimea ecranului (sh), numitor unic 33.5 (la cerere):
    // status bar 1 · header 2 · cărțile mele 4.5 · rândul de deasupra mâinii 0.7
    // ⇒ panoul meu 5.8 · panou oponenți 3.3 · etichete jocuri oponenți 0.7 (font).
    // Restul spațiului revine MESEI de joc.

    const cardH    = Math.round(sh * 4.5 / 33.5);
    const cardW    = Math.round(cardH * 75 / 110);
    root.style.setProperty('--card-w', cardW + 'px');
    root.style.setProperty('--card-h', cardH + 'px');

    const statusH  = Math.round(sh * 1   / 33.5);
    const headerH  = Math.round(sh * 2   / 33.5);
    const oppH     = Math.round(sh * 3.3 / 33.5);
    const handTopH = Math.round(sh * 0.7 / 33.5);
    const myPanelH = Math.round(sh * 5.8 / 33.5);
    const scoresH  = Math.round(headerH * 0.78);   // clasamentul trăiește ÎN header
    const handFs   = Math.round(handTopH * 0.60);

    // HEADER: înălțime fixă 2/33.5 + conținut proporțional (Rundă, joc, cronometru,
    // comutatoare). sizeHdrDynamic nu mai atinge nimic pe desktop — valorile de aici rămân.
    const gh = document.querySelector('.game-header');
    if(gh){ gh.style.height = headerH + 'px'; gh.style.paddingTop = '2px'; gh.style.paddingBottom = '2px'; }
    const rbEl = document.getElementById('roundBadge');
    if(rbEl) rbEl.style.fontSize = Math.round(headerH * 0.28) + 'px';
    const mbEl = document.getElementById('modeBadge');
    if(mbEl) mbEl.style.fontSize = Math.round(headerH * 0.22) + 'px';
    const tFs = Math.round(headerH * 0.18);
    const t1 = document.getElementById('gameTimer');       if(t1) t1.style.fontSize = tFs + 'px';
    const t2 = document.getElementById('gameTimerMobile'); if(t2) t2.style.fontSize = tFs + 'px';
    const ticon = Math.round(headerH * 0.30);
    // Ambele svg-uri de stare per buton (altfel mărimea sărea la comutare on/off, cw/ccw).
    document.querySelectorAll('#swapDirWrap svg, #soundToggleWrap svg').forEach(sv => {
      sv.style.width = ticon + 'px'; sv.style.height = ticon + 'px';
    });

    // PANOUL MEU: 5.8/33.5 total; rândul de deasupra cărților = 0.7/33.5.
    const myWrap = document.querySelector('.my-hand-wrap');
    if(myWrap) myWrap.style.height = myPanelH + 'px';
    const msEl = document.getElementById('myScore');
    const handTopRow = msEl ? msEl.parentElement : null;
    if(handTopRow){ handTopRow.style.height = handTopH + 'px'; handTopRow.style.minHeight = handTopH + 'px'; handTopRow.style.alignItems = 'center'; }

    // Aplicăm proporțiile
    const oppRow = document.querySelector('.opponents-row');
    if(oppRow) {
      oppRow.style.height = oppH + 'px';
      // Calculăm lățimea cărților spate după render
      requestAnimationFrame(() => {
        const opponents = oppRow.querySelectorAll('.opponent');
        if(opponents.length === 0) return;
        // Lățimea unui panou adversar
        const panel0 = opponents[0];
        const oppW = panel0.clientWidth - 18; // minus padding orizontal + mică margine de siguranță
        const maxCards = 8, gap = 2; // gap REAL din CSS (.opp-cards) — altfel cele 8 ieșeau prea late și se rupeau pe 2 rânduri
        // Cărțile trebuie să încapă pe LĂȚIME (toate 8 pe UN rând) ȘI pe ÎNĂLȚIME. Pentru înălțime
        // măsurăm spațiul REAL rămas în panou (înălțime panou − padding − rândul cu numele − rândul cu
        // etichetele), NU „jumătate de panou" — altfel cărțile ieșeau mai înalte decât containerul
        // .opp-cards (overflow:hidden) și li se tăia partea de jos (la cele dezvăluite, simbolul).
        const pcs0 = getComputedStyle(panel0);
        const padV0 = parseFloat(pcs0.paddingTop) + parseFloat(pcs0.paddingBottom);
        const nameEl0  = panel0.querySelector('.opp-header-row') || panel0.querySelector('.opp-name-score');
        const gamesEl0 = panel0.querySelector('.opp-games-row');
        // ÎNTÂI setăm fontul etichetelor (mai MIC: 0.5/33.5, ca să rămână loc cărților spate),
        // ABIA APOI măsurăm spațiul rămas — înainte, măsuram cu fontul VECHI și abia apoi îl
        // măream, deci rândul de etichete creștea ulterior și tăia partea de jos a spatelui.
        const tagFs = Math.max(6, Math.min(Math.round(sh * 0.5 / 33.5), Math.floor((oppW - 20) / 7)));
        root.style.setProperty('--opp-game-fs', tagFs + 'px');
        void panel0.offsetHeight; // reflow: măsurătorile de mai jos văd fonturile noi
        const availH = Math.max(10, panel0.clientHeight - padV0
                                    - (nameEl0  ? nameEl0.offsetHeight  : 0)
                                    - (gamesEl0 ? gamesEl0.offsetHeight : 0) - 4);
        const wByWidth  = Math.floor((oppW - gap * (maxCards - 1)) / maxCards);
        const wByHeight = Math.floor(availH / (110 / 75));
        const cbW = Math.max(Math.min(wByWidth, wByHeight), 5);
        const cbH = Math.round(cbW * 110 / 75);
        root.style.setProperty('--card-back-w', cbW + 'px');
        root.style.setProperty('--card-back-h', cbH + 'px');
      });
    }

    const sb = document.getElementById('statusBar');
    if(sb) { sb.style.minHeight = statusH + 'px'; sb.style.fontSize = Math.round(statusH * 0.38) + 'px'; }

    const liveScores = document.querySelector('.live-scores');
    // clasamentul e din nou în header — fontul lui se leagă de bugetul de înălțime
    if(liveScores) liveScores.style.fontSize = Math.round(scoresH * 0.18) + 'px';

    // Panoul adversarilor — nume mai MIC, etichetele jocurilor mai MARI (0.7/33.5 din sh)
    const oppNameFs = Math.round(oppH * 0.16);
    const oppTagFs  = Math.round(sh * 0.5 / 33.5);
    root.style.setProperty('--opp-name-fs', oppNameFs + 'px');
    root.style.setProperty('--opp-tag-fs',  oppTagFs  + 'px');
    // (--card-back-w/h se calculează DOAR în rAF-ul de mai sus, ținând cont să încapă 8 cărți pe
    //  LĂȚIME; calculul vechi bazat doar pe înălțime le făcea prea late și ieșeau tăiate pe desktop.)

    // Panoul mână — font proporțional
    root.style.setProperty('--hand-fs', handFs + 'px');

    // Clasament pe o linie — font proporțional cu scoresH
    const liveScoreFs = Math.round(scoresH * 0.38);
    root.style.setProperty('--live-score-fs', liveScoreFs + 'px');

    // Panou jocuri de ales — font proporțional din sh
    const selectTitleFs = Math.round(sh * 0.6 / 24.5);
    const selectDescFs  = Math.round(sh * 0.23 * 0.95 / 24.5);
    root.style.setProperty('--select-title-fs', selectTitleFs + 'px');
    root.style.setProperty('--select-desc-fs', selectDescFs + 'px');

  } else {
    // Mobil: cardH din spațiul disponibil pentru mână
    const handAreaH = Math.floor(iw * 0.32);
    const availForCards = handAreaH - 20 - 28 - 4;
    const cardH2rows = Math.floor((availForCards - 4) / 2);
    const cardH = Math.max(Math.min(cardH2rows, 110), 40);
    const cardW = Math.round(cardH * 75 / 110);
    root.style.setProperty('--card-w', cardW + 'px');
    root.style.setProperty('--card-h', cardH + 'px');
  }
}

// Ascunde/afișează side panel la rentz pe mobil
function toggleSidePanelForRentz(hide) {
  if(window.innerWidth >= 900) return; // doar pe mobil
  const sp = document.querySelector('.side-panel');
  if(sp) sp.style.display = hide ? 'none' : '';
}

// Coadă pentru mesajele mobile la rentz (evită suprapunerea zoom-in/out)
window._rentzMsgQueue = window._rentzMsgQueue || [];
window._rentzMsgShowing = window._rentzMsgShowing || false;
window._rentzMsgLastKeys = window._rentzMsgLastKeys || new Set();

function queueRentzMobileMsg(key, html, fontSizePx) {
  if(window._rentzMsgLastKeys.has(key)) return; // deja afișat, nu repetăm
  window._rentzMsgLastKeys.add(key);
  // limităm memoria cheilor (evităm creștere infinită)
  if(window._rentzMsgLastKeys.size > 50) {
    const arr = Array.from(window._rentzMsgLastKeys);
    window._rentzMsgLastKeys = new Set(arr.slice(-30));
  }
  window._rentzMsgQueue.push({html, fontSizePx});
  processRentzMsgQueue();
}

function processRentzMsgQueue() {
  if(window._rentzMsgShowing) return;
  const next = window._rentzMsgQueue.shift();
  if(!next) return;
  const mobileMsgEl = document.getElementById('rentzMobileMsg');
  if(!mobileMsgEl) {
    // Elementul nu e încă în DOM — reîncercăm peste puțin, fără să blocăm coada
    window._rentzMsgQueue.unshift(next);
    setTimeout(processRentzMsgQueue, 200);
    return;
  }
  window._rentzMsgShowing = true;
  const inner = document.createElement('div');
  inner.className = 'zoom-inner';
  inner.style.fontSize = next.fontSizePx + 'px';
  inner.innerHTML = next.html;
  mobileMsgEl.innerHTML = '';
  mobileMsgEl.appendChild(inner);
  setTimeout(() => {
    window._rentzMsgShowing = false;
    if(mobileMsgEl.contains(inner)) mobileMsgEl.innerHTML = '';
    processRentzMsgQueue();
  }, 1000);
}

function updateGameTimer() {
  const s = roomData;
  if(!s || !s.gameStartedAt) return;
  const elapsed = Math.max(0, Date.now() - s.gameStartedAt);
  const totalSec = Math.floor(elapsed / 1000);
  const hh = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const ss = String(totalSec % 60).padStart(2, '0');
  const text = `${hh}:${mm}:${ss}`;
  const t1 = document.getElementById('gameTimerText');
  const t2 = document.getElementById('gameTimerTextMobile');
  if(t1) t1.textContent = text;
  if(t2) t2.textContent = text;
}
