async function startTiebreakerSession() {
  const ov = document.getElementById('tiebreakerIntroOverlay'); if(ov) ov.remove();
  const s = roomData; if(!s) return;
  s.tiebreakerSession = { roundsDone: 0 };
  s.pickerIndex = 0;
  s.screen = 'game';
  prepareRentzRound(s);
  if(window.isSinglePlayer) window._botActing = false;
  roomData = s;
  await updateRoom(roomId, s);
}

function hasAnyTie(s) {
  const scores = s.totalScores;
  return scores.some((sc, i) => scores.some((sc2, j) => i !== j && sc === sc2));
}

function prepareRentzRound(s) {
  const maxP = s.maxPlayers || 4;
  if(maxP === 3) {
    RANKS = ['9','10','J','Q','K','A'];
    RV = {'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  } else {
    RANKS = ['7','8','9','10','J','Q','K','A'];
    RV = {'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14};
  }
  const cards = dealCards(maxP);
  s.gameState = {
    phase: 'playing', // sare peste selecție
    hands: cards,
    mode: 'rentz',
    currentTrick: [],
    tricks: [],
    currentPlayer: s.pickerIndex,
    leadSuit: null,
    finished: false,
    roundScores: null,
    columns: {'♠':[],'♥':[],'♦':[],'♣':[]},
    colStarted: {'♠':false,'♥':false,'♦':false,'♣':false},
    upNext: {'♠':5,'♥':5,'♦':5,'♣':5},
    downNext: maxP === 3 ? {'♠':2,'♥':2,'♦':2,'♣':2} : {'♠':3,'♥':3,'♦':3,'♣':3},
    finishOrder: [],
    passCount: 0
  };
}

function exportJSON(s) {
  if(myIndex !== s.host) return;
  // Single-player: NU exportăm scorul — boții joacă cu nume reale din grup (Robi, Mircea, Edi…)
  // și ar murdări campionatul din aplicația de scor. Doar partidele online pure se exportă.
  if(window.isSinglePlayer) return;
  // La jocul HIBRID (multiplayer cu boți) NU exportăm scorul: boții folosesc nume reale din
  // grup (Robi, Mircea, Edi…) și ar murdări campionatul din aplicația de scor. Partidele cu
  // boți sunt doar pentru antrenament/distracție, nu intră în statistici.
  if(isHybridGame()) return;
  const now = new Date();
  const ts = now.getFullYear().toString() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0') + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0');
  const data = {
    version: 2,
    maxPlayers: s.maxPlayers || 4,
    players: s.players.map(p => p ? p.name : null),
    roundHistory: s.roundHistory || [],
    exportedAt: now.toISOString()
  };
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rentz_${ts}.json`; a.click();
  URL.revokeObjectURL(url);
  setTimeout(() => toast('✅ Scorul partidei a fost exportat!'), 800);
}

// ─── FINAL SCREEN ENDPOINT ────────────────────────────────────────────────────
function renderFinal() {
  const s = roomData;

  // Sunet de final — o singură dată (garda se resetează în renderGame). Fanfară dacă jucătorul
  // (perspectiva locală) e pe primul loc la scor, altfel un final neutru.
  if(!window._finalSoundPlayed) {
    window._finalSoundPlayed = true;
    try {
      const hi = (window._humanIndex ?? myIndex);
      const won = Array.isArray(s.totalScores) && s.totalScores[hi] === Math.max(...s.totalScores);
      SFX.play(won ? 'win' : 'end');
    } catch(e) {}
  }

  // Salvează ultima rundă în istoric (nu a trecut prin proceedToNextCycle)
  if (s.gameState && s.gameState.roundScores && s.gameState.mode) {
    if (!s.roundHistory) s.roundHistory = [];
    const lastRoundNum = s.roundNumber - 1;
    const alreadySaved = s.roundHistory.some(r => r.roundNumber === lastRoundNum);
    if (!alreadySaved) {
      s.roundHistory.push({
        roundNumber: lastRoundNum,
        pickerIndex: s.pickerIndex,
        mode: s.gameState.mode,
        scores: [...s.gameState.roundScores]
      });
      // Plasă de siguranță: dacă ultima rundă nu a trecut prin proceedToNextCycle,
      // botul tot învață din ea aici (o singură dată, datorită gardei alreadySaved).
      if(window.isSinglePlayer && getBotDifficulty() !== 'easy') {
        if(s.gameState.mode !== 'rentz') {
          const picker = s.players[s.pickerIndex];
          if(picker && picker.isBot) recordBotGameResult(s.gameState.mode, s.gameState.roundScores[s.pickerIndex] || 0);
        }
        analyzeHumanRound(s.gameState, (window._humanIndex ?? 0), s.maxPlayers || 4);
      }
    }
  }

  const sorted = s.players.map((p, i) => ({name: p.name, score: s.totalScores[i]}))
                          .sort((a,b) => b.score - a.score);

  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  const pDiv = document.getElementById('finalPodium'); pDiv.innerHTML = '';

  sorted.forEach((p, rk) => {
    pDiv.innerHTML += `
      <div class="podium-row ${rk===0?'first':''}">
        <span style="font-size:20px;">${medals[rk]}</span>
        <span style="flex:1; font-weight:bold;">${p.name}</span>
        <span style="font-size:18px; font-weight:bold;">${p.score} p.</span>
      </div>
    `;
  });

  // Înregistrează partida în statisticile locale (single / hibrid / multiplayer), o singură dată.
  recordGameResult(s);

  // Exportă JSON o singură dată (doar gazda, doar dacă nu s-a exportat deja) — nu în single-player
  if(!window.isSinglePlayer && (window._humanIndex ?? myIndex) === s.host && !s._jsonExported) {
    s._jsonExported = true;
    exportJSON(s);
  }

  // Șterge camera din Supabase la final de joc — o face gazda (nu există cameră în single-player)
  if(!window.isSinglePlayer && (window._humanIndex ?? myIndex) === s.host && roomId && !s._roomDeleted) {
    s._roomDeleted = true;
    setTimeout(async () => {
      await deleteRoomDB(roomId);
    }, 3000); // mică întârziere ca toți să vadă ecranul final
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// STATISTICILE MELE — istoric local de partide + agregări (single / hibrid / multiplayer)
// Se înregistrează la finalul fiecărei partide, din perspectiva acestui dispozitiv (jucătorul
// de la myIndex = „tu"). Boții sunt marcați. Datele stau în IndexedDB, pe dispozitiv.
// ═══════════════════════════════════════════════════════════════════════════════
const GAME_HISTORY_KEY = 'rentz_game_history';
window._recordedGames = window._recordedGames || new Set();

async function getGameHistory(){
  try { const h = await idbGet(GAME_HISTORY_KEY); return Array.isArray(h) ? h : []; }
  catch(e){ return []; }
}
function statsGameSig(s){ return (s.gameStartedAt||0) + '_' + (roomId||'sp') + '_' + (s.maxPlayers||4); }

async function recordGameResult(s){
  try{
    if(!s || !s.players || !s.totalScores) return;
    const sig = statsGameSig(s);
    if(window._recordedGames.has(sig)) return;        // o singură dată per partidă
    const myIdx = (window._humanIndex ?? myIndex);
    if(myIdx == null || myIdx < 0 || !s.players[myIdx]) return;
    window._recordedGames.add(sig);
    const category = window.isSinglePlayer ? 'single' : (isHybridGame() ? 'hybrid' : 'multiplayer');
    const players = s.players.map(p => ({ name: p ? p.name : '?', isBot: !!(p && p.isBot) }));
    const scores  = s.totalScores.slice();
    const order   = players.map((_,i)=>i).sort((a,b)=>(scores[b]||0)-(scores[a]||0)); // scor mai mare = mai sus (ca la podium)
    const rank    = order.indexOf(myIdx);
    const rec = {
      ts: Date.now(), category, maxPlayers: s.maxPlayers || players.length || 4,
      players, scores, order, myIndex: myIdx, won: rank === 0, rank,
      rounds: (s.roundHistory||[]).filter(r=>r && r.mode).map(r => ({ p: r.pickerIndex, m: r.mode, sc: r.scores }))
    };
    const hist = await getGameHistory();
    hist.push(rec);
    while(hist.length > 1000) hist.shift();
    await idbSet(GAME_HISTORY_KEY, hist);
  }catch(e){}
}

// ── Helperi agregare ──
function statsEsc(t){ return String(t==null?'':t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(n){ return Math.round(n*100) + '%'; }
function botTag(isBot){ return isBot ? ' <span class="st-bot">🤖</span>' : ''; }

function catSummary(games){
  const n = games.length;
  const wins = games.filter(g=>g.won).length;
  const sum = games.reduce((a,g)=>a + ((g.scores && g.scores[g.myIndex])||0), 0);
  return { n, wins, winRate: n?wins/n:0, avgScore: n?sum/n:0 };
}

function statsLeaderboard(games){
  const map = {};
  games.forEach(g=>{
    const winner = (g.order && g.order.length) ? g.order[0] : null;
    (g.players||[]).forEach((p,i)=>{
      const isMe = (i === g.myIndex);
      const key = isMe ? '__ME__' : (p.name + '|' + (p.isBot?'b':'h'));
      if(!map[key]) map[key] = { name:p.name, isBot:!!p.isBot, isMe, games:0, wins:0, sum:0 };
      const e = map[key]; e.games++; if(winner===i) e.wins++; e.sum += (g.scores && g.scores[i])||0;
    });
  });
  return Object.values(map)
    .map(e=>({ ...e, winRate: e.games?e.wins/e.games:0, avg: e.games?e.sum/e.games:0 }))
    .sort((a,b)=> b.wins-a.wins || b.winRate-a.winRate || b.avg-a.avg);
}

function statsLbTable(games){
  if(!games.length) return '<div class="st-nodata">Nicio partidă în această categorie încă.</div>';
  const rows = statsLeaderboard(games);
  let shown = rows.slice(0,12);
  if(!shown.some(r=>r.isMe)){ const meRow = rows.find(r=>r.isMe); if(meRow) shown.push(meRow); }
  const body = shown.map(r=>{
    const rk = rows.indexOf(r)+1;
    return `<tr class="${r.isMe?'st-me':''}">
      <td class="st-rk">${rk}</td>
      <td class="st-nm">${statsEsc(r.name)}${botTag(r.isBot)}${r.isMe?' <span class="st-you">(tu)</span>':''}</td>
      <td>${r.games}</td><td>${r.wins}</td><td class="st-wr">${pct(r.winRate)}</td>
    </tr>`;
  }).join('');
  return `<table class="st-table"><thead><tr><th>#</th><th>Jucător</th><th>J</th><th>V</th><th>Win</th></tr></thead><tbody>${body}</tbody></table>`;
}

function computeExtras(hist){
  const chrono = [...hist].sort((a,b)=>a.ts-b.ts);
  let longest=0, run=0; chrono.forEach(g=>{ if(g.won){ run++; if(run>longest) longest=run; } else run=0; });
  let current=0; for(let i=chrono.length-1;i>=0;i--){ if(chrono[i].won) current++; else break; }
  // cap la cap (head-to-head) pe toate partidele
  const h2h={};
  hist.forEach(g=>{ const mr=g.rank;
    (g.players||[]).forEach((p,j)=>{ if(j===g.myIndex) return;
      const tr=(g.order||[]).indexOf(j); if(tr<0) return;
      const k=p.name+'|'+(p.isBot?'b':'h');
      h2h[k]=h2h[k]||{name:p.name,isBot:!!p.isBot,me:0,they:0,games:0};
      h2h[k].games++; if(mr<tr) h2h[k].me++; else if(tr<mr) h2h[k].they++;
    });
  });
  const arr=Object.values(h2h).filter(x=>x.games>=2);
  arr.forEach(x=>{ x.theyRate=x.they/x.games; x.meRate=x.me/x.games; });
  const nemesis = arr.length ? [...arr].sort((a,b)=> b.theyRate-a.theyRate || b.they-a.they)[0] : null;
  const victim  = arr.length ? [...arr].sort((a,b)=> b.meRate-a.meRate || b.me-a.me)[0] : null;
  // moduri: scorul meu mediu + de câte ori am ales
  const modes={}; MODE_IDS.forEach(m=>modes[m]={count:0,sum:0,picks:0});
  hist.forEach(g=>{ (g.rounds||[]).forEach(r=>{ const m=r.m; if(!modes[m]) return;
    const sc=(r.sc && r.sc[g.myIndex]!=null)?r.sc[g.myIndex]:null; if(sc==null) return;
    modes[m].count++; modes[m].sum+=sc; if(r.p===g.myIndex) modes[m].picks++;
  }); });
  MODE_IDS.forEach(m=>{ modes[m].avg = modes[m].count?modes[m].sum/modes[m].count:0; });
  const played=MODE_IDS.filter(m=>modes[m].count>0);
  const bestMode  = played.length ? played.reduce((a,b)=> modes[b].avg>modes[a].avg?b:a) : null;
  const favMode   = played.length ? MODE_IDS.reduce((a,b)=> modes[b].picks>modes[a].picks?b:a) : null;
  // loc norocos (după poziția la masă)
  const seat={}; hist.forEach(g=>{ const k=g.myIndex; seat[k]=seat[k]||{g:0,w:0}; seat[k].g++; if(g.won) seat[k].w++; });
  let luckySeat=null; Object.keys(seat).forEach(k=>{ const r=seat[k].w/seat[k].g; if(seat[k].g>=2 && (!luckySeat || r>luckySeat.rate)) luckySeat={seat:+k,rate:r}; });
  // cea mai activă zi a săptămânii
  const wd=[0,0,0,0,0,0,0]; hist.forEach(g=>{ wd[new Date(g.ts).getDay()]++; });
  const wdNames=['Dum','Lun','Mar','Mie','Joi','Vin','Sâm'];
  let busiest=null, mi=0; for(let i=1;i<7;i++) if(wd[i]>wd[mi]) mi=i; if(wd[mi]>0) busiest={day:wdNames[mi],n:wd[mi]};
  return { longest, current, nemesis, victim, modes, bestMode, favMode, luckySeat, busiest };
}

function applyStatsFilters(hist, f){
  let out = hist;
  if(f && f.players && f.players !== 'all') out = out.filter(g => (g.maxPlayers||4) === f.players);
  if(f && f.period && f.period !== 'all'){ const cut = Date.now() - f.period*86400000; out = out.filter(g => g.ts >= cut); }
  return out;
}

      <div class="stats-head"><span>📊 Statisticile lui ${name}</span><button class="stats-close">✕</button></div>
      <div class="stats-body">${filterBar}
        <div class="st-nodata" style="padding:40px 10px;">Nicio partidă pentru filtrul ales.</div>
        ${dataBar}</div></div>`;
  }

  const allSum = catSummary(hist);
  const totalRounds = hist.reduce((a,g)=>a + ((g.rounds||[]).length), 0);
  const ex = computeExtras(hist);
  const byCat = {
    single: hist.filter(g=>g.category==='single'),
    hybrid: hist.filter(g=>g.category==='hybrid'),
    multiplayer: hist.filter(g=>g.category==='multiplayer')
  };
  const catCard = (label, icon, games) => {
    const c = catSummary(games);
    return `<div class="st-cat"><h4>${icon} ${label}</h4>
      <div class="st-cat-main">${c.n ? pct(c.winRate) : '—'}</div>
      <div class="st-cat-sub">${c.n} partide · ${c.wins} victorii</div></div>`;
  };
  const maxPicks = Math.max(1, ...MODE_IDS.map(m=>ex.modes[m].picks));
  const modesHTML = MODE_IDS.map(m=>{
    const d = ex.modes[m];
    const w = d.picks ? Math.max(6, Math.round((d.picks/maxPicks)*100)) : 0;
    const avg = d.count ? (d.avg>0?'+':'') + d.avg.toFixed(1) : '–';
    return `<div class="st-mode-row">
      <span class="st-mode-lbl">${MODE_LABELS_PLAIN[m]||m}</span>
      <span class="st-mode-bar-wrap"><span class="st-mode-bar" style="width:${w}%"></span></span>
      <span class="st-mode-meta">${d.picks}× ales · med ${avg}</span>
    </div>`;
  }).join('');

  // ── Grafic activitate: partide/zi în ultimele 14 zile (victorii evidențiate) ──
  const days=14; const t0=new Date(); t0.setHours(0,0,0,0);
  const buckets=[]; for(let i=days-1;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); buckets.push({d,games:0,wins:0}); }
  const startMs=buckets[0].d.getTime();
  hist.forEach(g=>{ const gd=new Date(g.ts); gd.setHours(0,0,0,0);
    const idx=Math.round((gd.getTime()-startMs)/86400000);
    if(idx>=0 && idx<days){ buckets[idx].games++; if(g.won) buckets[idx].wins++; } });
  const cmax=Math.max(1,...buckets.map(b=>b.games)); const CH=64;
  const chartBars=buckets.map(b=>{ const th=Math.round((b.games/cmax)*CH); const wh=b.games?Math.round((b.wins/b.games)*th):0; const lh=th-wh;
    return `<div class="st-chart-col" title="${b.d.toLocaleDateString('ro-RO')}: ${b.games} partide, ${b.wins} V"><div class="st-chart-bar" style="height:${th}px;"><div class="st-chart-loss" style="height:${lh}px;"></div><div class="st-chart-win" style="height:${wh}px;"></div></div><div class="st-chart-x">${b.d.getDate()}</div></div>`;
  }).join('');
  const chartHTML = `<div class="st-chart">${chartBars}</div>
    <div class="st-chart-legend"><span><i style="background:linear-gradient(180deg,#ffd773,#c9962f)"></i>Victorii</span><span><i style="background:rgba(255,255,255,0.13)"></i>Înfrângeri</span></div>`;

  const nem = ex.nemesis ? `${statsEsc(ex.nemesis.name)}${botTag(ex.nemesis.isBot)} <small>(${ex.nemesis.they}/${ex.nemesis.games})</small>` : '—';
  const vic = ex.victim  ? `${statsEsc(ex.victim.name)}${botTag(ex.victim.isBot)} <small>(${ex.victim.me}/${ex.victim.games})</small>` : '—';
  const favM = ex.favMode ? MODE_LABELS_PLAIN[ex.favMode] : '—';
  const bestM = ex.bestMode ? `${MODE_LABELS_PLAIN[ex.bestMode]} <small>(med ${(ex.modes[ex.bestMode].avg>0?'+':'')+ex.modes[ex.bestMode].avg.toFixed(1)})</small>` : '—';
  const lucky = ex.luckySeat ? `Locul ${ex.luckySeat.seat+1} <small>(${pct(ex.luckySeat.rate)})</small>` : '—';
  const busy = ex.busiest ? `${ex.busiest.day} <small>(${ex.busiest.n})</small>` : '—';
  const cur = ex.current>0 ? `${ex.current} 🔥` : '0';

  return `<div class="stats-modal">
    <div class="stats-head"><span>📊 Statisticile lui ${name}</span><button class="stats-close">✕</button></div>
    <div class="stats-body">
      ${filterBar}
      <div class="st-hero">
        <div class="st-hero-card"><div class="st-hero-num">${allSum.n}</div><div class="st-hero-lbl">Partide</div></div>
        <div class="st-hero-card"><div class="st-hero-num">${allSum.wins}</div><div class="st-hero-lbl">Victorii</div></div>
        <div class="st-hero-card"><div class="st-hero-num">${pct(allSum.winRate)}</div><div class="st-hero-lbl">Win rate</div></div>
      </div>

      <div class="st-section-title">Pe categorii</div>
      <div class="st-cats">
        ${catCard('Multi','🌐',byCat.multiplayer)}
        ${catCard('Hibrid','🤝',byCat.hybrid)}
        ${catCard('Single','🤖',byCat.single)}
      </div>

      <div class="st-section-title">Clasamente</div>
      <div class="st-tabs">
        <button class="st-tab active" data-cat="multiplayer">🌐 Multi</button>
        <button class="st-tab" data-cat="hybrid">🤝 Hibrid</button>
        <button class="st-tab" data-cat="single">🤖 Single</button>
      </div>
      <div class="st-lb" data-cat="multiplayer" style="display:block;">${statsLbTable(byCat.multiplayer)}</div>
      <div class="st-lb" data-cat="hybrid">${statsLbTable(byCat.hybrid)}</div>
      <div class="st-lb" data-cat="single">${statsLbTable(byCat.single)}</div>

      <div class="st-section-title">Activitate · ultimele 14 zile</div>
      ${chartHTML}

      <div class="st-section-title">Pe moduri · de câte ori ai ales / scorul tău mediu</div>
      <div class="st-modes">${modesHTML}</div>

      <div class="st-section-title">Recorduri & surprize</div>
      <div class="st-grid">
        <div class="st-stat"><div class="st-stat-lbl">Serie curentă</div><div class="st-stat-val">${cur}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">Record serie</div><div class="st-stat-val">${ex.longest}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">😈 Nemesis</div><div class="st-stat-val">${nem}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">🎯 Victima preferată</div><div class="st-stat-val">${vic}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">Mod preferat</div><div class="st-stat-val">${favM}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">Cel mai bun mod</div><div class="st-stat-val">${bestM}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">🍀 Loc norocos</div><div class="st-stat-val">${lucky}</div></div>
        <div class="st-stat"><div class="st-stat-lbl">Cea mai activă zi</div><div class="st-stat-val">${busy}</div></div>
      </div>

      <div style="text-align:center; margin-top:16px; font-size:11px; opacity:.45;">
        ${totalRounds} runde jucate în total (cu filtrul curent) · datele se salvează pe acest dispozitiv
      </div>
      ${dataBar}
    </div></div>`;
}

async function openMyStats(){
  let ov = document.getElementById('statsOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id = 'statsOverlay'; ov.className = 'stats-overlay'; document.body.appendChild(ov); }
  window._statsAll = await getGameHistory();
  window._statsFilters = window._statsFilters || { players:'all', period:'all' };
  renderStats(ov);
  ov.style.display = 'flex';
  ov.onclick = e => { if(e.target === ov) closeMyStats(); };
}
function renderStats(ov){
  ov = ov || document.getElementById('statsOverlay'); if(!ov) return;
  ov.innerHTML = buildStatsHTML(window._statsAll||[], window._statsFilters||{players:'all',period:'all'});
  wireStats(ov);
}
function wireStats(ov){
  const cl = ov.querySelector('.stats-close'); if(cl) cl.onclick = closeMyStats;
  const tabs = ov.querySelectorAll('.st-tab');
  tabs.forEach(t=>{ t.onclick = () => {
    tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active');
    ov.querySelectorAll('.st-lb').forEach(p=>p.style.display='none');
    const tgt = ov.querySelector('.st-lb[data-cat="'+t.dataset.cat+'"]'); if(tgt) tgt.style.display='block';
  }; });
  ov.querySelectorAll('.st-filter').forEach(ch=>{ ch.onclick = () => {
    const k = ch.dataset.k, v = ch.dataset.v;
    window._statsFilters[k] = (v === 'all') ? 'all' : parseInt(v);
    renderStats(ov);
  }; });
  const ex = ov.querySelector('#stExport'); if(ex) ex.onclick = exportStats;
  const im = ov.querySelector('#stImport'); if(im) im.onclick = importStats;
  const rs = ov.querySelector('#stReset'); if(rs) rs.onclick = resetStats;
}
function closeMyStats(){ const ov = document.getElementById('statsOverlay'); if(ov){ ov.style.display='none'; ov.innerHTML=''; } }

async function exportStats(){
  try{
    const hist = await getGameHistory();
    const data = { app:'rentz', kind:'stats', version:1, exportedAt:new Date().toISOString(), games:hist };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rentz_statistici_${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('✅ Statistici exportate.');
  }catch(e){ toast('Export eșuat.'); }
}
function importStats(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      const games = Array.isArray(data) ? data : (data && Array.isArray(data.games) ? data.games : null);
      if(!games){ toast('Fișier invalid.'); return; }
      if(!confirm('Import: înlocuiește statisticile curente cu cele din fișier?')) return;
      await idbSet(GAME_HISTORY_KEY, games);
      window._statsAll = games; window._recordedGames = new Set();
      renderStats();
      toast(`✅ ${games.length} partide importate.`);
    }catch(e){ toast('Import eșuat.'); }
  };
  inp.click();
}
function resetStats(){
  if(!confirm('Sigur ștergi TOATE statisticile de pe acest dispozitiv? Nu se poate anula.')) return;
  idbSet(GAME_HISTORY_KEY, []).then(()=>{ window._statsAll = []; window._recordedGames = new Set(); renderStats(); toast('Statistici șterse.'); });
}

// ─── PWA SERVICE WORKER REGISTRATION ─────────────────────────────────────────
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});

    // Reîncarcă pagina automat când SW-ul nou preia controlul
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'SW_UPDATED') {
        window.location.reload();
      }
    });

    // Fallback: dacă SW-ul nou e în waiting, forțează-l să preia imediat
    navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) return;
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    });
  });
}
</script>
