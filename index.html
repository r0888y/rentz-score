// Watermark cu 3 sloturi în side-panel: [anterior] [curent (zoom)] [următor].
// Re-randăm DOAR la schimbarea conținutului (ca pulsul să nu se reseteze). La schimbarea rundei
// (apăsarea „PROGRESEAZĂ") sloturile glisează spre stânga: stânga iese, mijloc→stânga, dreapta→mijloc
// (crescând), iar în dreapta apare un „?" nou. Doar mijlocul face zoom; laturile sunt jumătate, statice.
const WM_MODE_SYMBOL = { jPica:'J', qMinus:'Q', kInima:'K', romb:'♦', totale:'T', rentz:'R' };
function renderWatermarkSlots(s, players) {
  const wmEl = document.getElementById('sidePanelWatermark');
  if(!wmEl) return;
  const gs = s.gameState; if(!gs) return;
  const maxP = s.maxPlayers || 4;
  const totalRounds = maxP * 6;            // meci normal
  const curRound = s.roundNumber || 1;
  const inTb = !!s.tiebreakerSession;

  // ── ANTERIOR (din istoric: ultima rundă încheiată) ──
  let prev = null;
  if(s.roundHistory && s.roundHistory.length) {
    const last = s.roundHistory[s.roundHistory.length - 1];
    if(last) prev = { round: last.roundNumber, sym: WM_MODE_SYMBOL[last.mode] || '?', name: players[last.pickerIndex] || '?' };
  }
  // ── CURENT (picker curent; simbol = jocul ales dacă s-a ales; dacă încă alege DAR are un singur
  //    joc rămas, e determinat → îl arătăm direct, nu „?"; altfel „?") ──
  let curSym = '?';
  if(gs.phase !== 'selecting' && gs.mode) {
    curSym = WM_MODE_SYMBOL[gs.mode] || '?';
  } else if(gs.phase === 'selecting') {
    const myLeft = s.playerChoices && s.playerChoices[s.pickerIndex];
    if(myLeft && myLeft.length === 1) curSym = WM_MODE_SYMBOL[myLeft[0]] || '?';
  }
  const cur = { round: curRound, sym: curSym, name: players[s.pickerIndex] || '?' };
  // ── URMĂTOR (cine alege runda viitoare) — gol la ultima rundă ──
  let next = null;
  if(!inTb && curRound < totalRounds) {
    const nr = curRound + 1;
    const np = (maxP - ((nr - 1) % maxP)) % maxP;
    // Dacă următorul picker mai are UN SINGUR joc de ales, e DETERMINAT → arătăm jocul direct, nu „?".
    let nextSym = '?';
    const npLeft = s.playerChoices && s.playerChoices[np];
    if(npLeft && npLeft.length === 1) nextSym = WM_MODE_SYMBOL[npLeft[0]] || '?';
    next = { round: nr, sym: nextSym, name: players[np] || '?' };
  } else if(inTb && s.tiebreakerSession) {
    // Departajarea folosește EXACT aceeași ordine (invers acelor de ceasornic) ca jocul normal,
    // doar că se joacă numai Rentz. Pickerul rundei cu roundsDone=d este (maxP-(d%maxP))%maxP,
    // deci următorul (roundsDone+1) e formula de mai jos. La ultima rundă a sesiunii (roundsDone
    // = maxP-1) rezultă rd=maxP → condiția pică → next=null → slotul drept rămâne gol.
    const rd = (s.tiebreakerSession.roundsDone || 0) + 1;
    // La departajare se joacă DOAR Rentz → următorul e mereu cunoscut (R), nu „?".
    if(rd < maxP) { const np = (maxP - (rd % maxP)) % maxP; next = { round: curRound + 1, sym: WM_MODE_SYMBOL['rentz'], name: players[np] || '?' }; }
  }

  // Re-randăm doar dacă s-a schimbat ceva (altfel lăsăm pulsul în pace).
  const sig = `${prev ? prev.round + ':' + prev.sym + ':' + prev.name : '-'}|${cur.round}:${cur.sym}:${cur.name}|${next ? next.round + ':' + next.name : '-'}`;
  if(wmEl.dataset.wmSig === sig) return;
  const prevCurRound = wmEl.dataset.wmCurRound;
  const roundChanged = (prevCurRound !== undefined && prevCurRound !== '' && prevCurRound !== String(cur.round));
  wmEl.dataset.wmSig = sig;
  wmEl.dataset.wmCurRound = String(cur.round);

  // FLIP: pozițiile vechi (după rundă) ÎNAINTE de rebuild.
  const oldRects = {};
  wmEl.querySelectorAll('.wm-slot[data-round]').forEach(el => { oldRects[el.dataset.round] = el.getBoundingClientRect(); });
  const newRounds = new Set([prev, cur, next].filter(Boolean).map(x => String(x.round)));

  // Sloturi care ies (rundă veche dispărută) → clonă animată spre stânga.
  const wmBox = wmEl.getBoundingClientRect();
  const exitClones = [];
  if(roundChanged) {
    wmEl.querySelectorAll('.wm-slot[data-round]').forEach(el => {
      if(!newRounds.has(el.dataset.round)) {
        const r = el.getBoundingClientRect();
        const c = el.cloneNode(true);
        c.classList.add('wm-exit');
        c.style.position = 'absolute';
        c.style.left = (r.left - wmBox.left) + 'px';
        c.style.top  = (r.top - wmBox.top) + 'px';
        c.style.width = r.width + 'px'; c.style.height = r.height + 'px'; c.style.margin = '0';
        exitClones.push(c);
      }
    });
  }

  // Rebuild track.
  const slotHtml = (slot, pos) => {
    if(!slot) return `<div class="wm-slot ${pos} wm-empty"></div>`;
    const zoom = (pos === 'mid') ? ' wm-zoom' : '';
    return `<div class="wm-slot ${pos}" data-round="${slot.round}"><span class="wm-sym${zoom}">${slot.sym}</span><span class="wm-name">${slot.name}</span></div>`;
  };
  wmEl.innerHTML = `<div class="wm-track">${slotHtml(prev, 'left')}${slotHtml(cur, 'mid')}${slotHtml(next, 'right')}</div>`;
  exitClones.forEach(c => wmEl.appendChild(c));

  // Dimensionare dinamică a simbolurilor după lățimea slotului (mijloc 2× laturile).
  // Doar dacă panoul e vizibil (lățime > 0) — la rentz panoul e ascuns și am păstra ultimele mărimi bune.
  wmEl.querySelectorAll('.wm-slot').forEach(el => {
    const w = el.getBoundingClientRect().width;
    if(w <= 4) return;
    const sym = el.querySelector('.wm-sym'); const nm = el.querySelector('.wm-name');
    if(sym) { const f = el.classList.contains('mid') ? 0.68 : 0.6; sym.style.fontSize = Math.max(16, Math.round(w * f)) + 'px'; }
    if(nm)  nm.style.fontSize  = Math.max(8, Math.min(16, Math.round(w * 0.16))) + 'px';
  });

  // FLIP pe sloturile care s-au mutat (după rundă); cele noi apar lin.
  wmEl.querySelectorAll('.wm-slot[data-round]').forEach(el => {
    const oldR = oldRects[el.dataset.round];
    if(!oldR) {
      if(!roundChanged) return; // nu animăm apariții decât la glisarea de rundă
      el.style.transition = 'none'; el.style.opacity = '0'; el.style.transform = 'scale(0.6)';
      el.getBoundingClientRect();
      requestAnimationFrame(() => {
        el.style.transition = 'opacity 0.45s ease-out, transform 0.45s cubic-bezier(.2,.7,.3,1)';
        el.style.opacity = '1'; el.style.transform = '';
      });
      return;
    }
    const nr = el.getBoundingClientRect();
    const dx = (oldR.left + oldR.width / 2) - (nr.left + nr.width / 2);
    const dy = (oldR.top + oldR.height / 2) - (nr.top + nr.height / 2);
    const sc = nr.width > 0 ? (oldR.width / nr.width) : 1;
    if(Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sc - 1) < 0.02) return; // nu s-a mutat
    el.style.transformOrigin = 'center center';
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(${sc})`;
    el.getBoundingClientRect();
    requestAnimationFrame(() => {
      el.style.transition = 'transform 0.5s cubic-bezier(.2,.7,.3,1)';
      el.style.transform = '';
    });
  });

  // Animă clonele care ies (glisare spre stânga) și le scoate.
  exitClones.forEach(c => {
    requestAnimationFrame(() => {
      c.style.transition = 'transform 0.5s ease-in, opacity 0.5s ease-in';
      c.style.transform = 'translateX(-120%) scale(0.4)'; c.style.opacity = '0';
    });
    setTimeout(() => { if(c.parentNode) c.parentNode.removeChild(c); }, 560);
  });

  // Dacă doar simbolul din mijloc s-a schimbat (aceeași rundă, „?" → joc ales), un fade scurt
  // (fără transform, ca să nu se bată cu pulsul wm-zoom care rulează pe simbol).
  if(!roundChanged) {
    const midSym = wmEl.querySelector('.wm-slot.mid .wm-sym');
    if(midSym) {
      midSym.style.opacity = '0';
      requestAnimationFrame(() => { midSym.style.transition = 'opacity 0.4s ease-out'; midSym.style.opacity = '1'; });
    }
  }
}

function renderGame() {
  const s = roomData; const gs = s.gameState; if(!gs) return;
  const maxP = s.maxPlayers || 4;
  const players = s.players.map(p => p ? p.name : '?');

  // ── Req 2: cartea e „considerată jucată" abia DUPĂ ce aterizează pe masă ──────
  // Cât timp ULTIMA carte jucată zboară spre slot/celulă, NU avansăm indicatorii de
  // rând (chenar/săgeată/nume verde) și NU sunăm „e rândul tău". Punem un „hold" pe
  // jucătorul curent (dispCur = -1); la aterizare, callback-ul zborului stinge hold-ul
  // și re-randează ⇒ atunci apar indicatorii + sunetul. Plasă de siguranță dacă zborul
  // nu mai trimite aterizare (degradare grațioasă): stingem hold-ul după FLIGHT_MS+450.
  (function(){
    if(gs.finished || gs.phase === 'selecting') return;
    let flightKey = null;
    if(gs.mode === 'rentz'){
      const lrc = gs.lastRentzCard;
      if(lrc && lrc.rank && lrc.suit && lrc.event !== 'pass'){
        const fk = 'rentz:' + (lrc.seq != null ? lrc.seq : (lrc.rank + lrc.suit));
        if(window._rentzFlightKey !== fk) flightKey = fk; // urmează să zboare (încă neînregistrat)
      } else if(lrc && lrc.event === 'pass'){
        // Și PASUL ține indicatorii pe loc cât zboară cartea „Pas" (eliberare deterministă
        // la „aterizare" — vezi blocul de pass din randarea tablei).
        const pfk = 'pass:' + (lrc.seq != null ? lrc.seq : (lrc.player + '|' + s.roundNumber));
        if(window._rentzPassFlightKey !== pfk) flightKey = 'hold-' + pfk;
      }
    } else if(!gs.spTrickDisplay && !gs.pendingTrick && gs.currentTrick && gs.currentTrick.length > 0){
      const last = gs.currentTrick[gs.currentTrick.length - 1];
      const k = last.card.rank + last.card.suit + last.player;
      if(window._trickFlightKey !== k) flightKey = k; // carte nou jucată, încă neînregistrată
    }
    if(flightKey){
      window._turnHold = true;
      window._turnHoldKey = flightKey;
      if(window._turnHoldSafety){ clearTimeout(window._turnHoldSafety); }
      window._turnHoldSafety = setTimeout(() => {
        window._turnHold = false; window._turnHoldSafety = null;
        try { renderGame(); } catch(e){}
      }, FLIGHT_MS + 450);
    }
  })();
  // BONUS: cât timp levata e în confirmare + zoom + SPARGERE, „următoarea mutare"
  // (chenar/nume verde/beep) NU se arată — abia după ce cioburile s-au împrăștiat.
  const fxHold = !!(gs.spTrickDisplay || gs.pendingTrick) || !!(window._fxBusyUntil && Date.now() < window._fxBusyUntil);
  const dispCur = (window._turnHold || fxHold) ? -1 : gs.currentPlayer;

  // Pe mobil: ascunde side panel la rentz (mai mult spațiu pentru masă) — și ÎN TIMPUL spargerii
  // cărților de la finalul rundei (până se termină cioburile), ca panoul să nu reapară peste efect.
  toggleSidePanelForRentz(gs.mode === 'rentz' && (!gs.finished || window._rentzShatterDone !== s.roundNumber));

  document.getElementById('hostCancelBtnGame').style.display = ((window._humanIndex ?? myIndex) === s.host) ? 'block' : 'none';

  // Cronometru — pornit o singură dată, actualizat la fiecare secundă
  if(s.gameStartedAt) {
    const gt = document.getElementById('gameTimer');
    const gtm = document.getElementById('gameTimerMobile');
    if(gt) gt.style.display = '';
    if(gtm) gtm.style.display = '';
    updateGameTimer();
    if(!window._gameTimerInterval) {
      window._gameTimerInterval = setInterval(updateGameTimer, 1000);
    }
  }

  // Icoana „👁 arată cărțile oponenților": vizibilă DOAR în single-player și DOAR dacă
  // jucătorul UMAN (slotul care NU e bot) se numește „Robi" (indiferent de majuscule).
  // Orice alt jucător uman NU o vede. Un BOT numit „Robi" nu contează (verificăm omul).
  (function(){
    const wrap = document.getElementById('peekToggleWrap');
    if(wrap){
      const humanSlot = (s.players || []).find(p => p && !p.isBot);
      const humanName = (humanSlot && humanSlot.name ? humanSlot.name : '').trim().toLowerCase();
      const allowed = window.isSinglePlayer && humanName === 'robi';
      wrap.style.display = allowed ? 'inline-flex' : 'none';
    }
  })();
  syncHdrToggles(); // icoanele sens/ochi/sunet reflectă starea curentă (fără checkbox-uri)
  // Cât zboară o carte / rulează reveal-ul / spargerea / animațiile altui comutator,
  // comutatoarele (fără sunet) se estompează — nu pot fi acționate.
  const _hts = document.getElementById('hdrToggleStack');
  if(_hts) _hts.classList.toggle('tgl-locked', _togglesBusy());
  const _pkl = document.getElementById('peekToggleWrap');
  if(_pkl) _pkl.classList.toggle('tgl-locked', _togglesBusy());
  // Suntem în joc → resetăm garda sunetului de final (ca să sune la următorul ecran final).
  window._finalSoundPlayed = false;
  // Sunet „e rândul tău" DOAR la tranziție (nu la fiecare re-randare). Prin dispCur ⇒
  // sună abia după ce cartea precedentă aterizează (nu în timpul zborului). IMPORTANT:
  // când EU iau mâna, currentPlayer devine EU imediat ce ultimul jucător pune cartea —
  // dar suntem încă în faza de confirmare („Confirm mâna"), NU e efectiv rândul meu de
  // joc. De aceea beep-ul e blocat cât există spTrickDisplay/pendingTrick; sună abia
  // DUPĂ confirmare, când chiar pot pune prima carte a mâinii următoare.
  const _myTurnNow = gs.phase === 'playing' && !gs.finished && !gs.spTrickDisplay && !gs.pendingTrick && dispCur === (window._humanIndex ?? myIndex);
  if(_myTurnNow && !window._wasMyTurn) SFX.play('turn');
  window._wasMyTurn = _myTurnNow;

  if(gs.phase === 'selecting') {
    document.getElementById('modeBadge').textContent = `🤔 JOC NOU`;
    setTableWatermark(null);
  } else {
    const mInfo = ALL_CHOICES.find(x => x.id === gs.mode);
    document.getElementById('modeBadge').innerHTML = `${mInfo.icon} ${mInfo.label}`;
    setTableWatermark(gs.mode); // filigranul mesei = simbolul jocului ales
  }
  const inTiebreaker = !!s.tiebreakerSession;
  if(inTiebreaker) {
    const tb = s.tiebreakerSession;
    const tbRound = (tb.roundsDone || 0) + 1;
    document.getElementById('roundBadge').textContent = `⚔️ Departajare ${tbRound}/${maxP}`;
  } else {
    document.getElementById('roundBadge').textContent = `Runda ${s.roundNumber}/${maxP * 6}`;
  }

  // Live scoreboard — useri + scoruri, SORTATE descrescător (scor), iar la egalitate alfabetic
  const liveScoresDiv = document.getElementById('liveScores');
  if (liveScoresDiv) {

    const pendingConfirm = !!(gs.pendingTrick || gs.spTrickDisplay);
    const isTrickMode = gs.mode && gs.mode !== 'rentz' && gs.phase !== 'selecting';

    let tickScores = null;

    if (isTrickMode) {
      const confirmedTricks = pendingConfirm ? (gs.tricks || []).slice(0, -1) : (gs.tricks || []);
      try {
        tickScores = calculateTricksScoring(gs.mode, confirmedTricks, maxP);
      } catch (e) {
        tickScores = null;
      }
    }

    // RENTZ (etalate): scor live provizoriu — pe măsură ce un jucător termină (rămâne fără cărți
    // și intră în finishOrder), îi adăugăm recompensa locului ocupat, exact ca la celelalte jocuri.
    // Cât timp nu a terminat, nu primește nimic provizoriu. Recompensele = aceleași din verifyRentzEndState.
    const isRentzPlay = gs.mode === 'rentz' && gs.phase !== 'selecting' && !gs.finished;
    let rentzProvisional = null;
    if (isRentzPlay) {
      const rentzRewards = maxP === 3 ? [10, 5, 0] : [15, 10, 5, 0];
      rentzProvisional = Array(maxP).fill(0);
      (gs.finishOrder || []).forEach((pIdx, rk) => { rentzProvisional[pIdx] = rentzRewards[rk] || 0; });
    }

    const ranked = s.players.map((p, i) => {
      let score = s.totalScores[i] || 0;

      if (isTrickMode && tickScores) {
        if (gs.finished) {
          if (pendingConfirm) {
            score =
              (s.totalScores[i] || 0) -
              (gs.roundScores ? (gs.roundScores[i] || 0) : 0) +
              (tickScores[i] || 0);
          }
        } else {
          score = (s.totalScores[i] || 0) + (tickScores[i] || 0);
        }
      } else if (isRentzPlay && rentzProvisional) {
        score = (s.totalScores[i] || 0) + (rentzProvisional[i] || 0);
      }

      return {
        name: p ? p.name : '?',
        score,
        idx: i
      };
    });

    // SORT: scor desc, apoi nume A-Z
    ranked.sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return a.name.localeCompare(b.name, 'ro');
    });

    // FLIP: memorăm pozițiile vechi
    const oldRects = {};
    liveScoresDiv.querySelectorAll('.live-score-row').forEach(el => {
      if (el.dataset.idx != null) {
        oldRects[el.dataset.idx] = el.getBoundingClientRect();
      }
    });

    // reconstruim UI
    liveScoresDiv.innerHTML = ranked.map(r => {
      const isMe = r.idx === myIndex;
      const isPicker = r.idx === s.pickerIndex;   // cine a ales jocul rundei → glow + bold

      return `
        <div class="live-score-row${isMe ? ' me' : ''}${isPicker ? ' picker' : ''}" data-idx="${r.idx}" title="${isMe ? 'Eu sunt!' : ''}">
          <span class="live-score-name">${r.name}</span>
          <span class="live-score-pts">${r.score}</span>
        </div>
      `;
    }).join('');

    // animăm mutările (FLIP)
    liveScoresDiv.querySelectorAll('.live-score-row').forEach(el => {
      const oldR = oldRects[el.dataset.idx];
      if (!oldR) return;

      const newR = el.getBoundingClientRect();
      const dx = oldR.left - newR.left;
      const dy = oldR.top - newR.top;

      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;

      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      el.getBoundingClientRect();

      requestAnimationFrame(() => {
        el.style.transition = 'transform 0.42s cubic-bezier(.2,.7,.3,1), background 0.2s';
        el.style.transform = '';
      });
    });
  }
  // Dimensionare dinamică pe înălțimea clasamentului: comutatoarele + Runda/joc din centru.
  try { sizeHdrDynamic(); } catch(e) {}

  // Side panel watermark — 3 sloturi: anterior / curent (zoom) / următor (vezi renderWatermarkSlots)
  renderWatermarkSlots(s, players);

  // ETALATE: dacă EU am terminat (sunt în finishOrder), panoul meu de jos devine alb-negru estompat.
  // Panoul .my-hand-wrap e static (nu se reconstruiește la fiecare randare), deci doar comutăm clasa.
  (() => {
    const wrap = document.querySelector('.my-hand-wrap');
    if(!wrap) return;
    const meIdx = (window._humanIndex ?? myIndex);
    const meFinished = (gs.mode === 'rentz' && !gs.finished && (gs.finishOrder || []).includes(meIdx));
    wrap.classList.toggle('my-hand-finished', meFinished);
  })();

  // Render Opponents dynamically
  const oppDiv = document.getElementById('opponentsRow'); oppDiv.innerHTML = '';

  // Spate-fantomă oponenți: ținem nr. de fantome afișate pe rundă, per oponent, ca să animăm
  // „ștergerea" DOAR pentru cele nou apărute (NU intră în starea sincronizată).
  const _oppRoundKey = `${roomId}|${s.roundNumber}|${gs.mode}`;
  const _oppJustReset = (!window._oppGhostCnt || window._oppGhostCnt.key !== _oppRoundKey);
  if(_oppJustReset) window._oppGhostCnt = { key: _oppRoundKey };

  // Build set of ALL choices per player (original full list) — needed to show done ones
  const ALL_CHOICE_IDS = ALL_CHOICES.map(c => c.id);

  // Construim lista oponenților în ordinea de dare cu cartea (humanIndex+1, +2, ... mod maxP)
  const oppOrder = [];
  const renderIdx = window._humanIndex ?? myIndex;
  for(let k=1; k<maxP; k++) oppOrder.push((renderIdx + k) % maxP);
  // Comutator sens de joc: oglindește adversarii (stânga↔dreapta; la 4 jucători mijlocul rămâne).
  // Asta face ca direcția vizuală de joc/alegere să apară în sensul acelor de ceasornic.
  // Sens FIX: orar (acele de ceasornic). Bifa de schimbare a fost scoasă din UI și
  // ținută permanent „bifată". Dacă pe viitor revine bifa, se reactivează comutatorul.
  //window._swapSeats = true;
  if(window._swapSeats) oppOrder.reverse();

  for(const i of oppOrder){
    const isCurrent = (dispCur === i && !gs.finished && gs.phase !== 'selecting');
    const isPicking = (gs.phase === 'selecting' && s.pickerIndex === i);
    // ETALATE: adversar care a TERMINAT (e în finishOrder) → panou alb-negru estompat, persistent.
    const isFinishedRentz = (gs.mode === 'rentz' && !gs.finished && (gs.finishOrder || []).includes(i));
    const handCards = gs.hands[i] || [];
    const handSize = handCards.length;
    const div = document.createElement('div');
    div.className = 'opponent' + (isCurrent ? ' active' : '') + (isPicking ? ' picking' : '') + (isFinishedRentz ? ' opp-finished' : '');
    div.dataset.player = i;   // sursa zborului „carte care vine de la adversar"

    let backs = '';
    const isBotPlayer = s.players[i] && s.players[i].isBot;

    // ─────────────────────────────────────────────────────────────────────────
    // COMUTATOR cărți boți în single-player.
    //   false (implicit) → cărțile boților ASCUNSE, cu spate cu model carouri (joc corect).
    //   true             → cărțile boților VIZIBILE (rank + simbol colorat), pt. antrenament/debug.
    // Controlat de bifa „👁" din header (window._peekBotCards), nebifată implicit.
    const SHOW_BOT_CARDS = !!window._peekBotCards;

    // Mâna are mereu 8 cărți: randăm 8 sloturi = (handSize spate solide) + (restul fantome estompate),
    // ca rândul adversarului să nu se redimensioneze când dă o carte. Fantomele NOI (peste câte erau
    // la randarea anterioară) primesc fade-ul scurt de „ștergere".
    const nGhost = Math.max(0, 8 - handSize);
    const prevGhost = _oppJustReset ? nGhost : (window._oppGhostCnt[i] || 0);
    window._oppGhostCnt[i] = nGhost;
    const ghostBack = (idx) => `<div class="card-back card-back-ghost${idx >= prevGhost ? ' card-back-erase' : ''}"></div>`;

    if(window.isSinglePlayer && isBotPlayer && SHOW_BOT_CARDS) {
      // ── VARIANTA VIZIBILĂ (păstrată pentru modificări ulterioare) ──
      // Cărțile boților afișate pe față, sortate ca ale mele.
      const sortedBotHand = sortHand(handCards);
      const suitColorsBack = {'♠':'#1a1a1a','♥':'#e74c3c','♦':'#e74c3c','♣':'#1a1a1a'};
      backs = sortedBotHand.map(c =>
        `<div class="card-back card-back-visible" style="color:${suitColorsBack[c.suit]};"><span class="cb-rank">${c.rank}</span><span class="cb-suit">${c.suit}</span></div>`
      ).join('');
      for(let g=0; g<nGhost; g++) backs += ghostBack(g);
    } else {
      // ── VARIANTA ASCUNSĂ (implicit) — spate cu model carouri, ca la multiplayer ──
      for(let j=0; j<handSize; j++) backs += '<div class="card-back"></div>';
      for(let g=0; g<nGhost; g++) backs += ghostBack(g);
    }

    // Games for this player — show all 6, done ones with X style. JOCUL ÎN CURS (la cel
    // care l-a ales) NU e tăiat cât se joacă: pulsează auriu; devine tăiat abia la final.
    const remainingIds = s.playerChoices[i] || [];
    const gameTags = ALL_CHOICE_IDS.map(cid => {
      const ch = ALL_CHOICES.find(x => x.id === cid);
      const isLive = gs.phase !== 'selecting' && !gs.finished && gs.mode === cid && s.pickerIndex === i;
      const isDone = !isLive && !remainingIds.includes(cid);
      return `<span class="opp-game-tag${isDone ? ' done' : ''}${isLive ? ' live' : ''}">${ch.label}</span>`;
    }).join('');

    div.innerHTML = `
      <div class="opp-header-row">
        <div class="opp-name-score ${(isCurrent || isPicking) ? 'active-name activ-pulse' : ''}">${(isCurrent || isPicking) ? (window._swapSeats ? ARROW_RIGHT_SVG : ARROW_LEFT_SVG) : ''}${(isBotPlayer && !window.isSinglePlayer) ? '<span class="ai-badge">AI</span>' : ''}${players[i]}</div>
      </div>
      <div class="opp-cards ${s.maxPlayers === 4 ? 'opp-cards-4p' : 'opp-cards-3p'}">${backs}</div>
      <div class="opp-games-row">${gameTags}</div>
    `;
    oppDiv.appendChild(div);
  }

  const tricksPanel = document.getElementById('myTricksPanel');
  const sideTitleEl = document.querySelector('.side-section-title');
  tricksPanel.innerHTML = '';
  tricksPanel.style.justifyContent = 'flex-start';

  if(gs.mode === 'rentz') {
    if(sideTitleEl) sideTitleEl.textContent = 'Etalate:';
    const suitColors = {'♠':'#e8e8f0','♥':'#e74c3c','♦':'#f39c12','♣':'#27ae60'};
    const players = s.players.map(p => p ? p.name : '?');

    const lrc = gs.lastRentzCard;
    if(!lrc) {
      tricksPanel.innerHTML = '<div style="color:rgba(240,230,208,0.2);font-size:12px;">—</div>';
      const mobileMsgElEmpty = document.getElementById('rentzMobileMsg');
      if(mobileMsgElEmpty && !window._rentzMsgShowing) mobileMsgElEmpty.innerHTML = '';
    } else {
      // Nu mai afișăm log-ul „cine ce carte a dat" (nici desktop, nici mobil). Cărțile jucate se
      // văd pe tablă (+ zborul lor). Un PAS îl arătăm ca o CARTE care zboară cu „Pas" scris pe ea,
      // de la jucătorul care a pasat — așa se vede de la cine vine. Restul mesajelor dispar.
      if(lrc.event === 'pass'){
        const pfk = 'pass:' + (lrc.seq != null ? lrc.seq : (lrc.player + '|' + s.roundNumber));
        if(window._rentzPassFlightKey !== pfk && !gs.finished){
          window._rentzPassFlightKey = pfk;
          const _pp = Number(lrc.player);
          requestAnimationFrame(() => requestAnimationFrame(() => { try { flyPassCard(_pp); } catch(e){} }));
          // Ținem „hold"-ul pe indicatorii de rând cât zboară „Pas"-ul și îl stingem
          // DETERMINIST când cartea Pas „aterizează" în centru (~80% din zbor) — nu
          // așteptăm plasa de siguranță. Abia atunci trece chenarul la următorul.
          const _hk = window._turnHoldKey;
          setTimeout(() => {
            if(window._turnHold && window._turnHoldKey === _hk){
              window._turnHold = false;
              if(window._turnHoldSafety){ clearTimeout(window._turnHoldSafety); window._turnHoldSafety = null; }
              try { renderGame(); } catch(e){}
            }
          }, Math.round(FLIGHT_MS * 0.8) + 60);
        }
        // Curățăm lrc DOAR dacă e tot ACEASTĂ mișcare (gardă pe seq + obiectul LIVE).
        // Înainte, timer-ul curăța necondiționat obiectul capturat ⇒ în hibrid, timer-ul
        // mișcării PRECEDENTE ștergea lrc-ul mișcării NOI înainte de prima ei randare
        // (prima randare vine abia după ack-ul scrierii) ⇒ cartea apărea „brusc", fără
        // zbor, iar „Pas"-ul nu se mai afișa deloc. La SP randarea e sincronă ⇒ imun.
        const _clrSeqP = lrc.seq;
        setTimeout(() => { const g = roomData && roomData.gameState; if(g && g.lastRentzCard && g.lastRentzCard.seq === _clrSeqP) g.lastRentzCard = null; }, 1700);
      }
      // ETALATE: dacă tocmai s-a jucat un CAPĂT (7 la 4j / 9 la 3j) care SARE un jucător → fulger
      // „X roșu" peste panoul celui care STĂ. Îl AMÂNĂM cu un setTimeout fix (≈ durata zborului),
      // ca să apară când capătul aterizează — INDEPENDENT de callback-ul de zbor (care, la joc rapid,
      // putea fi „furat" de zborul următor ⇒ X-ul nu mai apărea). Garda _rentzSkipFlashKey ⇒ o
      // singură programare per mișcare. Funcționează și pt. cărțile altor jucători (online), fiindcă
      // se bazează pe lrc din randare, nu pe execuția locală a mutării.
      if(lrc.event === 'end' && lrc.skipped != null && !gs.finished){
        const skKey = 'skip:' + (lrc.seq != null ? lrc.seq : (lrc.player + '|' + s.roundNumber));
        if(window._rentzSkipFlashKey !== skKey){
          window._rentzSkipFlashKey = skKey;
          const _sk = Number(lrc.skipped);
          setTimeout(() => { try { flashRentzSkip(_sk); } catch(e){} }, Math.round(FLIGHT_MS * FLIGHT_REVEAL_AT) + 80);
        }
      }
    }

    // "X a terminat" — primii N-1 jucători din finishOrder (ultimul nu contează)
    const finishOrder = gs.finishOrder || [];
    const maxP = s.maxPlayers || 4;
    // La 4j: primii 3, la 3j: primii 2
    const showCount = maxP - 1;
    const showFinished = finishOrder.slice(0, showCount);
    showFinished.forEach((pIdx, posInOrder) => {
      const pName = players[pIdx] || '?';
      const msg = document.createElement('div');
      msg.className = 'finished-player-msg';
      msg.textContent = `🏁 ${pName} a terminat`;
      tricksPanel.appendChild(msg);

      // Overlay central peste masă (panoul lateral e ascuns pe ambele platforme) — la fel
      // ca pe mobil, prin coadă: „🏁 X a terminat" apare acum și pe DESKTOP.
      const cssH2 = getComputedStyle(document.documentElement).getPropertyValue('--card-h').trim();
      const cardH2 = parseInt(cssH2) || 110;
      const fs2 = Math.round(cardH2 / 4);
      const finKey = `finished|${s.roundNumber}|${pIdx}`;
      const finHtml = `<span style="color:#60d8ff;font-weight:800;">🏁 ${pName} a terminat</span>`;
      queueRentzMobileMsg(finKey, finHtml, fs2);
    });
  } else {
    if(sideTitleEl) sideTitleEl.textContent = 'CĂRȚI LUATE';
    const mobileMsgElNonRentz = document.getElementById('rentzMobileMsg');
    if(mobileMsgElNonRentz && !window._rentzMsgShowing) mobileMsgElNonRentz.innerHTML = '';
    let personalCardsWon = [];
    if(gs.mode) {
      gs.tricks.forEach(t => {
        if(t.winner === myIndex) {
          t.cards.forEach(c => personalCardsWon.push(c));
        }
      });
    }
    if(personalCardsWon.length === 0) {
      tricksPanel.innerHTML = '<div style="color:rgba(240,230,208,0.25);padding-bottom:2px;">Nicio carte.</div>';
    } else {
      personalCardsWon.sort((a,b) => {
        const si = SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit);
        if(si !== 0) return si;
        return RV[b.rank] - RV[a.rank];
      });
      const suitColors = {'♠':'#e8e8f0','♥':'#e74c3c','♦':'#f39c12','♣':'#27ae60'};
      const symbols = personalCardsWon.map(c => {
        const color = suitColors[c.suit] || '#e8e8f0';
        return `<span style="color:${color};font-size:inherit;font-weight:900;line-height:1;display:inline-block;">${c.rank}${c.suit}</span>`;
      }).join('<span style="color:rgba(255,255,255,0.25);font-size:inherit;line-height:1;"> • </span>');

      const container = document.createElement('div');
      container.style.cssText = 'flex:1;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;align-content:flex-start;gap:2px 0;line-height:1;width:100%;';
      container.innerHTML = symbols;
      tricksPanel.appendChild(container);

      const panelH = tricksPanel.clientHeight || 100;
      let fs = 28;
      container.style.fontSize = fs + 'px';
      while (fs > 10 && container.scrollHeight > panelH) {
        fs -= 1;
        container.style.fontSize = fs + 'px';
      }
    }
  }

  const tableContent = document.getElementById('tableContent');
  const overlay = document.getElementById('selectOverlay');

  if(gs.phase === 'selecting') {
    tableContent.innerHTML = `<div style="text-align:center; color:rgba(240,230,208,0.4);">Așteptăm ca <strong>${players[s.pickerIndex]}</strong> să aleagă jocul...</div>`;
    if(s.pickerIndex === myIndex) {
      overlay.style.display = 'flex';
      { const _st = document.getElementById('selectTitle'); if(_st) _st.style.display = 'none'; }
      const grid = document.getElementById('selectGrid'); grid.innerHTML = '';

      ALL_CHOICES.forEach(choice => {
        const available = s.playerChoices[myIndex].includes(choice.id);
        const btn = document.createElement('button'); btn.className = 'select-btn';
        btn.disabled = !available;
        btn.innerHTML = `<div class="select-btn-title">${choice.icon} ${choice.label}</div><div class="select-btn-desc">${choice.desc}</div>`;
        if(available) btn.onclick = () => selectGameMode(choice.id);
        grid.appendChild(btn);
      });
    } else {
      overlay.style.display = 'none';
    }
  } else {
    overlay.style.display = 'none';
    if(gs.mode === 'rentz') {
      document.getElementById('tableLabel').style.display = 'none';
      // Cât timp tabla se SPARGE în cioburi (la finalul rundei), NU o reconstruim — altfel am
      // șterge cioburile din mijlocul animației la un re-render (ex. ecou realtime duplicat).
      const _rzShatterActive = (gs.finished && window._rentzShatterRound === s.roundNumber && window._rentzShatterDone !== s.roundNumber);
      if(_rzShatterActive && document.getElementById('rentzBoard')) {
        /* lăsăm cioburile să-și termine animația */
      } else {
      tableContent.innerHTML = '<div class="rentz-board" id="rentzBoard"></div>';
      const rb = document.getElementById('rentzBoard');

      const SUIT_ORDER = ['♠','♥','♦','♣'];
      const suitColors = {'♠':'#e8e8f0','♥':'#e74c3c','♦':'#f39c12','♣':'#27ae60'};
      const maxRanks = RANKS.length;
      const isDesktop = _effViewW() >= 900;

      // Ordinea suiturilor: primul J pus = primul afișat
      const playOrder = (gs.suitPlayOrder && gs.suitPlayOrder.length > 0)
        ? gs.suitPlayOrder
        : SUIT_ORDER;
      const activeSuits = playOrder.filter(s => gs.columns[s] && gs.columns[s].length > 0);

      if(activeSuits.length === 0) {
        rb.innerHTML = '<div style="color:rgba(255,255,255,0.4);text-align:center;padding:16px;font-size:13px;">Nicio carte etalată.</div>';
      } else {
        // Rânduri orizontale — aceeași structură pe mobil și desktop
        const lrc = gs.lastRentzCard;
        // Intervalul de ranguri JUCAT efectiv (uniunea pe toate culorile). Afișăm DOAR coloanele
        // din acest interval (tăiem capetele nefolosite → cărți mai mari), dar PĂSTRÂND alinierea:
        // același set de coloane pe FIECARE rând ⇒ J sub J, Q sub Q etc.
        let gMin = RANKS.length, gMax = -1;
        playOrder.forEach(suit => {
          (gs.columns[suit] || []).forEach(c => {
            const i = RANKS.indexOf(c.rank);
            if(i < gMin) gMin = i; if(i > gMax) gMax = i;
          });
        });
        const colRanks = (gMax >= gMin) ? RANKS.slice(gMin, gMax + 1) : [];
        const colOrder = sortDesc ? [...colRanks].reverse() : colRanks;
        playOrder.forEach(suit => {
          const col = gs.columns[suit];
          if(!col || col.length === 0) return;
          const row = document.createElement('div');
          row.className = 'rentz-row';
          row.dataset.suit = suit;
          colOrder.forEach(rank => {
            const card = col.find(c => c.rank === rank);
            const el = document.createElement('div');
            el.className = 'rentz-row-card';
            if(card) {
              const key = card.rank + card.suit;
              el.dataset.card = key;                       // pt. regăsirea destinației „în zbor"
              const imgSrc = CARD_IMG[key];
              if(lrc && card.rank === lrc.rank && card.suit === lrc.suit) {
                const fk = 'rentz:' + (lrc.seq != null ? lrc.seq : key);
                const regK = _flightRegKey('etalate', key, lrc.player);
                if(window._rentzFlightKey !== fk && !gs.finished){
                  // Carte nou-etalată → o aducem în zbor (spate) spre celulă; glow la aterizare.
                  window._rentzFlightKey = fk;
                  window._cardFlights[regK] = { mode:'etalate', cardKey: key, player: lrc.player };
                  el.style.visibility = 'hidden';
                  window._rentzFlyPending = { key, player: lrc.player };  // declanșăm după dimensionare
                } else if(window._cardFlights[regK]){
                  el.style.visibility = 'hidden';          // încă în zbor (re-randare) → ținem ascuns
                } else {
                  el.classList.add('rentz-card-glow');     // zbor încheiat → glow persistă pe re-randări
                }
                // Curățăm lrc DOAR dacă e tot ACEASTĂ mișcare (gardă pe seq + obiect LIVE) —
                // altfel timer-ul mișcării precedente ștergea lrc-ul mișcării noi înainte de
                // prima ei randare (hibrid) ⇒ cartea apărea instant, fără zbor.
                const _clrSeqC = lrc.seq;
                setTimeout(() => { const g = roomData && roomData.gameState; if(g && g.lastRentzCard && g.lastRentzCard.seq === _clrSeqC) g.lastRentzCard = null; }, 1700);
              }
              if(imgSrc) el.innerHTML = `<img src="${imgSrc}" alt="${key}" draggable="false" style="width:100%;height:100%;border-radius:4px;display:block;"/>`;
              else { el.style.cssText = `background:#f5f0e8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;color:${suitColors[suit]};`; el.textContent = card.rank + suit; }
            } else {
              el.style.visibility = 'hidden';
            }
            row.appendChild(el);
          });
          rb.appendChild(row);
        });

        const applyRentzScale = () => {
          if(!rb) return;
          // Măsurăm spațiul REAL al boardului (exclude eticheta, padding-ul mesei și gap-urile),
          // nu tot .table-area — așa cărțile nu mai ies din panou pe verticală/orizontală.
          const availW = rb.clientWidth;
          const availHraw = rb.clientHeight;
          if(availW < 10 || availHraw < 10) return;
          const RATIO = 110 / 75;
          const rows = rb.querySelectorAll('.rentz-row');
          const nRows = rows.length;
          if(nRows === 0) return;
          // Sloturi = cel mai LUNG rând (culoarea cu cele mai multe cărți); restul se centrează.
          let maxCards = 1;
          rows.forEach(r => { maxCards = Math.max(maxCards, r.children.length); });
          // Bugetul de înălțime scade gap-urile dintre rânduri (2px) și padding-ul boardului (4px sus/jos).
          const GAP = 2, VPAD = 4, HARD_MAX = 140;
          const availH = availHraw - 2*VPAD - (nRows - 1)*GAP;
          const wByWidth  = Math.floor(availW / maxCards);
          const wByHeight = Math.floor(availH / nRows / RATIO);
          const cardW = Math.max(Math.min(wByWidth, wByHeight, HARD_MAX), 16);
          const cardH = Math.round(cardW * RATIO);
          rows.forEach(row => {
            row.style.width = (cardW * row.children.length) + 'px';
            Array.from(row.children).forEach(el => {
              el.style.width = cardW + 'px'; el.style.height = cardH + 'px';
              if(el.style.visibility === 'hidden') return;
              const img = el.querySelector('img');
              if(img) { img.style.width = '100%'; img.style.height = '100%'; }
              else { el.style.fontSize = Math.max(8, cardW * 0.28) + 'px'; }
            });
          });
        };

        const scheduleScale = () => {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            applyRentzScale();
            setTimeout(applyRentzScale, 0);
            setTimeout(applyRentzScale, 120);
          }));
        };
        scheduleScale();

        // Declanșăm zborul cărții nou-etalate DUPĂ dimensionarea celulelor (altfel n-are mărime).
        if(window._rentzFlyPending){
          const fp = window._rentzFlyPending; window._rentzFlyPending = null;
          const holdK = window._turnHoldKey;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            flyCardToTable(fp.player, 'etalate', fp.key, (el) => {
              if(el) el.classList.add('rentz-card-glow');
              // ATERIZAT → stingem hold-ul și re-randăm: abia acum avansează rândul.
              if(window._turnHoldKey === holdK){
                window._turnHold = false;
                if(window._turnHoldSafety){ clearTimeout(window._turnHoldSafety); window._turnHoldSafety = null; }
                try { renderGame(); } catch(e){}
              }
            });
          }));
        }
        applyCardFlightHide();   // re-ascunde destinațiile zborurilor încă active (re-randare)

        if(window._rentzBoardRO) window._rentzBoardRO.disconnect();
        window._rentzBoardRO = new ResizeObserver(() => applyRentzScale());
        const taEl = document.querySelector('.table-area');
        if(taEl) window._rentzBoardRO.observe(taEl);
        // ── La finalul rundei de RENTZ: spargem TOATE cărțile etalate în cioburi care se
        // măresc lent (1.8s) + glow + dispar; abia apoi apare overlay-ul cu „PROGRESEAZĂ". ──
        if(gs.finished && window._rentzShatterRound !== s.roundNumber) {
          window._rentzShatterRound = s.roundNumber;
          setTimeout(() => {
            const board = document.getElementById('rentzBoard');
            if(board) { try { shatterAllIn(board, '.rentz-row-card', 'grow'); } catch(e){} }
            setTimeout(() => { window._rentzShatterDone = s.roundNumber; onRoomUpdate(); }, 1850);
          }, 240);
        }
      }
      }
    } else {
      document.getElementById('tableLabel').style.display = 'none';
      if(gs.spTrickDisplay) {
        // Single player: afișăm cărțile EXACT ca la multiplayer (același overlay,
        // aceeași dispunere și scalare a cărților pe masă). Logica de joc rămâne
        // separată (spTrickDisplay / spConfirmTrick) — copiem doar prezentarea.
        const td = gs.spTrickDisplay;
        // NU mai golim masa: sloturile cu cele 3 cărți intermediare RĂMÂN sub overlay,
        // iar fade-in-ul overlay-ului devine un crossfade peste ele (înainte, golirea
        // făcea toate cărțile să „dispară brusc" pe durata fade-ului). Overlay-ul e opac,
        // deci conținutul de dedesubt nu se vede după ce fade-ul se încheie.
        const winnerName = players[td.winnerIdx] || '?';
        const existing = document.getElementById('trickTakenOverlay');
        if(!existing) {
          // confirmed gol — la single player confirmă doar jucătorul uman
          showTrickTakenOverlay(td.trick, winnerName, td.winnerIdx, players, []);
        }
        // Butonul "Confirmă mâna" e injectat în logica statusBar de mai jos
      } else if(gs.pendingTrick) {
        // NU mai golim masa (vezi nota de la ramura single-player): crossfade cursiv.
        const winnerName = players[gs.pendingTrick.winnerIdx];
        const confirmed = gs.pendingTrick.confirmed || [];
        const existing = document.getElementById('trickTakenOverlay');
        if(!existing) {
          showTrickTakenOverlay(gs.pendingTrick.trick, winnerName, gs.pendingTrick.winnerIdx, players, confirmed);
        } else {
          updateTrickOverlayContent(confirmed, players);
        }
      } else {
        // ── SLOTURI FIXE PER JUCĂTOR ──────────────────────────────────────────
        // Rândul de sus = boții (în ORDINEA din panelul oponenților = oppOrder); jos = Eu.
        // Sloturile goale arată chenar + watermark cu numele; pe măsură ce jucătorii dau
        // cărțile, se ocupă (nume sus + carte + glow la ULTIMA jucată). Se scalează după masă.
        const playsByPlayer = {};
        (gs.currentTrick || []).forEach(p => { playsByPlayer[p.player] = p.card; });
        // Ultima carte jucată o aducem „în zbor" (spate) spre slot; glow-ul apare la ATERIZARE.
        // O singură dată per mișcare (anti-re-zbor la resize/ecou), prin _trickFlightKey.
        let _flyLast = null, _flyIsNew = false;
        if(gs.currentTrick && gs.currentTrick.length > 0) {
          const last = gs.currentTrick[gs.currentTrick.length - 1];
          const k = last.card.rank + last.card.suit + last.player;
          if(window._trickFlightKey !== k) { window._trickFlightKey = k; _flyIsNew = true; }
          _flyLast = { player: last.player, cardKey: last.card.rank + last.card.suit };
        } else {
          window._trickFlightKey = null;
        }
        const curForSlot = (gs.finished || gs.phase === 'selecting') ? -1 : dispCur;
        mountTrickSlots(tableContent, {
          topOrder: oppOrder, meIndex: renderIdx, players,
          playsByPlayer, glowKey: null, currentPlayer: curForSlot, winnerIdx: -1
        });
        if(_flyIsNew && _flyLast) {
          const fl = _flyLast;
          const holdK = window._turnHoldKey;
          window._cardFlights[_flightRegKey('slot', fl.cardKey, fl.player)] = { mode:'slot', cardKey: fl.cardKey, player: fl.player };
          requestAnimationFrame(() => requestAnimationFrame(() => {
            flyCardToTable(fl.player, 'slot', fl.cardKey, (el) => {
              if(el) el.classList.add('glow');
              // ATERIZAT → stingem hold-ul (dacă tot această carte e cea urmărită) și re-randăm:
              // abia acum apar chenarul/săgeata/numele verde + sunetul „e rândul tău".
              if(window._turnHoldKey === holdK){
                window._turnHold = false;
                if(window._turnHoldSafety){ clearTimeout(window._turnHoldSafety); window._turnHoldSafety = null; }
                try { renderGame(); } catch(e){}
                const d = findFlightDest({ mode:'slot', cardKey: fl.cardKey, player: fl.player });
                if(d) d.classList.add('glow'); // re-aplicăm glow-ul (re-randarea reconstruiește slotul)
              }
            });
          }));
        }
        applyCardFlightHide();   // re-ascunde slotul încă „în zbor" la re-randări
      }
    }
  }

  const sb = document.getElementById('statusBar');
  sb.style.visibility = '';
  const humanIdx = window._humanIndex ?? myIndex;
  const isMyTurn = (dispCur === humanIdx && !gs.finished && gs.phase !== 'selecting');

  const totalCardsPlaced = gs.mode === 'rentz'
    ? Object.values(gs.columns || {}).reduce((s,a) => s + a.length, 0)
    : (gs.tricks ? gs.tricks.reduce((s,t) => s + t.cards.length, 0) : 0) + (gs.currentTrick ? gs.currentTrick.length : 0);
  const turnKey = isMyTurn ? `${gs.mode}|${s.roundNumber}|${totalCardsPlaced}` : '';
  const justBecameMyTurn = isMyTurn && (turnKey !== _lastMyTurnKey);
  const taEl = document.querySelector('.table-area');
  if(!isMyTurn && taEl) taEl.classList.remove('my-turn-glow', 'pop-anim');
  // Dacă nu mai suntem în starea de confirmare a unei levate, oprim numărătoarea inversă.
  if(!gs.spTrickDisplay && !gs.pendingTrick) clearConfirmCountdown();

  if(gs.spTrickDisplay) {
    // Single player: buton de confirmare IDENTIC ca la multiplayer (același stil teal).
    sb.className = 'status-bar wait';
    if(window._trickRevealAnimating) {
      // Cât timp ultima carte face zoom → intră în slot, NU arătăm încă butonul.
      clearConfirmCountdown();
      sb.innerHTML = `<span style="color:#ffdd80;opacity:0.85;font-size:13px;">${players[gs.spTrickDisplay.winnerIdx] || ''} ia mâna...</span>`;
    } else {
      sb.innerHTML = `
        <span style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button onclick="spConfirmTrick()" style="
            background:linear-gradient(180deg,#2ec4a0,#127a65);
            color:#fff;border:none;border-radius:8px;
            padding:4px 14px;font-size:12px;font-weight:700;
            cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4);">
            ✔ Confirm mâna<span id="confirmCountdown"></span>
          </button>
        </span>`;
      // Numărătoare 3→0; dacă nu apeși, se confirmă singură.
      startConfirmCountdown('sp:' + s.roundNumber + ':' + (gs.tricks ? gs.tricks.length : 0), spConfirmTrick);
      updateConfirmCountdownLabel();
    }
    _lastMyTurnKey = '';
  } else if(gs.pendingTrick) {
    // Confirm mâna apare în statusBar — nu ascundem bara
    const confirmed = gs.pendingTrick.confirmed || [];
    const alreadyConfirmed = confirmed.includes(myIndex);
    const names = confirmed.map(i => players[i]);
    const confirmedText = names.length === 0 ? '' : names.length === 1
      ? `${names[0]} a confirmat`
      : `${names.join(', ')} au confirmat`;

    sb.className = 'status-bar wait';
    if(window._trickRevealAnimating && !alreadyConfirmed) {
      // Cât timp ultima carte face zoom → intră în slot, NU arătăm încă butonul.
      clearConfirmCountdown();
      sb.innerHTML = `<span style="color:#ffdd80;opacity:0.85;font-size:13px;">${players[gs.pendingTrick.winnerIdx] || ''} ia mâna...</span>`;
    } else if(alreadyConfirmed) {
      clearConfirmCountdown();
      sb.innerHTML = confirmedText
        ? `<span style="color:#ffdd80;font-size:13px;">✔ ${confirmedText}</span>`
        : `<span style="color:#ffdd80;">✔ Ai confirmat</span>`;
    } else {
      sb.innerHTML = `
        <span style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;">
          <button onclick="confirmTrick()" style="
            background:linear-gradient(180deg,#2ec4a0,#127a65);
            color:#fff;border:none;border-radius:8px;
            padding:4px 14px;font-size:12px;font-weight:700;
            cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4);">
            ✔ Confirm mâna<span id="confirmCountdown"></span>
          </button>
          ${confirmedText ? `<span style="color:#ffdd80;font-size:12px;">${confirmedText}</span>` : ''}
        </span>`;
      // Numărătoare 3→0; dacă nu apeși, se confirmă singură (doar partea mea).
      startConfirmCountdown('mp:' + s.roundNumber + ':' + (gs.tricks ? gs.tricks.length : 0), confirmTrick);
      updateConfirmCountdownLabel();
    }
    _lastMyTurnKey = '';
  } else if(gs.finished) {
    sb.className = 'status-bar wait'; sb.textContent = 'Runda s-a terminat!';
    _lastMyTurnKey = '';
  } else if(gs.phase === 'selecting') {
    if(s.pickerIndex === myIndex) {
      sb.className = 'status-bar my-picker';
      sb.textContent = '▶ E RÂNDUL TĂU! Alege jocul!';
    } else {
      sb.className = 'status-bar selecting';
      sb.innerHTML = `<span class="hourglass-anim">⏳</span> Alege jocul:&nbsp;<span style="font-weight:700;">${players[s.pickerIndex]}</span>...`;
    }
    _lastMyTurnKey = '';
  } else if(isMyTurn) {
    let msg;
    if(gs.mode === 'rentz') {
      const hasValid = gs.hands[myIndex].some(c => isValidRentzCard(c, gs, gs.hands[myIndex]));
      msg = hasValid ? '▶ RÂNDUL TĂU — Pune o carte!' : '▶ PAS — Nu ai mutare validă!';
    } else {
      msg = gs.currentTrick.length === 0 ? '▶ RÂNDUL TĂU — Atacă!' : '▶ RÂNDUL TĂU — Pune la culoare!';
    }
    if(sb.textContent !== msg) sb.textContent = msg;
    if(justBecameMyTurn) {
      _lastMyTurnKey = turnKey;
      sb.className = 'status-bar my-turn pop-anim';
      void sb.offsetWidth;
      setTimeout(() => { if(sb.classList.contains('pop-anim')) sb.classList.remove('pop-anim'); }, 480);
      // (sclipirea mesei la „rândul meu" a fost RETRASĂ — masa rămâne neschimbată)
    } else if(!sb.classList.contains('my-turn')) {
      sb.className = 'status-bar my-turn';
    }
  } else {
    sb.className = 'status-bar wait';
    sb.innerHTML = window._turnHold
      ? `<span class="hourglass-anim">⏳</span>`
      : (gs.currentPlayer >= 0
        ? `<span class="hourglass-anim">⏳</span> Rândul lui&nbsp;<span style="font-weight:700;">${players[gs.currentPlayer]}</span>...`
        : `⏳ Se încarcă...`);
    _lastMyTurnKey = '';
  }

  // Name + score
  const myNameScoreEl = document.getElementById('myNameScore');
  if(myNameScoreEl) {
    // Săgeata arată DIRECȚIA: jos (la mine) jocul curge spre DREAPTA ⇒ săgeată dreapta.
    const isMyPick = (gs.phase === 'selecting' && s.pickerIndex === humanIdx);
    myNameScoreEl.innerHTML = ((isMyTurn || isMyPick) ? (window._swapSeats ? ARROW_LEFT_SVG : ARROW_RIGHT_SVG) : '') + myName;
  }

  // Game symbols (J♠-Q-K♥-♦-T-R) where done ones are struck gray
  const myScoreEl = document.getElementById('myScore');
  if(myScoreEl) {
    const myRem = s.playerChoices[myIndex] || [];
    const symbolMap = {'jPica':'J♠','qMinus':'Q','kInima':'K♥','romb':'♦','totale':'T','rentz':'R'};
    const liveMine = gs.phase !== 'selecting' && !gs.finished && s.pickerIndex === myIndex;
    // Același stil ca la adversari: cip auriu / tăiat / turcoaz pulsant la jocul în curs.
    const symHtml = ALL_CHOICES.map(ch => {
      const sym = symbolMap[ch.id] || ch.label;
      const isLive = liveMine && ch.id === gs.mode;
      const isDone = !isLive && !myRem.includes(ch.id);
      return `<span class="opp-game-tag my-tag${isDone ? ' done' : ''}${isLive ? ' live' : ''}">${sym}</span>`;
    }).join('');
    myScoreEl.innerHTML = symHtml;
  }

  const handDiv = document.getElementById('handCards'); handDiv.innerHTML = '';
  // Sincronizează pastila de sortare cu variabila sortDesc (fără animație la re-randare)
  syncSortPill(false);
  // Badge „cărți luate" (cipurile de penalizare stau acum la sloturile de pe masă).
  (function(){
    const b = document.getElementById('takenBadge');
    const cnt = document.getElementById('takenCount');
    const isTrickMode = gs.mode !== 'rentz' && gs.phase !== 'selecting';
    const n = isTrickMode ? myTakenCards(gs).length : 0;
    if(b) b.style.display = isTrickMode ? 'inline-flex' : 'none';
    if(cnt) cnt.textContent = n;
    if(document.getElementById('takenSheetWrap')) refreshTakenSheet();
  })();

  // ── SLOTURI FIXE PENTRU MÂNA MEA ──────────────────────────────────────────
  // Mâna are mereu 8 cărți. Reconstruim mâna originală din starea SINCRONIZATĂ (cărți live + cărțile
  // MELE deja jucate, luate din levate/levata curentă sau din coloane la etalate). Astfel slotul cărții
  // jucate rămâne pe LOC ca o „fantomă" săpată în piatră, iar fantomele SUPRAVIEȚUIESC unui refresh cu
  // fața lor reală (fără snapshot fragil). Re-sortarea (bifa Mare→Mic) reașază toate cele 8.
  const _liveHand = gs.hands[myIndex] || [];
  const _liveSet = new Set(_liveHand.map(ck));
  const _handKey = `${roomId}|${s.roundNumber}|${gs.mode}`;
  const _fullCards = [..._liveHand.map(c => ({suit:c.suit, rank:c.rank})), ...myPlayedThisRound(gs, myIndex)];
  const _slotCards = sortHand(_fullCards);
  // seen-set pe rundă: la PRIMA randare marcăm fantomele deja existente ca „văzute", ca să NU se animeze
  // toate odată după un refresh (doar cărțile jucate DE-ACUM încolo primesc fade-ul de „ștergere").
  if(!window._myGhostsSeen || window._myGhostsSeen.key !== _handKey) {
    window._myGhostsSeen = { key: _handKey, set: new Set(_slotCards.filter(c => !_liveSet.has(ck(c))).map(ck)) };
  }

  const slotEls = []; // elementele celor 8 sloturi, în ordine sortată (le distribuim pe rânduri mai jos)
  _slotCards.forEach(card => {
    if(!_liveSet.has(ck(card))) {
      // ── SLOT-FANTOMĂ (carte deja jucată) — pe loc, alb-negru, translucid, neclicabil ──
      const fresh = !window._myGhostsSeen.set.has(ck(card));
      if(fresh) window._myGhostsSeen.set.add(ck(card));
      const gWrap = document.createElement('div');
      gWrap.innerHTML = generateCardHtml(card, false, false, false, false, false);
      const ghostEl = gWrap.firstChild;
      ghostEl.dataset.ck = card.rank + card.suit; // cheie pt. animația FLIP la sortare
      ghostEl.classList.add('card-ghost');
      if(fresh) ghostEl.classList.add('card-ghost-erase');
      slotEls.push(ghostEl);
      return;
    }

    const isSelected = selectedCard && ck(selectedCard) === ck(card);
    let isDisabled = gs.finished || !!gs.pendingTrick || !!gs.spTrickDisplay || (gs.phase === 'selecting' && gs.currentPlayer !== humanIdx);
    let isRentzValid = false;

    if(!isDisabled && gs.phase !== 'selecting') {
      if(gs.mode === 'rentz') {
        const dynamicHasValid = gs.hands[myIndex].some(c => isValidRentzCard(c, gs, gs.hands[myIndex]));
        if(dynamicHasValid) {
          isRentzValid = isValidRentzCard(card, gs, gs.hands[myIndex]);
          isDisabled = !isMyTurn || !isRentzValid;
        } else {
          isRentzValid = false; isDisabled = !isMyTurn;
        }
      } else {
        isDisabled = !isMyTurn;
      }
    }

    const isDisabledRentz = gs.mode === 'rentz' && isDisabled && !isRentzValid;
    const cardHtmlString = generateCardHtml(card, false, isSelected, isDisabled, isRentzValid, isDisabledRentz);
    const wrapper = document.createElement('div'); wrapper.innerHTML = cardHtmlString;
    const cardEl = wrapper.firstChild;
    cardEl.dataset.ck = card.rank + card.suit; // cheie pt. animația FLIP la sortare
    if(!isDisabled) {
      cardEl.addEventListener('click', () => {
        // Capturăm poziția EXACTĂ a cărții în mână ACUM (înainte să fie scoasă), ca zborul „cu fața"
        // să pornească fix din locașul ei. ck(card) o asociem cărții corecte; ts pt. prospețime.
        try { const r = cardEl.getBoundingClientRect(); if(r.width > 2 && r.height > 2) window._myPlayOrigin = { left: r.left, top: r.top, width: r.width, height: r.height, key: ck(card), ts: Date.now() }; } catch(e){}
        handleHandCardClick(card, gs);
      });
    }
    slotEls.push(cardEl);
  });

  // ── DISTRIBUȚIE PE RÂNDURI (mobil: 2 rânduri de 4, grupate pe suit-uri) ───────────
  // Regulile cerute, după numărul de cărți pe fiecare suit (♠♥♦♣):
  //   • un suit cu ≥4   → 4 din el SUS, restul JOS (începând cu restul acelui suit);
  //   • 3+3+1+1         → un 3 SUS + un singleton la locul 4; celălalt 3 JOS + celălalt singleton la locul 4;
  //   • 3+2+2+1         → 3 SUS + singletonul la locul 4; cele două perechi (2+2) JOS, grupate;
  //   • 3+3+2           → un 3 SUS + 1 din perechea de 2 (locul 4); celălalt 3 JOS + celălalt 1 (locul 4);
  //   • 2+2+2+2         → două suit-uri SUS, două JOS (grupate).
  // Pe DESKTOP: un singur rând. Cardurile sunt aceleași elemente → zborul și click-urile rămân corecte.
  const _twoRowHand = window.innerWidth <= 899 && slotEls.length === 8;
  if(_twoRowHand) {
    handDiv.classList.add('rows2');
    const _SU = ['♠','♥','♦','♣'];
    const _grp = _SU.map(su => _slotCards.map((c,i)=> c.suit===su ? i : -1).filter(i=>i>=0)).filter(g=>g.length>0);
    const _cnt = _grp.map(g=>g.length);
    const _max = Math.max(..._cnt);
    let _topI = [], _botI = [];
    if(_max >= 4) {
      const gi = _cnt.indexOf(_max);
      _topI = _grp[gi].slice(0,4);
      _grp.forEach((g,j)=> _botI.push(...(j===gi ? g.slice(4) : g)));
    } else {
      // toate ≤3: cel mai mare grup SUS, completat la 4
      const _ord = _grp.map((g,j)=>j).sort((a,b)=> _cnt[b]-_cnt[a] || a-b);
      const _big = _ord[0];
      if(_cnt[_big] === 3) {
        _topI = [..._grp[_big]];
        const _sgl = _grp.findIndex((g,j)=> _cnt[j]===1);
        if(_sgl >= 0) {
          _topI.push(_grp[_sgl][0]);                                  // singleton la locul 4 sus
          _grp.forEach((g,j)=>{ if(j!==_big && j!==_sgl) _botI.push(...g); }); // restul jos, grupat
        } else {
          // 3+3+2: spargem perechea de 2 (câte unul pe fiecare rând, la locul 4)
          const _two = _grp.findIndex((g,j)=> _cnt[j]===2);
          const _o3  = _grp.findIndex((g,j)=> _cnt[j]===3 && j!==_big);
          _topI.push(_grp[_two][0]);
          _botI.push(..._grp[_o3], _grp[_two][1]);
        }
      } else {
        // 2+2+2+2: primele două suit-uri sus, restul jos
        _topI = [..._grp[0], ..._grp[1]];
        _botI = [..._grp[2], ..._grp[3]];
      }
    }
    const r1 = document.createElement('div'); r1.className = 'hand-row';
    _topI.forEach(i => r1.appendChild(slotEls[i]));
    const r2 = document.createElement('div'); r2.className = 'hand-row';
    _botI.forEach(i => r2.appendChild(slotEls[i]));
    handDiv.appendChild(r1); handDiv.appendChild(r2);
  } else {
    handDiv.classList.remove('rows2');
    slotEls.forEach(el => handDiv.appendChild(el));
  }

  const oldOverlay = document.getElementById('roundOverlay'); if(oldOverlay) oldOverlay.remove();
  // Panoul de scor + „PROGRESEAZĂ" apare DOAR după ce s-a confirmat ultima levată ȘI s-a terminat
  // efectul de spargere a cărților: la etalate spargerea tablei, la celelalte moduri spargerea
  // cioburilor din ultima levată. (La single-player se așteaptă „Confirm mâna" / spTrickDisplay.)
  const rentzShatterPending = (gs.mode === 'rentz' && gs.finished && window._rentzShatterDone !== s.roundNumber);
  const trickShatterPending = (gs.mode !== 'rentz' && gs.finished && window._trickShatterRound === s.roundNumber && window._trickShatterDone !== s.roundNumber);
  if(gs.finished && gs.roundScores && !gs.pendingTrick && !gs.spTrickDisplay && !rentzShatterPending && !trickShatterPending) {
    displayRoundResultsOverlay(gs.roundScores, s);

    // ── ÎNVĂȚARE ȘI ÎN MULTIPLAYER ──
    // Roboții (memoria partajată) învață stilul tău de joc și din partidele reale
    // multiplayer, observând EXACT cărțile tale (jucate + rămase). Rulează o singură
    // dată pe rundă pe acest client și doar pentru jucătorul uman local (myIndex),
    // ca să nu dublăm sau să învățăm din alți jucători umani.
    // (În single-player, învățarea se face deja în proceedToNextCycle — nu o dublăm aici.)
    if(!window.isSinglePlayer && getBotDifficulty() !== 'easy' && myIndex >= 0) {
      const roundKey = `${roomId}|${s.roundNumber}|${gs.mode}`;
      if(window._lastMpLearnKey !== roundKey) {
        window._lastMpLearnKey = roundKey;
        analyzeHumanRound(gs, myIndex, s.maxPlayers || 4);
      }
    }
  }
}

// Reconstruiește cărțile pe care le-am jucat EU în runda curentă din starea SINCRONIZATĂ: din levate
// (+ levata în curs) la jocurile cu levată, din coloane la etalate. Astfel fantomele din mâna mea
// supraviețuiesc unui refresh cu fața lor reală, fără să ținem un snapshot client-side fragil.
// NOTĂ: levata terminată e deja în gs.tricks (pendingTrick/spTrickDisplay e duplicatul ei — nu-l adăugăm).
function myPlayedThisRound(gs, myIdx) {
  const out = [];
  if(gs.mode === 'rentz') {
    for(const suit of SUITS) {
      const col = (gs.columns && gs.columns[suit]) ? gs.columns[suit] : [];
      for(const c of col) if(c.player === myIdx) out.push({suit:c.suit, rank:c.rank});
    }
  } else {
    for(const t of (gs.tricks || [])) {
      const ps = t.players || [];
      for(let k=0; k<ps.length; k++) if(ps[k] === myIdx && t.cards[k]) out.push({suit:t.cards[k].suit, rank:t.cards[k].rank});
    }
    for(const x of (gs.currentTrick || [])) if(x.player === myIdx && x.card) out.push({suit:x.card.suit, rank:x.card.rank});
  }
  return out;
}

function isValidRentzCard(card, gs, hand) {
  const suit = card.suit; const ri = RANKS.indexOf(card.rank);

  // Carte pe coloana deschisa — valida daca se lipeste
  if(gs.colStarted[suit]) {
    return (ri === gs.upNext[suit] || ri === gs.downNext[suit]);
  }
  // J pe coloana neinceputa — valid DOAR daca nu exista nicio alta mutare valida
  if(card.rank === 'J') {
    if(!hand) return true; // fallback fara context mana
    const hasOtherMove = hand.some(c => {
      if(ck(c) === ck(card)) return false;
      if(!gs.colStarted[c.suit]) return false;
      const ci = RANKS.indexOf(c.rank);
      return (ci === gs.upNext[c.suit] || ci === gs.downNext[c.suit]);
    });
    return !hasOtherMove;
  }
  return false;
}

// ─── GAME LOGIC & ACTION CONTROLLERS ──────────────────────────────────────────
async function selectGameMode(modeId) {
  const s = roomData; if(s.pickerIndex !== myIndex || s.gameState.phase !== 'selecting') return;
  if(!window._suppressRender) SFX.play('select'); // alegerea umană (botul rulează cu _suppressRender)

  s.playerChoices[myIndex] = s.playerChoices[myIndex].filter(m => m !== modeId);
  s.gameState.phase = 'playing';
  s.gameState.mode = modeId;

  if(modeId === 'rentz') {
    s.gameState.currentPlayer = s.pickerIndex;
  }

  await updateRoom(roomId, s);
}

async function handleHandCardClick(card, gs) {
  const s = roomData;
  if(gs.phase === 'selecting' || gs.finished || gs.currentPlayer !== myIndex) return;

  if(gs.mode === 'rentz') {
    const hasValidMutari = gs.hands[myIndex].some(c => isValidRentzCard(c, gs, gs.hands[myIndex]));
    if(!hasValidMutari) {
      SFX.play('card');
      executeRentzPass();
      return;
    }
    if(!isValidRentzCard(card, gs, gs.hands[myIndex])) { SFX.play('error'); toast('Carte invalidă!'); return; }
    SFX.play('card');
    await executeRentzPlay(card);
  } else {
    if(selectedCard && ck(selectedCard) === ck(card)) {
      SFX.play('card');
      await executeTrickPlay(card);
    } else {
      if(gs.currentTrick.length > 0) {
        const lead = gs.leadSuit;
        const hasSuit = gs.hands[myIndex].some(c => c.suit === lead);
        if(hasSuit && card.suit !== lead) { SFX.play('error'); toast(`Trebuie să pui obligatoriu: ${lead}`); return; }
      }
      selectedCard = card;
      renderGame();
    }
  }
}

// TRICKS GAMES ENGINE
async function executeTrickPlay(card) {
  const s = roomData; const gs = s.gameState;
  const maxP = s.maxPlayers || 4;

  gs.hands[myIndex] = gs.hands[myIndex].filter(c => ck(c) !== ck(card));
  const newTrick = [...gs.currentTrick, {player: myIndex, card}];

  if(newTrick.length === 1) gs.leadSuit = card.suit;

  if(newTrick.length === maxP) {
    const winIdx = evaluateTrickWinner(newTrick, gs.leadSuit);
    // Stocăm și `players` (ordinea jucătorilor) + `leadSuit` ca botul AI să poată
    // analiza retroactiv ce a jucat fiecare jucător uman (pentru sistemul de învățare).
    gs.tricks.push({
      cards: newTrick.map(x => x.card),
      players: newTrick.map(x => x.player),
      leadSuit: gs.leadSuit,
      winner: winIdx
    });

    const interimScores = calculateTricksScoring(gs.mode, gs.tricks, maxP);

    const noMoreDiamonds = gs.mode === 'romb' && gs.hands.every(hand => !hand.some(c => c.suit === '♦'));
    const abruptEnd = (gs.mode === 'jPica' && interimScores.some(sc => sc === 10))
      || (gs.mode === 'kInima' && interimScores.some(sc => sc === -5))
      || (gs.mode === 'qMinus' && interimScores.reduce((a,b)=>a+b, 0) === -12)
      || noMoreDiamonds
      || gs.hands[0].length === 0;

    if(abruptEnd) {
      gs.finished = true;
      gs.roundScores = interimScores;
      gs.roundScores.forEach((punc, idx) => { s.totalScores[idx] += punc; });
    }

    if(window.isSinglePlayer) {
      // Salvăm trick-ul în gs pentru afișare — renderGame va arăta butonul de confirmare
      gs.spTrickDisplay = { trick: newTrick, winnerIdx: winIdx };
      gs.currentTrick = []; gs.leadSuit = null; gs.currentPlayer = winIdx;
      selectedCard = null; s.gameState = gs; roomData = s;
      // Salvăm în localStorage și randăm — NU apelăm updateRoom încă
      try { localStorage.setItem('rentz_sp_state', JSON.stringify({myName, myIndex: (window._humanIndex ?? myIndex), state: s})); } catch(e) {}
      onRoomUpdate();
    } else {
      gs.pendingTrick = { trick: newTrick, winnerIdx: winIdx, confirmed: [] };
      gs.currentTrick = []; gs.leadSuit = null; gs.currentPlayer = winIdx;
      selectedCard = null; s.gameState = gs; roomData = s;
      await updateRoom(roomId, s);
    }

  } else {
    gs.currentTrick = newTrick;
    // SENS INVERS ACELOR DE CEASORNIC: următorul jucător e la STÂNGA în cerc (index − 1).
    // (botPlayTurn setează temporar myIndex = botIdx, deci avansarea e corectă și pt. boți.)
    gs.currentPlayer = (myIndex - 1 + maxP) % maxP;

    selectedCard = null; s.gameState = gs; roomData = s;
    await updateRoom(roomId, s);
  }
}

function evaluateTrickWinner(trick, leadSuit) {
  let top = trick[0];
  for(let i=1; i<trick.length; i++) {
    if(trick[i].card.suit === leadSuit) {
      if(top.card.suit !== leadSuit || RV[trick[i].card.rank] > RV[top.card.rank]) {
        top = trick[i];
      }
    }
  }
  return top.player;
}

function calculateTricksScoring(mode, completedTricks, maxPlayers) {
  const points = Array(maxPlayers).fill(0);
  const handsCount = Array(maxPlayers).fill(0);

  for(const t of completedTricks) {
    const w = t.winner;
    handsCount[w]++;
    for(const c of t.cards) {
      if(mode === 'jPica' && c.rank === 'J' && c.suit === '♠') points[w] += 10;
      if(mode === 'kInima' && c.rank === 'K' && c.suit === '♥') points[w] -= 5;
      if(mode === 'qMinus' && c.rank === 'Q') points[w] -= 3;
      if(mode === 'romb' && c.suit === '♦') points[w] -= 1;

      if(mode === 'totale') {
        if(c.rank === 'K' && c.suit === '♥') points[w] -= 5;
        if(c.rank === 'Q') points[w] -= 3;
        if(c.suit === '♦') points[w] -= 1;
      }
    }
  }

  if(mode === 'totale') {
    for(let i=0; i<maxPlayers; i++) { points[i] -= handsCount[i]; }
  }
  return points;
}

// RENTZ MODE ENGINE
async function executeRentzPlay(card) {
  const s = roomData; const gs = s.gameState;
  const maxP = s.maxPlayers || 4;
  const suit = card.suit; const ri = RANKS.indexOf(card.rank);

  gs.hands[myIndex] = gs.hands[myIndex].filter(c => ck(c) !== ck(card));
  gs.columns[suit].push({...card, player: myIndex});

  let stepExtraTurn = false;
  let stepSkipNext = false;

  if(card.rank === 'J') {
    gs.colStarted[suit] = true;
    if(!gs.suitPlayOrder) gs.suitPlayOrder = [];
    if(!gs.suitPlayOrder.includes(suit)) gs.suitPlayOrder.push(suit);
    const jIndex = RANKS.indexOf('J');
    gs.upNext[suit] = jIndex + 1;
    gs.downNext[suit] = jIndex - 1;
  } else if(ri === gs.upNext[suit]) {
    gs.upNext[suit] = ri + 1;
    if(card.rank === 'A') stepExtraTurn = true;
  } else if(ri === gs.downNext[suit]) {
    gs.downNext[suit] = ri - 1;
    const capatRank = maxP === 3 ? '9' : '7';
    if(card.rank === capatRank) stepSkipNext = true;
  }

  // Determinăm next player ca să putem afișa în side panel cine stă
  let nextTarget = myIndex;
  if(!stepExtraTurn) {
    nextTarget = (myIndex - 1 + maxP) % maxP;
    if(stepSkipNext) {
      let activeFound = 0;
      for(let step = 1; step <= maxP; step++) {
        const candidate = (myIndex - step + maxP) % maxP;
        if(!gs.finishOrder.includes(candidate) && gs.hands[candidate].length > 0) {
          activeFound++;
          if(activeFound === 2) { nextTarget = candidate; break; }
        }
      }
      if(activeFound < 2) {
        for(let step = 1; step <= maxP; step++) {
          const candidate = (myIndex - step + maxP) % maxP;
          if(!gs.finishOrder.includes(candidate) && gs.hands[candidate].length > 0) {
            nextTarget = candidate; break;
          }
        }
      }
    }
  }

  // Jucătorul care stă: primul jucător ACTIV după myIndex (sărind peste cei care au
  // terminat deja — aceia au sărit automat, deci skip-ul real cade pe următorul activ).
  // Afișăm "stă" doar dacă există MĂCAR 2 activi după mine (skip autentic: nextTarget
  // ajunge la al 2-lea activ). Cu un singur activ rămas nu există skip de afișat.
  let skippedPlayer = null;
  if(stepSkipNext) {
    const activeAfter = [];
    for(let step = 1; step <= maxP; step++) {
      const candidate = (myIndex - step + maxP) % maxP;
      if(!gs.finishOrder.includes(candidate) && gs.hands[candidate].length > 0) {
        activeAfter.push(candidate);
      }
    }
    if(activeAfter.length >= 2) skippedPlayer = activeAfter[0];
  }

  gs.rentzSeq = (gs.rentzSeq || 0) + 1; // id unic de mișcare (pt. deduplicarea mesajelor mobile)
  gs.lastRentzCard = {
    rank: card.rank, suit: card.suit,
    player: myIndex,
    event: stepExtraTurn ? 'ace' : stepSkipNext ? 'end' : 'normal',
    skipped: skippedPlayer,
    seq: gs.rentzSeq
  };

  if(gs.hands[myIndex].length === 0 && !gs.finishOrder.includes(myIndex)) {
    gs.finishOrder.push(myIndex);
  }

  gs.currentPlayer = nextTarget;
  gs.passCount = 0;
  await verifyRentzEndState(s, gs);
}

async function executeRentzPass() {
  const s = roomData; const gs = s.gameState;
  const maxP = s.maxPlayers || 4;
  gs.passCount++;
  gs.currentPlayer = (myIndex - 1 + maxP) % maxP;
  gs.rentzSeq = (gs.rentzSeq || 0) + 1; // id unic de mișcare (pasul repetat trebuie afișat de fiecare dată)
  gs.lastRentzCard = { rank: null, suit: null, player: myIndex, event: 'pass', seq: gs.rentzSeq };
  await verifyRentzEndState(s, gs);
}

async function verifyRentzEndState(s, gs) {
  const maxP = s.maxPlayers || 4;

  // Auto-skip jucători fără cărți
  let safetyCounter = 0;
  while(safetyCounter++ < maxP) {
    const cp = gs.currentPlayer;
    if(gs.finishOrder.includes(cp)) {
      gs.currentPlayer = (cp - 1 + maxP) % maxP;
      continue;
    }
    if(gs.hands[cp].length === 0) {
      gs.finishOrder.push(cp);
      gs.currentPlayer = (cp - 1 + maxP) % maxP;
      continue;
    }
    break;
  }

  if(gs.finishOrder.length === maxP || gs.hands.every(h=>h.length===0) || gs.passCount >= (maxP * 2)) {
    for(let i=0; i<maxP; i++) {
      if(!gs.finishOrder.includes(i)) gs.finishOrder.push(i);
    }
    gs.finished = true;

    // Distribuirea scorurilor la Rentz adaptată dinamic pentru 3 sau 4 jucători
    const rewards = maxP === 3 ? [10, 5, 0] : [15, 10, 5, 0];
    gs.roundScores = Array(maxP).fill(0);
    gs.finishOrder.forEach((pIdx, rk) => { gs.roundScores[pIdx] = rewards[rk]; });
    gs.roundScores.forEach((pts, idx) => { s.totalScores[idx] += pts; });
  }

  selectedCard = null; s.gameState = gs; roomData = s;
  await updateRoom(roomId, s);
}

// ─── ROUND SUMMARY OVERLAY ────────────────────────────────────────────────────
function displayRoundResultsOverlay(roundScores, s) {
  // Sunet de rundă încheiată — o singură dată per rundă (overlay-ul se recreează la fiecare render).
  if(window._roundSoundFor !== s.roundNumber) { window._roundSoundFor = s.roundNumber; SFX.play('round'); }

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'roundOverlay';

  // Clasament rundă (scor descrescător, apoi nume A-Z)
  const roundRanking = s.players
    .map((p, i) => ({
      name: p.name,
      score: roundScores[i]
    }))
    .sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return a.name.localeCompare(b.name, 'ro');
    });

  // Clasament general (scor descrescător, apoi nume A-Z)
  const totalRanking = s.players
    .map((p, i) => ({
      name: p.name,
      score: s.totalScores[i]
    }))
    .sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return a.name.localeCompare(b.name, 'ro');
    });

  const rows = roundRanking.map(p => {
    const cStyle =
      p.score > 0
        ? 'color:#2ecc71; font-weight:bold;'
        : p.score < 0
          ? 'color:#e74c3c; font-weight:bold;'
          : 'color:grey;';

    return `
      <div class="score-row">
        <span>${p.name}</span>
        <span style="${cStyle}">
          ${p.score > 0 ? '+' : ''}${p.score} p.
        </span>
      </div>
    `;
  }).join('');

  const totalRows = totalRanking.map(p => `
    <div style="margin-bottom:4px;">
      <strong>${p.name}:</strong> Total ${p.score} p.
    </div>
  `).join('');

  const isHost = (window._humanIndex ?? myIndex) === s.host;
  const inTiebreaker = !!s.tiebreakerSession;

  const tiebreakerBanner = inTiebreaker
    ? `<div style="background:rgba(108,143,255,0.1); border:1px solid rgba(108,143,255,0.3); border-radius:6px; padding:8px; margin-bottom:10px; font-size:12px; color:#8ca8ff; text-align:center;">
        ⚔️ DEPARTAJARE — Runda ${(s.tiebreakerSession.roundsDone || 0) + 1}/${s.maxPlayers || 4}
      </div>`
    : '';

  ov.innerHTML = `
    <div class="overlay-box">

      <div class="overlay-title" style="font-size:clamp(22px,5vw,32px);">
        🏁 Runda ${s.roundNumber} Finalizată
      </div>

      ${tiebreakerBanner}

      <div style="font-weight:bold; margin-bottom:8px;">
        Clasament rundă
      </div>

      <div style="margin-bottom:8px;">
        ${rows}
      </div>

      <hr style="border:0; border-top:1px solid rgba(255,255,255,0.08); margin:12px 0;">

      <div style="font-weight:bold; margin-bottom:8px;">
        Clasament general
      </div>

      <div style="text-align:left; font-size:18px; margin-bottom:12px;">
        ${totalRows}
      </div>

      ${isHost
        ? `<button class="btn btn-primary" style="font-size:18px;" onclick="proceedToNextCycle()">PROGRESEAZĂ</button>`
        : `<div style="font-size:16px; color:gray">Se așteaptă ca administratorul să pornească...</div>`
      }

    </div>
  `;

  document.body.appendChild(ov);
}

async function proceedToNextCycle() {
  const s = roomData;
  const maxP = s.maxPlayers || 4;

  // Salvează runda curentă în istoric (dacă nu a fost deja salvată)
  if (s.gameState && s.gameState.roundScores && s.gameState.mode) {
    if (!s.roundHistory) s.roundHistory = [];
    const alreadySaved = s.roundHistory.some(r => r.roundNumber === s.roundNumber);
    if (!alreadySaved) {
      s.roundHistory.push({
        roundNumber: s.roundNumber,
        pickerIndex: s.pickerIndex,
        mode: s.gameState.mode,
        scores: [...s.gameState.roundScores]
      });
    }

    // Single-player: botul care a ales jocul "învață" din rezultatul real obținut
    if(window.isSinglePlayer && s.gameState.mode !== 'rentz') {
      const pickerPlayer = s.players[s.pickerIndex];
      if(pickerPlayer && pickerPlayer.isBot) {
        const scoreObtained = s.gameState.roundScores[s.pickerIndex] || 0;
        recordBotGameResult(s.gameState.mode, scoreObtained);
      }
    }

    // Single-player: la finalul FIECĂREI runde, botul analizează cărțile jucătorului
    // uman (jucate + rămase în mână) și își rafinează profilul de adversar.
    // Doar pe medium/hard/adaptive — pe easy botul "nu observă" nimic.
    if(window.isSinglePlayer && getBotDifficulty() !== 'easy') {
      const humanIdx = window._humanIndex ?? 0;
      analyzeHumanRound(s.gameState, humanIdx, maxP);
    }
  }

  s.roundNumber++;

  const inTiebreaker = !!s.tiebreakerSession;
  const tiebreakerRoundsTotal = maxP; // câte runde de rentz pe sesiune

  if(inTiebreaker) {
    s.tiebreakerSession.roundsDone = (s.tiebreakerSession.roundsDone || 0) + 1;
    if(s.tiebreakerSession.roundsDone >= tiebreakerRoundsTotal) {
      // Sesiunea de departajare s-a terminat — verifică din nou egalitate
      if(hasAnyTie(s)) {
        // Egalitate în continuare — anunțăm DIN NOU și pornim o sesiune nouă abia la „Continuă".
        if(window.isSinglePlayer) window._botActing = false;
        const roundOv = document.getElementById('roundOverlay'); if(roundOv) roundOv.remove();
        showTiebreakerIntroOverlay(s);
        return;
      } else {
        // Nu mai e egalitate — final adevărat
        s.tiebreakerSession = null;
        s.screen = 'final';
      }
    } else {
      // Continuă sesiunea curentă de departajare
      // Departajare: aceeași ordine inversă (invers acelor de ceasornic).
      s.pickerIndex = (maxP - (s.tiebreakerSession.roundsDone % maxP)) % maxP;
      prepareRentzRound(s);
    }
  } else {
    // Meci normal
    if(s.roundNumber > (maxP * 6)) {
      // Meciul s-a terminat — verifică egalitate
      if(hasAnyTie(s)) {
        // Export JSON (funcția sare singură peste single-player & hibrid) — partida e gata.
        exportJSON(s);
        // NU intrăm direct în departajare: anunțăm egalitatea cu un overlay + buton „Continuă".
        // Rentz-ul de departajare pornește abia la apăsare (vezi startTiebreakerSession).
        if(window.isSinglePlayer) window._botActing = false;
        const roundOv = document.getElementById('roundOverlay'); if(roundOv) roundOv.remove();
        showTiebreakerIntroOverlay(s);
        return;
      } else {
        s.screen = 'final';
      }
    } else {
      // Ordinea de ALEGERE a jocului = INVERS acelor de ceasornic (picker −1 pe rundă),
      // la fel ca direcția de joc. Runda 1 rămâne picker 0 (setat la start).
      s.pickerIndex = (maxP - ((s.roundNumber - 1) % maxP)) % maxP;
      prepareSelectionPhase(s);
    }
  }

  if(window.isSinglePlayer) window._botActing = false;
  await updateRoom(roomId, s);
  const ov = document.getElementById('roundOverlay'); if(ov) ov.remove();
}

// Overlay de egalitate la final de meci: anunță egalitatea și, la „Continuă", pornește
// sesiunea de departajare (maxP runde de Rentz). Apare doar celui care a apăsat PROGRESEAZĂ
// (gazda în multiplayer / jucătorul în single-player); ceilalți primesc runda sincronizat.

  const maxP = s.maxPlayers || 4;
  const existing = document.getElementById('tiebreakerIntroOverlay'); if(existing) existing.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay';

    <div class="overlay-box" style="text-align:center;">
      <div class="overlay-title" style="font-size:clamp(22px,5vw,32px);">⚔️ Egalitate!</div>
      <div style="font-size:16px; line-height:1.5; margin:14px 0 18px;">
        Meciul s-a încheiat la egalitate.<br>
        Urmează <strong>${maxP} runde de Rentz</strong> pentru departajare.
      </div>
      <button class="btn btn-primary" style="font-size:18px;" onclick="startTiebreakerSession()">Continuă</button>
    </div>
