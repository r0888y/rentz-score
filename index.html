// ─── PROPRIETARUL BOȚILOR ÎN MULTIPLAYER ──────────────────────────────────────
// Regula: GAZDA (s.host) e singura care rulează logica boților și scrie mutarea în
// Supabase. Ceilalți clienți doar o văd apărând prin realtime. Asta evită ca doi
// clienți să joace simultan pentru același bot.
function amBotHost() {
  return !window.isSinglePlayer && !!roomData && (window._humanIndex ?? myIndex) === roomData.host;
}

// „Cheia" unică a punctului de decizie curent al boților. Se schimbă după FIECARE
// acțiune de bot (alt index / alt număr de cărți / alt seq), dar e IDENTICĂ pentru
// evenimente realtime duplicate ale aceleiași stări. O folosim ca să garantăm că un
// bot mută EXACT O DATĂ, chiar dacă același update sosește de mai multe ori (ecou
// propriu, re-randări, latență).
function botTurnKey(s) {
  const gs = s.gameState; if(!gs) return '';
  const rn = s.roundNumber || 0;
  if(gs.phase === 'selecting') return 'sel|'+rn+'|'+s.pickerIndex;
  if(gs.pendingTrick) {
    const conf = (gs.pendingTrick.confirmed || []).slice().sort((a,b)=>a-b).join(',');
    return 'conf|'+rn+'|'+(gs.tricks ? gs.tricks.length : 0)+'|'+conf;
  }
  if(gs.finished) return '';
  const cp = gs.currentPlayer;
  if(gs.mode === 'rentz') return 'rz|'+rn+'|'+(gs.rentzSeq || 0)+'|'+cp;
  const handLen = (gs.hands && gs.hands[cp]) ? gs.hands[cp].length : -1;
  return 'pl|'+rn+'|'+(gs.tricks ? gs.tricks.length : 0)+'|'+(gs.currentTrick ? gs.currentTrick.length : 0)+'|'+cp+'|'+handLen;
}

// Numărul de boți permiși: lăsăm MEREU cel puțin 2 sloturi de oameni.
// (4 jucători → max 2 boți; 3 jucători → max 1 bot.)
function maxBotsAllowed(maxPlayers) { return Math.max(0, (maxPlayers || 4) - 2); }

// Partidă „hibridă" = multiplayer cu CEL PUȚIN un bot. Fără boți = multiplayer pur.
function isHybridGame() {
  return !window.isSinglePlayer && !!roomData && (roomData.players || []).some(p => p && p.isBot);
}

function scheduleBotTurnIfNeeded() {
  // Boții sunt conduși fie de jocul single-player, fie — în multiplayer hibrid — DOAR de gazdă.
  if(!window.isSinglePlayer && !amBotHost()) return;
  if(window._spTrickDelay) return;
  const s = roomData;
  if(!s || s.screen !== 'game') return;
  const gs = s.gameState;
  if(!gs) return;
  if(gs.spTrickDisplay) return; // SP: așteptăm confirmarea jucătorului uman
  // pendingTrick = se așteaptă confirmarea OAMENILOR. Boții NU confirmă nimic (exact ca la
  // single-player); cât timp există un pendingTrick, botul doar așteaptă — oamenii confirmă.
  if(gs.pendingTrick) return;
  if(gs.finished) return;

  // Garda EXACT-O-DATĂ: dacă am tratat deja acest punct de decizie, ignorăm (ecou întârziat).
  const key = botTurnKey(s);
  if(!key) return;
  if(key === window._botActedKey) return;
  if(window._botActing) return; // o singură acțiune programată/în curs la un moment dat

  // Selectare joc (picker e bot)
  if(gs.phase === 'selecting') {
    if(s.players[s.pickerIndex] && s.players[s.pickerIndex].isBot) {
      window._botActing = true; window._botSchedKey = key;
      setTimeout(() => { botSelectGame(s.pickerIndex, key); }, 900 + Math.random()*700);
    }
    return;
  }

  // Joacă o carte (bot e la rând)
  const cp = gs.currentPlayer;
  if(s.players[cp] && s.players[cp].isBot) {
    window._botActing = true; window._botSchedKey = key;
    // Rentz rămâne mai lent (mizele de plasare cer mai mult „suspans"). La celelalte moduri
    // botul așteaptă acum > durata zborului (~1s) ÎNAINTE de a pune cartea, ca să apuce să se
    // vadă chenarul + numele verde pe jucătorul care urmează (altfel cartea precedentă încă
    // zboară când botul următor pune deja, iar indicatorul de rând era sărit).
    const playDelay = gs.mode === 'rentz' ? (1500 + Math.random()*500) : (1800 + Math.random()*400);
    setTimeout(() => { botPlayTurn(cp, key); }, playDelay);
  }
}

async function botSelectGame(botIdx, key) {
  const s = roomData;
  if(!s || s.gameState.phase !== 'selecting' || s.pickerIndex !== botIdx || !s.players[botIdx] || !s.players[botIdx].isBot) { window._botActing = false; return; }
  const available = s.playerChoices[botIdx] || [];
  if(available.length === 0) { window._botActing = false; return; }
  // Marcăm punctul de decizie ca „tratat" ÎNAINTE de a scrie mutarea, ca un eveniment
  // realtime întârziat cu aceeași stare să nu declanșeze a doua oară aceeași acțiune.
  if(key) window._botActedKey = key;
  const choice = chooseBestGameMode(available, s.gameState.hands[botIdx], s.maxPlayers || 4);
  const savedMyIndex = myIndex;
  myIndex = botIdx;
  window._suppressRender = true;
  try {
    await selectGameMode(choice);
  } catch(e) {
    console.error('botSelectGame error:', e);
  } finally {
    myIndex = savedMyIndex;
    window._suppressRender = false;
    window._botActing = false;
  }
  onRoomUpdate(); // randăm acum, cu myIndex corect
  scheduleBotTurnIfNeeded();
}

// Evaluează mâna botului și alege jocul cel mai favorabil dintre opțiunile disponibile.
// Logica: fiecare mod are o cartelă/grup "periculos" — dacă botul are puține din ele
// (sau le poate controla/juca strategic), modul e bun pentru el; dacă are multe, e riscant.

// ═══════════════════════════════════════════════════════════════════════════════
// ─── BOT AI: SISTEM DE ÎNVĂȚARE AVANSAT + MEMORIE PERMANENTĂ (IndexedDB) ───────
// ═══════════════════════════════════════════════════════════════════════════════
//
// Memoria globală unică e salvată în IndexedDB sub cheia `rentz_bot_permanent_memory`.
// Persistă peste TOATE partidele și sesiunile (decay foarte lent), spre deosebire de
// vechiul sistem care folosea localStorage și se reseta ușor pe Android.
//
// Memoria conține (v3 — un profil SEPARAT pe fiecare mod de joc):
//   • modes{jPica,kInima,qMinus,romb,totale,rentz} → pentru FIECARE mod: stilul învățat
//                       al umanului (traits cu încredere), culorile pe care le elimină /
//                       controlează, evenimente de decizie (ocazii + ce a ales), scorul
//                       lui în acel mod (humanScore) și calitatea mâinii botului (botEdge)
//   • global          → semnale peste toate modurile: predictibilitate + volatilitate
//                       (cât de des își schimbă stilul), nr. total de runde observate
//   • difficulty      → nivelul ales de utilizator (easy / medium / hard / adaptive)
//   • stats           → contoare pentru a verifica vizual că botul chiar evoluează
//
// Nivele de dificultate:
//   easy     → joacă aproape aleatoriu, ignoră memoria, greșeli intenționate
//   medium   → euristica clasică (nivelul de bază), fără profil de adversar
//   hard     → euristica + folosește profilul adversarului + planificare mai bună
//   adaptive → ca hard, dar învață CONTINUU și pune greutate maximă pe memorie;
//              devine din ce în ce mai bun cu fiecare rundă jucată

const BOT_MEMORY_KEY = 'rentz_bot_permanent_memory';

// Cache în memorie (RAM) ca să nu lovim IndexedDB la fiecare decizie.
// Se sincronizează cu IndexedDB la încărcare și după fiecare actualizare.
let _botMemory = null;

// ── MODEL DE DATE v3 — un profil SEPARAT pentru fiecare mod de joc ─────────────
// Reglaje pentru ÎNCREDERE + UITARE ADAPTIVĂ (documentate pe larg în răspuns).
const MODE_IDS    = ['jPica','kInima','qMinus','romb','totale','rentz'];
const _SUIT_KEYS  = ['♠','♥','♦','♣'];
const _CONF_K     = 6;    // câte observații până la ~50% încredere într-un trait
const _N_CAP      = 40;   // plafon de evidență → fereastră de „uitare" lentă, dar reală
const _ALPHA_MIN  = 0.10; // pas minim de învățare → profilul NU îngheață niciodată
const _EVENT_DECAY= 0.96; // evenimentele recente contează mai mult decât cele vechi

function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function _avgNonNull(arr){ const v = arr.filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }

// Un „belief": valoare 0..1 + n = câtă experiență stă în spatele ei (→ încredere).
function _belief(){ return { v: 0.5, n: 0 }; }

// Profilul comportamental al umanului ÎNTR-UN SINGUR mod de joc.
function _newModeProfile(){
  return {
    n: 0,            // runde observate în acest mod (experiența de bază)
    vol: 0,          // volatilitate de stil 0..1 (cât oscilează între partide)
    recent: [],      // ultimele „amprente" de stil, pentru estimarea volatilității
    humanScore: 0,   // EMA: scorul umanului în acest mod (mic = botul ar trebui să-l aleagă)
    botEdge: 0,      // EMA: scorul botului-picker în acest mod (calitatea istorică a mâinii)
    traits: {
      aggression:    _belief(), // joacă/deschide cu cărți mari
      caution:       _belief(), // joacă în siguranță, face „duck", evită riscul
      holdsDanger:   _belief(), // ține cărțile periculoase până târziu
      dumpsDanger:   _belief(), // scapă de pericol imediat ce e sigur
      takesPenalty:  _belief(), // preia INTENȚIONAT mâini penalizatoare (control/șut)
      avoidsPenalty: _belief(), // evită mâinile penalizatoare
      suitControl:   _belief(), // păstrează controlul unei culori (rămâne „major")
      voidsEarly:    _belief(), // rămâne fără o culoare foarte devreme
      opensHigh:     _belief()  // deschide trick-urile cu cărți mari
    },
    suitDump:  { '♠':0,'♥':0,'♦':0,'♣':0 }, // culori pe care încearcă să le ELIMINE (0..1)
    suitGuard: { '♠':0,'♥':0,'♦':0,'♣':0 }, // culori pe care le CONTROLEAZĂ (0..1)
    // MEMORIA DE DECIZII: nu doar rezultate, ci ocazii + ce a ales în acel context.
    // opp = de câte ori a APĂRUT ocazia; did = de câte ori a manifestat comportamentul.
    events: {
      safeDumpDeclined: { opp:0, did:0 }, // a putut scăpa SIGUR de o carte periculoasă și NU a făcut-o
      keptQueen:        { opp:0, did:0 }, // a putut arunca o damă și a păstrat-o
      keptKHeart:       { opp:0, did:0 }, // a putut scăpa de K♥ și a păstrat-o
      forcedOppPenalty: { opp:0, did:0 }, // a forțat un adversar să ia penalizarea
      duckedWinnable:   { opp:0, did:0 }, // putea câștiga o mână și a evitat intenționat
      keptSuitControl:  { opp:0, did:0 }, // a păstrat controlul unei culori până târziu
      earlyVoid:        { opp:0, did:0 }, // a golit o culoare în prima treime a rundei
      openedHigh:       { opp:0, did:0 }  // a deschis frecvent cu cărți mari
    },
    lastUpdated: 0
  };
}

function _defaultBotMemory(){
  const modes = {};
  MODE_IDS.forEach(m => modes[m] = _newModeProfile());
  return {
    version: 3,
    difficulty: 'medium',
    // Semnale GLOBALE despre uman (valabile peste toate modurile)
    global: {
      games: 0,            // runde totale observate
      predictability: 0.5, // 0 = haotic / 1 = foarte consecvent (din variația deciziilor)
      volatility: 0,       // 0..1 — media volatilității pe moduri (cât de des schimbă stilul)
      lastSeen: 0
    },
    modes,                 // ← profil SEPARAT per mod: jPica/kInima/qMinus/romb/totale/rentz
    stats: { roundsObserved: 0, gamesPlayed: 0, lastUpdated: 0 }
  };
}

// ── ÎNCREDERE: cât de sigur e botul pe ce a învățat (și câtă experiență are) ────
function _conf(n){ return n / (n + _CONF_K); }            // 0..1, saturează lin
function _modeProfile(mode){
  const mem = getBotMemory();
  if(!mem.modes) mem.modes = {};
  if(!mem.modes[mode]) mem.modes[mode] = _newModeProfile();
  return mem.modes[mode];
}
function _traitConf(prof, t){
  const b = prof && prof.traits && prof.traits[t];
  if(!b) return 0;
  return _conf(b.n) * (1 - 0.4 * (prof.vol || 0)); // stil volatil → mai puțină încredere
}
function _modeConf(prof){
  if(!prof) return 0;
  return _conf(prof.n) * (1 - 0.4 * (prof.vol || 0));
}
// Rata unui eveniment de decizie (0..1) + încrederea în ea (din nr. de ocazii).
function _eventRate(prof, name){
  const e = prof && prof.events && prof.events[name];
  if(!e || !e.opp) return { rate: 0.5, conf: 0 };
  return { rate: e.did / e.opp, conf: _conf(e.opp) };
}

// ── ÎNVĂȚARE cu UITARE ADAPTIVĂ ────────────────────────────────────────────────
// Pas mare la început (prinde repede stilul), apoi stabil, dar cu PLANȘEU (_ALPHA_MIN)
// ca să urmărească mereu schimbările de stil. n e plafonat → datele foarte vechi pierd
// treptat din greutate (fereastră mobilă), fără reset brusc → fără reacții exagerate.
function _learn(b, val){
  if(val == null) return;
  const alpha = Math.max(_ALPHA_MIN, 1 / (b.n + 2));
  b.v = b.v * (1 - alpha) + val * alpha;
  b.n = Math.min(_N_CAP, b.n + 1);
}
function _learnSuit(map, key, val, alpha){
  if(val == null) return;
  map[key] = (map[key] || 0) * (1 - alpha) + val * alpha;
}
// Înregistrează N ocazii deodată, cu decay de recență (rata = did/opp).
function _eventN(prof, name, oppN, didN){
  if(!oppN) return;
  const e = prof.events[name];
  e.opp = e.opp * _EVENT_DECAY + oppN;
  e.did = e.did * _EVENT_DECAY + didN;
}

// ── DEFINIȚII MOD-AWARE: „pericolul" și penalizarea diferă de la un mod la altul ──
// jPica = mod de PRADĂ: J♠ aduce +10 CELUI CARE IA mâna (e DORIT). Restul sunt moduri
// de minus (avoidance): vrei să eviți cărțile/mâinile care aduc puncte negative.
function _dangerFn(mode){
  switch(mode){
    case 'kInima': return c => (c.rank==='K' && c.suit==='♥') || (c.suit==='♥' && RV[c.rank] >= RV['Q']);
    case 'qMinus': return c => c.rank==='Q';
    case 'romb':   return c => c.suit==='♦' && RV[c.rank] >= RV['J'];
    case 'totale': return c => (c.rank==='K'&&c.suit==='♥') || c.rank==='Q' || (c.suit==='♦' && RV[c.rank] >= RV['J']);
    case 'jPica':  return c => c.rank==='J' && c.suit==='♠'; // „pericol" = prada (în jPica e dorită)
    default:       return _ => false;                         // rentz: fără pericol de tip carte
  }
}
// Puncte primite de CÂȘTIGĂTORUL unei mâini ce conține aceste cărți (mod-aware).
// Negativ = penalizare (moduri de minus); +10 la jPica = recompensă.
function _trickPenalty(mode, cards){
  let p = 0;
  for(const c of (cards||[])){
    if(mode==='jPica' && c.rank==='J' && c.suit==='♠') p += 10;
    if((mode==='kInima'||mode==='totale') && c.rank==='K' && c.suit==='♥') p -= 5;
    if((mode==='qMinus'||mode==='totale') && c.rank==='Q') p -= 3;
    if((mode==='romb'||mode==='totale') && c.suit==='♦') p -= 1;
  }
  if(mode==='totale') p -= 1; // la totale, mâna în sine costă -1
  return p;
}
function _modeHasPenalty(mode){ return mode==='kInima' || mode==='qMinus' || mode==='romb' || mode==='totale'; }

// ── ESTIMAREA CĂRȚILOR PROBABILE ALE UMANULUI (folosită în deciziile de risc) ──
// Cât de probabil e că umanul ÎNCĂ ține o carte periculoasă (mod-aware) târziu în rundă.
function humanLikelyHoldsDanger(mode){
  const prof = _modeProfile(mode);
  const base = prof.traits.holdsDanger.v;
  return clamp01(0.5 + (base - 0.5) * _traitConf(prof,'holdsDanger') * 2);
}
// Cât de probabil e că umanul a rămas deja FĂRĂ o culoare (a „dat-o jos") — ca să știm
// dacă mai are sens să conducem pe ea ca să-l forțăm să arunce pericol off-suit.
function humanLikelyVoid(mode, suit){
  const prof = _modeProfile(mode);
  return clamp01((prof.suitDump[suit] || 0) * _modeConf(prof));
}

// ── MIGRARE → v3 ───────────────────────────────────────────────────────────────
// Vechiul progres NU se pierde: îl pliem ca PRIOR SLAB (n mic) în toate modurile.
function _foldLocalStorageLegacy(mem){
  try{
    const raw = localStorage.getItem('rentz_bot_learning');
    if(!raw) return mem;
    const old = JSON.parse(raw);
    MODE_IDS.forEach(m => {
      if(typeof old[m] === 'number' && mem.modes[m]) mem.modes[m].botEdge = old[m];
    });
    if(typeof old.gamesPlayed === 'number') mem.stats.gamesPlayed = Math.max(mem.stats.gamesPlayed||0, old.gamesPlayed);
    localStorage.removeItem('rentz_bot_learning');
  }catch(e){}
  return mem;
}

// Convertește o memorie v2 (un singur profil GLOBAL `opponent`) în v3.
// Vechiul profil global devine un PRIOR identic în fiecare mod, cu încredere MICĂ,
// ca să nu domine; învățarea per-mod îl va specializa rapid.
function _migrateV2toV3(old){
  const mem = _defaultBotMemory();
  if(old && typeof old === 'object'){
    if(typeof old.difficulty === 'string') mem.difficulty = old.difficulty;
    if(old.stats){
      mem.stats.gamesPlayed    = old.stats.gamesPlayed    || 0;
      mem.stats.roundsObserved = old.stats.roundsObserved || 0;
    }
    const op = old.opponent || {};
    const priorN = Math.min(8, Math.round((op.samples || 0) / 3)); // prior SLAB
    const seed = (b, v) => { if(typeof v === 'number'){ b.v = clamp01(v); b.n = priorN; } };
    MODE_IDS.forEach(m => {
      const p = mem.modes[m];
      seed(p.traits.holdsDanger, op.holdsDanger);
      seed(p.traits.aggression,  op.aggression);
      seed(p.traits.dumpsDanger, op.dumpsEarly);
      if(old.modeBias && typeof old.modeBias[m] === 'number') p.botEdge = old.modeBias[m];
      // suitLean vechi (brut) → indiciu slab de „dump" normalizat
      if(op.suitLean){
        const tot = _SUIT_KEYS.reduce((a,s)=>a+(op.suitLean[s]||0),0) || 1;
        _SUIT_KEYS.forEach(s => { p.suitDump[s] = clamp01((op.suitLean[s]||0)/tot); });
      }
    });
    mem.global.games = (old.stats && old.stats.roundsObserved) || 0;
  }
  return _foldLocalStorageLegacy(mem);
}

// Completează în adâncime o memorie v3 deja existentă (după adăugări de câmpuri noi).
function _fillV3(mem){
  const def = _defaultBotMemory();
  const out = Object.assign({}, def, mem);
  out.global = Object.assign({}, def.global, mem.global || {});
  out.stats  = Object.assign({}, def.stats,  mem.stats  || {});
  out.modes  = out.modes || {};
  MODE_IDS.forEach(m => {
    const dp = _newModeProfile();
    const sp = (mem.modes && mem.modes[m]) || {};
    const p  = Object.assign({}, dp, sp);
    p.traits = Object.assign({}, dp.traits, sp.traits || {});
    Object.keys(dp.traits).forEach(t => { p.traits[t] = Object.assign({}, dp.traits[t], (sp.traits && sp.traits[t]) || {}); });
    p.suitDump  = Object.assign({}, dp.suitDump,  sp.suitDump  || {});
    p.suitGuard = Object.assign({}, dp.suitGuard, sp.suitGuard || {});
    p.events = Object.assign({}, dp.events, sp.events || {});
    Object.keys(dp.events).forEach(ev => { p.events[ev] = Object.assign({}, dp.events[ev], (sp.events && sp.events[ev]) || {}); });
    p.recent = Array.isArray(sp.recent) ? sp.recent.slice(-6) : [];
    out.modes[m] = p;
  });
  return out;
}

// Încarcă memoria din IndexedDB (o singură dată la pornire). Întoarce obiectul memoriei.
async function loadBotMemory() {
  if(_botMemory) return _botMemory;
  let mem = null;
  try { mem = await idbGet(BOT_MEMORY_KEY); } catch(e) { mem = null; }
  if(!mem || typeof mem !== 'object'){
    mem = _migrateV2toV3(null);            // memorie nouă (+ eventual localStorage vechi)
  } else if((mem.version || 0) < 3 || mem.opponent){
    mem = _migrateV2toV3(mem);             // upgrade v2 → v3
  } else {
    mem = _fillV3(mem);                     // v3 existentă: doar completări de câmpuri
  }
  _botMemory = mem;
  return _botMemory;
}

// Salvează memoria curentă în IndexedDB (persistent peste sesiuni).
async function persistBotMemory() {
  if(!_botMemory) return;
  _botMemory.stats.lastUpdated = Date.now();
  try { await idbSet(BOT_MEMORY_KEY, _botMemory); } catch(e) {}
}

// Acces sincron la memorie (folosit în deciziile de joc, care sunt sincrone).
// Garantăm că `loadBotMemory()` a rulat deja la intrarea în Single Player.
function getBotMemory() {
  if(!_botMemory) _botMemory = _defaultBotMemory();
  return _botMemory;
}

function getBotDifficulty() {
  // În multiplayer hibrid nu există selector de dificultate: boții joacă MEREU la GREU
  // (nu „adaptiv" — adaptivul învață profilul jucătorului, ceea ce nu are sens cu 2 oameni).
  if(isHybridGame()) return 'hard';
  return getBotMemory().difficulty || 'medium';
}

async function setBotDifficulty(level) {
  const mem = getBotMemory();
  mem.difficulty = level;
  await persistBotMemory();
}

// Resetare completă a memoriei botului (buton „Reset Bot Memory" în UI).
async function resetBotMemory() {
  const keepDifficulty = getBotDifficulty();
  _botMemory = _defaultBotMemory();
  _botMemory.difficulty = keepDifficulty; // păstrăm nivelul ales, resetăm doar învățarea
  try { localStorage.removeItem('rentz_bot_learning'); } catch(e) {}
  await persistBotMemory();
}

// Reîmprospătează: butoane dificultate + scor de învățare (1–10) + bară + statistici.
function refreshBotMemoryUI() {
  const mem = getBotMemory();
  const diff = mem.difficulty || 'medium';

  // 1) Butoane dificultate
  const map = { easy:'diffEasy', medium:'diffMedium', hard:'diffHard', adaptive:'diffAdaptive' };
  Object.entries(map).forEach(([lvl, id]) => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle('active', lvl === diff);
  });

  // 2) Descriere nivel
  const desc = document.getElementById('diffDesc');
  if(desc) desc.innerHTML = DIFF_DESCRIPTIONS[diff] || '';

  // 3) Scor de învățare 1–10 (badge + bară de progres)
  const score = getBotLearningScore();
  const scoreEl = document.getElementById('learnScore');
  if(scoreEl) scoreEl.textContent = score;
  const barEl = document.getElementById('learnBarFill');
  if(barEl) barEl.style.width = (score * 10) + '%';

  // 4) Statistici concrete care DOVEDESC că botul învață (profil PER-MOD)
  const statsEl = document.getElementById('botMemStats');
  if(statsEl) {
    const pct = v => Math.round(clamp01(v || 0) * 100);
    // Modul cel mai studiat (cea mai multă experiență acumulată)
    let topMode = null, topN = -1;
    MODE_IDS.forEach(m => { const p = mem.modes[m]; if(p && (p.n||0) > topN){ topN = p.n||0; topMode = m; } });
    const modesSeen = MODE_IDS.filter(m => mem.modes[m] && mem.modes[m].n > 0).length;
    if(!topMode || topN <= 0){
      statsEl.innerHTML = `📊 Memorie bot (IndexedDB): încă nu te-a observat în nicio rundă. Joacă și profilul tău se conturează.`;
    } else {
      const p = mem.modes[topMode], tr = p.traits;
      const lbl = MODE_LABELS[topMode] || topMode;
      const sd = _eventRate(p, 'safeDumpDeclined').rate;
      const fo = _eventRate(p, 'forcedOppPenalty').rate;
      statsEl.innerHTML =
        `📊 Memorie bot (persistentă în IndexedDB):<br>` +
        `• Runde analizate: <b>${mem.stats.roundsObserved || 0}</b> · moduri conturate: <b>${modesSeen}/${MODE_IDS.length}</b> · predictibilitatea ta: <b>${pct(mem.global.predictability)}%</b><br>` +
        `• Mod cel mai studiat: <b>${lbl}</b> (încredere <b>${pct(_modeConf(p))}%</b>, ${p.n} runde)<br>` +
        `• Stilul tău acolo — agresivitate: <b>${pct(tr.aggression.v)}%</b> · ține pericolul: <b>${pct(tr.holdsDanger.v)}%</b> · prudență: <b>${pct(tr.caution.v)}%</b><br>` +
        `• Decizii — ține pericolul deși putea scăpa: <b>${pct(sd)}%</b> · forțează adversarii: <b>${pct(fo)}%</b>`;
    }
  }
}

// ─── ECRAN STATISTICI DETALIATE: tot ce a învățat botul, pe fiecare mod ──────────
function renderBotStats() {
  const body = document.getElementById('statsBody');
  if(!body) return;
  const mem = getBotMemory();
  const diff = getBotDifficulty();
  const pct = v => Math.round(clamp01(v || 0) * 100);
  const learnScore = getBotLearningScore();
  const modesSeen = MODE_IDS.filter(m => mem.modes[m] && mem.modes[m].n > 0).length;
  const roundsObs = mem.stats.roundsObserved || 0;
  const diffLabels = { easy:'Ușor', medium:'Mediu', hard:'Greu', adaptive:'Adaptiv 🧠' };

  let html = `
    <div class="stats-global">
      <div class="stats-global-grid">
        <div class="stats-kv"><span class="k">Dificultate</span><span class="v">${diffLabels[diff]||diff}</span></div>
        <div class="stats-kv"><span class="k">Învățare</span><span class="v">${learnScore}/10</span></div>
        <div class="stats-kv"><span class="k">Runde analizate</span><span class="v">${roundsObs}</span></div>
        <div class="stats-kv"><span class="k">Moduri conturate</span><span class="v">${modesSeen}/${MODE_IDS.length}</span></div>
        <div class="stats-kv"><span class="k">Predictibilitatea ta</span><span class="v">${pct(mem.global.predictability)}%</span></div>
        <div class="stats-kv"><span class="k">Volatilitatea ta</span><span class="v">${pct(mem.global.volatility)}%</span></div>

      ${diff==='easy' ? `<div class="stats-note">⚠️ Pe „Ușor" botul NU te observă. Comută pe Mediu / Greu / Adaptiv ca să înceapă să învețe.</div>` : ''}
    </div>`;

  if(roundsObs === 0) {
    html += `<div class="stats-empty">🧠 Încă nu te-a observat în nicio rundă.<br>Joacă împotriva roboților și profilul tău se va contura aici, separat pe fiecare mod de joc.</div>`;
    body.innerHTML = html;
    return;
  }

  const TRAITS = [
    ['opensHigh',     'Deschide cu cărți mari'],
    ['aggression',    'Agresivitate'],
    ['caution',       'Prudență (duck)'],
    ['holdsDanger',   'Ține pericolul târziu'],
    ['dumpsDanger',   'Scapă rapid de pericol'],
    ['avoidsPenalty', 'Evită penalizările'],
    ['takesPenalty',  'Preia penalizări intenționat'],
    ['suitControl',   'Control de culoare'],
    ['voidsEarly',    'Golește culori devreme']
  ];
  const EVENTS = [
    ['safeDumpDeclined', 'A putut scăpa de pericol și NU a făcut-o'],
    ['keptKHeart',       'A păstrat K♥ deși putea scăpa'],
    ['keptQueen',        'A păstrat o Damă deși putea s-o arunce'],
    ['duckedWinnable',   'A evitat o mână câștigabilă (duck)'],
    ['forcedOppPenalty', 'A forțat adversarii să ia penalizarea'],
    ['keptSuitControl',  'A păstrat controlul unei culori'],
    ['earlyVoid',        'A golit o culoare devreme'],
    ['openedHigh',       'A deschis cu cărți mari']
  ];

  // Cardurile: modurile cu cele mai multe runde primele.
  const ordered = MODE_IDS.slice().sort((a,b) => (mem.modes[b]?.n||0) - (mem.modes[a]?.n||0));
  ordered.forEach(m => {
    const p = mem.modes[m];
    const lbl = MODE_LABELS[m] || m;
    if(!p || p.n === 0) {
      html += `<div class="stat-mode-card dim"><div class="stat-mode-head"><span class="stat-mode-name">${lbl}</span><span class="stat-mode-conf">neobservat</span></div></div>`;
      return;
    }
    const conf = pct(_modeConf(p));
    const hs = (p.humanScore||0).toFixed(1);
    const be = (p.botEdge||0).toFixed(1);
    const vol = pct(p.vol);

    let traitsHtml = '';
    TRAITS.forEach(([key,label]) => {
      const b = p.traits[key];
      const seen = b && b.n > 0;
      const v = b ? b.v : 0.5;
      const valTxt = seen ? pct(v)+'%' : '—';
      traitsHtml += `<div class="stat-trait-row"${seen?'':' style="opacity:0.35;"'}><span class="stat-trait-label">${label}</span><span class="stat-bar"><span class="stat-bar-fill" style="width:${pct(v)}%;"></span></span><span class="stat-trait-val">${valTxt}</span></div>`;
    });

    let eventsHtml = '';
    EVENTS.forEach(([key,label]) => {
      const e = p.events[key];
      if(!e || !e.opp) return;

    let suitsHtml = '';
    ['♠','♥','♦','♣'].forEach(su => {
      const color = (su==='♥'||su==='♦') ? '#e8788a' : '#cfd8e8';
      suitsHtml += `<div class="stat-suit-chip"><div class="su" style="color:${color};">${su}</div><div class="row">arunc <b>${pct(p.suitDump[su])}%</b></div><div class="row">țin <b>${pct(p.suitGuard[su])}%</b></div></div>`;
    });

    html += `
      <div class="stat-mode-card${conf < 12 ? ' dim' : ''}">
        <div class="stat-mode-head">
          <span class="stat-mode-name">${lbl}</span>
          <span class="stat-mode-conf">încredere ${conf}%<br><span class="small">${p.n} runde</span></span>
        </div>
        <div class="stat-scores">
          <span class="stat-score-chip">scorul tău mediu: <b>${hs}</b></span>
          <span class="stat-score-chip">mâna botului aici: <b>${be}</b></span>
          <span class="stat-score-chip">volatilitate: <b>${vol}%</b></span>
        </div>
        <div class="stat-section-h">Stilul tău</div>
        ${traitsHtml}
        <div class="stat-section-h">Decizii cheie</div>
        ${eventsHtml}
        <div class="stat-section-h">Culori — ce arunci / ce ții</div>
        <div class="stat-suits">${suitsHtml}</div>
      </div>`;
  });

  body.innerHTML = html;
}

  await resetBotMemory();
  refreshBotMemoryUI();

// Cât de mult contează memoria învățată, în funcție de dificultate.
// easy ignoră memoria; adaptive o folosește la maxim.
function _memoryWeight(diff) {
  switch(diff) {
    case 'easy':     return 0;
    case 'medium':   return 0.35;
    case 'hard':     return 0.8;
    case 'adaptive': return 1.4;
    default:         return 0.35;
  }
}

// ─── ÎNVĂȚARE 1: calitatea istorică a mâinii pe mod (semnal secundar) ────────────
// Apelat după fiecare rundă cu trick-uri în care botul a fost picker. NU mai măsurăm
// „norocul" botului ca preferință globală (vechiul modeBias era inutil — vezi răspuns);
// reținem doar un `botEdge` per mod = cât de bine se descurcă mâna botului acolo.
async function recordBotGameResult(modeId, scoreObtained) {
  const prof = _modeProfile(modeId);
  // EMA cu decay lent: o singură rundă nu domină, dar adaptarea rămâne posibilă.
  prof.botEdge = (prof.botEdge || 0) * 0.97 + scoreObtained * 0.03;
  const mem = getBotMemory();
  mem.stats.gamesPlayed = (mem.stats.gamesPlayed || 0) + 1;
  await persistBotMemory();
}

// ─── ÎNVĂȚARE 2 (nucleul): analiza jucătorului uman, SEPARAT PE MOD DE JOC ───────
// La finalul fiecărei runde reconstruim mâna umanului trick-cu-trick și învățăm
// DECIZII + CONTEXTE (nu doar rezultate), în profilul MODULUI curent (gs.mode).
// Reconstrucția „mâna înainte de trick-ul t" = (cărțile jucate în trick-urile ≥ t)
// + (cărțile rămase la final) → ne lasă să vedem ce OPȚIUNI a avut la fiecare decizie.
function analyzeHumanRound(gs, humanIdx, maxP) {
  if(!gs || !gs.mode) return;
  const prof = _modeProfile(gs.mode);
  if(gs.mode === 'rentz'){ _analyzeRentz(gs, humanIdx, prof); return; }

  const mode = gs.mode;
  const isDanger   = _dangerFn(mode);        // „pericol" mod-aware
  const hasPenalty = _modeHasPenalty(mode);
  const tricks = gs.tricks || [];
  const remaining = (gs.hands && gs.hands[humanIdx]) ? gs.hands[humanIdx].slice() : [];

  // Mâna inițială a umanului = tot ce a jucat + ce i-a rămas.
  const played = [];
  for(const tk of tricks){
    const pl = tk.players || [], cs = tk.cards || [];
    for(let i=0;i<pl.length;i++) if(pl[i]===humanIdx && cs[i]) played.push(cs[i]);
  }
  const startHand = played.concat(remaining);
  if(startHand.length === 0) return;

  // handBefore[t] = mâna umanului ÎNAINTE de a juca în trick-ul t.
  const handBefore = [];
  {
    let acc = remaining.slice();
    for(let t = tricks.length - 1; t >= 0; t--){
      const pl = tricks[t].players || [], cs = tricks[t].cards || [];
      for(let i=0;i<pl.length;i++) if(pl[i]===humanIdx && cs[i]) acc.push(cs[i]);
      handBefore[t] = acc.slice();
    }
  }

  // Acumulatori de traits + evenimente de decizie.
  let leadSum=0, leadCount=0, openHigh=0;
  let safeDumpOpp=0, safeDumpDeclined=0;
  let queenOpp=0, queenKept=0, kheartOpp=0, kheartKept=0;
  let duckOpp=0, duckDid=0, forcedOppOpp=0, forcedOppDid=0;
  let penTakeOpp=0, penTook=0, penAvoid=0;

  const suitStart = {'♠':0,'♥':0,'♦':0,'♣':0};
  startHand.forEach(c => { if(suitStart[c.suit]!==undefined) suitStart[c.suit]++; });

  const _maxLead = (cs, myPos, suit) => Math.max(-1, ...cs.slice(0,myPos).filter(x=>x && x.suit===suit).map(x=>RV[x.rank]));

  for(let t=0;t<tricks.length;t++){
    const tk = tricks[t];
    const pl = tk.players || [], cs = tk.cards || [];
    const myPos = pl.indexOf(humanIdx);
    if(myPos < 0) continue;
    const myCard = cs[myPos];
    if(!myCard) continue;
    const hb = handBefore[t] || [];
    const leadSuit = tk.leadSuit || (cs[0] && cs[0].suit);
    const winner = tk.winner;
    const tookTrick = winner === humanIdx;
    const isLead = myPos === 0;

    // — Agresivitate / deschidere cu cărți mari —
    if(isLead){
      leadSum += (RV[myCard.rank]||7); leadCount++;
      if(RV[myCard.rank] >= RV['K']) openHigh++;
    }

    const trickPen = _trickPenalty(mode, cs);
    const isPenaltyTrick = hasPenalty && trickPen < 0;

    const followSuit = leadSuit ? hb.filter(c => c.suit === leadSuit) : [];
    const mustFollow = !!leadSuit && followSuit.length > 0;
    const topLead = _maxLead(cs, myPos, leadSuit);

    if(!isLead){
      // EVENIMENT: putea scăpa SIGUR de o carte periculoasă (fără să ia mâna) și NU a făcut-o.
      const dangerInHand = hb.filter(isDanger);
      if(dangerInHand.length){
        const canSafelyDump = dangerInHand.some(c => {
          if(mustFollow && c.suit !== leadSuit) return false;                 // nu poate juca off-suit
          if(!mustFollow) return true;                                        // aruncă off-suit pericol → sigur
          if(myPos === pl.length-1) return RV[c.rank] < topLead;              // ultim: sigur doar dacă pierde
          return RV[c.rank] < topLead;                                        // urmează jos → nu ia mâna
        });
        if(canSafelyDump){
          safeDumpOpp++;
          if(!isDanger(myCard)) safeDumpDeclined++;                            // a avut șansa, a jucat altceva
        }
      }
      // EVENIMENT: putea câștiga o mână (avea carte peste masă) și a evitat (duck).
      if(hasPenalty){
        const canWin = mustFollow && followSuit.some(c => RV[c.rank] > topLead);
        if(canWin){ duckOpp++; if(!tookTrick) duckDid++; }
      }
      // EVENIMENT: a păstrat o Damă deși putea s-o joace fără să ia mâna.
      if(mode==='qMinus'||mode==='totale'){
        const queensSafe = hb.some(c => c.rank==='Q' && ((mustFollow && c.suit!==leadSuit) || (c.suit===leadSuit && RV[c.rank] < topLead)));
        if(queensSafe){ queenOpp++; if(myCard.rank!=='Q') queenKept++; }
      }
      // EVENIMENT: a păstrat K♥ deși putea scăpa de el.
      if(mode==='kInima'||mode==='totale'){
        const kSafe = hb.some(c => c.rank==='K' && c.suit==='♥') && ((mustFollow && leadSuit!=='♥') || (leadSuit==='♥' && topLead > RV['K']));
        if(kSafe){ kheartOpp++; if(!(myCard.rank==='K'&&myCard.suit==='♥')) kheartKept++; }
      }
    }

    // EVENIMENT: a forțat un ADVERSAR să ia o mână penalizatoare — măsurat ca RATĂ:
    // dintre mâinile penalizatoare pe care le-a DESCHIS el, în câte penalizarea a ajuns
    // la altcineva (ofensiv) vs. i-a rămas lui. Distinct de simpla evitare a penalizărilor.
    if(isPenaltyTrick && isLead){
      forcedOppOpp++;
      if(!tookTrick && winner != null && winner !== humanIdx) forcedOppDid++;
    }
    // A preluat / a evitat o mână penalizatoare (orice mână, nu doar cele deschise de el).
    if(isPenaltyTrick){ penTakeOpp++; if(tookTrick) penTook++; else penAvoid++; }
  }

  // ── Conversie în „belief"-uri 0..1 (null ⇒ nu actualizăm acel trait în runda asta) ──
  const lo = RV[RANKS[0]], span = Math.max(1, RV[RANKS[RANKS.length-1]] - RV[RANKS[0]]);
  const aggression   = leadCount ? clamp01((leadSum/leadCount - lo) / span) : null;
  const opensHighV   = leadCount ? clamp01(openHigh / leadCount) : null;
  const dangerStart  = startHand.filter(isDanger).length;
  const dangerLeft   = remaining.filter(isDanger).length;
  const holdsDanger  = dangerStart ? clamp01(dangerLeft / dangerStart) : null;
  const dumpsDanger  = dangerStart ? clamp01(1 - dangerLeft / dangerStart) : null;
  const caution      = duckOpp ? clamp01(duckDid / duckOpp) : null;
  const takesPenalty = penTakeOpp ? clamp01(penTook / penTakeOpp) : null;
  const avoidsPenalty= penTakeOpp ? clamp01(penAvoid / penTakeOpp) : null;

  const suitDumpV = {}, suitGuardV = {};
  let voidedEarly = 0, voidOpp = 0;
  _SUIT_KEYS.forEach(su => {
    const st = suitStart[su];
    if(st){
      const left = remaining.filter(c=>c.suit===su).length;
      suitDumpV[su]  = clamp01((st - left) / st);
      suitGuardV[su] = (left>0 && remaining.some(c=>c.suit===su && RV[c.rank] >= RV['K'])) ? 1 : 0;
      voidOpp++; if(left===0) voidedEarly++;
    } else { suitDumpV[su] = null; suitGuardV[su] = null; }
  });
  const voidsEarlyV  = voidOpp ? clamp01(voidedEarly / voidOpp) : null;
  const suitControlV = _avgNonNull(_SUIT_KEYS.map(su => suitGuardV[su]));

  // ── Actualizăm traits (învățare cu uitare adaptivă) ──
  _learn(prof.traits.aggression,    aggression);
  _learn(prof.traits.opensHigh,     opensHighV);
  _learn(prof.traits.holdsDanger,   holdsDanger);
  _learn(prof.traits.dumpsDanger,   dumpsDanger);
  _learn(prof.traits.caution,       caution);
  _learn(prof.traits.takesPenalty,  takesPenalty);
  _learn(prof.traits.avoidsPenalty, avoidsPenalty);
  _learn(prof.traits.voidsEarly,    voidsEarlyV);
  _learn(prof.traits.suitControl,   suitControlV);
  const aS = Math.max(_ALPHA_MIN, 1/(prof.n+2));
  _SUIT_KEYS.forEach(su => { _learnSuit(prof.suitDump, su, suitDumpV[su], aS); _learnSuit(prof.suitGuard, su, suitGuardV[su], aS); });

  // ── Evenimente de decizie (ocazii + manifestări, cu decay de recență) ──
  _eventN(prof, 'safeDumpDeclined', safeDumpOpp, safeDumpDeclined);
  _eventN(prof, 'keptQueen',        queenOpp,    queenKept);
  _eventN(prof, 'keptKHeart',       kheartOpp,   kheartKept);
  _eventN(prof, 'forcedOppPenalty', forcedOppOpp,forcedOppDid);
  _eventN(prof, 'duckedWinnable',   duckOpp,     duckDid);
  _eventN(prof, 'keptSuitControl',  voidOpp,     Math.round((suitControlV||0)*voidOpp));
  _eventN(prof, 'earlyVoid',        voidOpp,     voidedEarly);
  _eventN(prof, 'openedHigh',       leadCount,   openHigh);

  _postRound(prof, gs, humanIdx, [aggression, holdsDanger, dumpsDanger, caution]);
}

// Rentz: fără trick-uri/penalizări — învățăm din coloane (ordinea plasării).
// Semnale utile: ce culori a CONTROLAT (a ținut cărți mari), ce a „dat jos" repede,
// o agresivitate aproximată din valoarea medie a cărților plasate și tendința de a
// reține cărțile-capăt (7/A) care blochează coloanele.
function _analyzeRentz(gs, humanIdx, prof){
  const cols = gs.columns || {};
  const remaining = (gs.hands && gs.hands[humanIdx]) ? gs.hands[humanIdx].slice() : [];
  const played = [];
  _SUIT_KEYS.forEach(su => (cols[su]||[]).forEach(c => { if(c && c.player === humanIdx) played.push(c); }));
  const startHand = played.concat(remaining);
  if(startHand.length === 0) return;

  const suitStart = {'♠':0,'♥':0,'♦':0,'♣':0};
  startHand.forEach(c => { if(suitStart[c.suit]!==undefined) suitStart[c.suit]++; });

  const pv = played.map(c => RV[c.rank]).filter(v => v!=null);
  const lo = RV[RANKS[0]], span = Math.max(1, RV[RANKS[RANKS.length-1]] - RV[RANKS[0]]);
  const aggression = pv.length ? clamp01((pv.reduce((a,b)=>a+b,0)/pv.length - lo) / span) : null;

  const suitDumpV = {}, suitGuardV = {};
  let voidedEarly = 0, voidOpp = 0;
  _SUIT_KEYS.forEach(su => {
    const st = suitStart[su];
    if(st){
      const left = remaining.filter(c=>c.suit===su).length;
      suitDumpV[su]  = clamp01((st-left)/st);
      suitGuardV[su] = (left>0 && remaining.some(c=>c.suit===su && RV[c.rank] >= RV['K'])) ? 1 : 0;
      voidOpp++; if(left===0) voidedEarly++;
    } else { suitDumpV[su] = null; suitGuardV[su] = null; }
  });
  const voidsEarlyV  = voidOpp ? clamp01(voidedEarly/voidOpp) : null;
  const suitControlV = _avgNonNull(_SUIT_KEYS.map(su => suitGuardV[su]));
  const ends     = startHand.filter(c => c.rank==='7' || c.rank==='A').length;
  const endsLeft = remaining.filter(c => c.rank==='7' || c.rank==='A').length;
  const holdsDanger = ends ? clamp01(endsLeft/ends) : null;

  _learn(prof.traits.aggression,  aggression);
  _learn(prof.traits.holdsDanger, holdsDanger);
  _learn(prof.traits.voidsEarly,  voidsEarlyV);
  _learn(prof.traits.suitControl, suitControlV);
  const aS = Math.max(_ALPHA_MIN, 1/(prof.n+2));
  _SUIT_KEYS.forEach(su => { _learnSuit(prof.suitDump, su, suitDumpV[su], aS); _learnSuit(prof.suitGuard, su, suitGuardV[su], aS); });
  _eventN(prof, 'earlyVoid', voidOpp, voidedEarly);
  _eventN(prof, 'keptSuitControl', voidOpp, Math.round((suitControlV||0)*voidOpp));

  _postRound(prof, gs, humanIdx, [aggression, holdsDanger, suitControlV, voidsEarlyV]);
}

// Comun ambelor analize: experiență, volatilitate de stil, scorul modului, semnale
// globale și PERSISTAREA memoriei. fingerprint = vectorul de stil al rundei curente.
function _postRound(prof, gs, humanIdx, fingerprint){
  prof.n = Math.min(_N_CAP, (prof.n||0) + 1);        // experiență (plafonată → uitare lentă)

  // Scorul umanului în acest mod (EMA). Mic ⇒ botul ar trebui să ALEAGĂ acest mod
  // împotriva lui (preferă un mod în care îi iese prost; blochează unul care-i merge).
  const hs = (gs.roundScores && gs.roundScores[humanIdx] != null) ? gs.roundScores[humanIdx] : null;
  if(hs != null) prof.humanScore = (prof.n<=1) ? hs : prof.humanScore*0.85 + hs*0.15;

  // VOLATILITATE: cât oscilează amprenta de stil între runde (deviație medie absolută
  // pe un buffer scurt) → răspunde la „cât de des își schimbă stilul".
  const fp = fingerprint.filter(x => x!=null);
  if(fp.length){
    prof.recent = (prof.recent||[]).concat([fp]);
    if(prof.recent.length > 6) prof.recent = prof.recent.slice(-6);
    if(prof.recent.length >= 3){
      const L = Math.min(...prof.recent.map(r=>r.length));
      let dev = 0, cnt = 0;
      for(let k=0;k<L;k++){
        const col = prof.recent.map(r=>r[k]);
        const mean = col.reduce((a,b)=>a+b,0)/col.length;
        dev += col.reduce((a,b)=>a+Math.abs(b-mean),0)/col.length; cnt++;
      }
      prof.vol = cnt ? clamp01(dev/cnt * 2) : prof.vol;
    }
  }
  prof.lastUpdated = Date.now();

  // ── Semnale GLOBALE peste toate modurile ──
  const mem = getBotMemory();
  mem.global.games = (mem.global.games||0) + 1;
  mem.global.lastSeen = Date.now();
  const vols = MODE_IDS.map(m => (mem.modes[m] && mem.modes[m].n>0) ? mem.modes[m].vol : null).filter(v=>v!=null);
  mem.global.volatility = vols.length ? vols.reduce((a,b)=>a+b,0)/vols.length : 0;
  // Predictibilitate: pornește neutru (0.5) și se apropie de (1 - volatilitate) pe
  // măsură ce se string partide → fără reacții exagerate după câteva runde.
  const target = 1 - mem.global.volatility;
  const w = clamp01(mem.global.games / 15);
  mem.global.predictability = 0.5*(1-w) + target*w;

  mem.stats.roundsObserved = (mem.stats.roundsObserved||0) + 1;
  persistBotMemory(); // fire-and-forget; nu blocăm fluxul jocului
}

// ─── SCOR DE ÎNVĂȚARE (1–10) — cât de "antrenat" e botul, pentru UI ────────────
// Combină: experiența totală pe moduri, încrederea medie, câte moduri a studiat și
// cât de predictibil i se pare umanul. Întoarce un întreg 1..10 ușor de înțeles.
function getBotLearningScore() {
  const mem = getBotMemory();
  let totalN = 0, confSum = 0, modesSeen = 0;
  MODE_IDS.forEach(m => {
    const p = mem.modes[m]; if(!p) return;
    totalN += p.n || 0;
    confSum += _modeConf(p);
    if((p.n||0) > 0) modesSeen++;
  });
  const obsScore   = Math.min(1, totalN / _N_CAP);          // experiență cumulată
  const confScore  = modesSeen ? confSum / modesSeen : 0;   // încredere medie pe modurile văzute
  const breadth    = modesSeen / MODE_IDS.length;           // câte moduri are conturate
  const predict    = mem.global.predictability || 0.5;      // cât de "citit" e umanul
  const raw = obsScore*0.4 + confScore*0.3 + breadth*0.2 + predict*0.1;
  return Math.max(1, Math.min(10, Math.round(1 + raw * 9)));
}

// ─── ALEGEREA MODULUI DE JOC (folosește memoria + dificultatea) ────────────────
function chooseBestGameMode(available, hand, maxP) {
  const mem = getBotMemory();
  const diff = getBotDifficulty();

  // EASY: alegere aproape aleatorie (botul „nu se gândește").
  if(diff === 'easy') {
    return available[Math.floor(Math.random() * available.length)];
  }

  // ─────────────────────────────────────────────────────────────────────────
  // ALEGEREA JOCULUI PE PROBABILITĂȚI (după specificația utilizatorului).
  // Pentru fiecare mod calculăm o „încredere" 0..1 = cât de bun e modul pentru
  // mâna curentă. Apoi alegem PROBABILISTIC (ruletă ponderată), nu strict cel mai
  // mare scor — așa botul e tare dar nu perfect previzibil. Apoi profilul PER-MOD al
  // umanului (cât de bine îi iese acel mod + stilul lui) ajustează încrederile.
  // ─────────────────────────────────────────────────────────────────────────
  const conf = {}; // încredere 0..1 per mod

  // Helperi de mână
  const cardsBySuit = s => hand.filter(c => c.suit === s);
  const has = (r,s) => hand.some(c => c.rank === r && c.suit === s);
  const countRank = r => hand.filter(c => c.rank === r).length;
  const handSize = hand.length;
  const lowThreshold = (maxP === 3) ? RV['9'] : RV['10']; // „carte mică" depinde de nr. jucători
  const lowCards = hand.filter(c => RV[c.rank] <= lowThreshold).length;
  const lowRatio = lowCards / Math.max(1, handSize);

  // ── 1) J♠ (jPica) — vrei să CÂȘTIGI mâna în care apare J♠ (+10). Nu contează că ai
  //    tu J♠; contează să ai PICILE MARI DE PESTE J (A, K, Q♠) ca să iei tu mâna aia,
  //    fie că J♠ îl aruncă adversarul, fie că-l joci tu într-o mână pe care o câștigi.
  //    A avea J♠ în mână e de fapt un mic RISC (trebuie plasat cu grijă), nu un atu.
  const hasJ = has('J','♠'), hasA = has('A','♠'), hasK = has('K','♠'), hasQ = has('Q','♠');
  const highSpadesOverJ = cardsBySuit('♠').filter(c => RV[c.rank] > RV['J']).length; // DOAR Q/K/A♠
  const spadesCount = cardsBySuit('♠').length;
  const aceCount = countRank('A');
  const highWinners = hand.filter(c => c.rank === 'A' || c.rank === 'K').length; // ași/popi = câștigă levate → liabilitate la modurile minus (adună penalizările adversarilor)
  if(hasA && hasK && hasQ)        conf.jPica = 1.00; // A,K,Q♠ → controlez complet picile, 100%
  else if(hasA && hasK)           conf.jPica = hasJ ? 0.94 : 0.90; // A,K♠ (+J♠ în mână = control total al plasării lui → ~99%)
  else if(highSpadesOverJ >= 2)   conf.jPica = 0.82; // 2 pici mari peste J (ex. K,Q♠)
  else if(hasA)                   conf.jPica = 0.62; // doar A♠ → bun, dar un singur „scut"
  else if(hasK || hasQ)           conf.jPica = 0.38; // o pică mare singură → incert
  else                            conf.jPica = 0.10; // n-am pici mari → nu pot lua J♠
  // Bonus mic: cu cât am mai multe pici (mici incluse), mai ușor controlez când iese J♠.
  if(highSpadesOverJ >= 1 && spadesCount >= 3) conf.jPica = Math.min(1, conf.jPica + 0.05);

  // ── STRATEGII DE CONTROL AL PICILOR (cazuri în care AM J♠ și pot rămâne „major") ──
  // Idee: cu multe pici pot juca pici MICI (nu J♠), forțând adversarii să-și arunce
  // A♠/Q♠, iar eu rămân stăpân pe culoare cu o pică mare + J♠ → iau eu mâna cu J♠.
  if(hasJ) {
    const spadesBelowJ = cardsBySuit('♠').filter(c => RV[c.rank] < RV['J']).length; // pici mici (≤10♠)
    const lotsOfSpades = (maxP === 3) ? spadesCount >= 4 : spadesCount >= 3; // „multe pici"
    const halfSpades   = (maxP === 3) ? spadesCount >= 4 : spadesCount >= 3;  // ~jumătate din pici

    // „Intrare": o cale de a CÂȘTIGA o mână din altă culoare ca să preiau conducerea
    // (și să-mi joc K♠/J♠ la momentul potrivit). E nevoie de fie:
    //   • un As de altă culoare (câștigă clar o mână), SAU
    //   • o dublură cu K de altă culoare (K + minim încă o carte pe culoarea lui).
    const aceOtherSuit = hand.some(c => c.rank === 'A' && c.suit !== '♠');
    const kDoubletonOther = ['♥','♦','♣'].some(su =>
      hand.some(c => c.rank === 'K' && c.suit === su) && cardsBySuit(su).length >= 2
    );
    const hasEntry = aceOtherSuit || kDoubletonOther;

    // CALE A: J♠ + control (≥jumătate pici) + o pică peste J (scut) + 1-2 ași (intrare/prind mâna).
    if(halfSpades && highSpadesOverJ >= 1 && aceCount >= 1) {
      conf.jPica = Math.max(conf.jPica, aceCount >= 2 ? 0.95 : 0.90);
    }

    // CALE B: J♠ + multe pici + K♠ dar FĂRĂ A♠ + pică mică de sondare + INTRARE
    // (as de altă culoare SAU K dublat). Joc pica mică, elimin A♠/Q♠ din joc, rămân
    // major cu K♠+J♠, apoi cu intrarea preiau conducerea și iau eu mâna cu J♠.
    if(lotsOfSpades && hasK && !hasA && spadesBelowJ >= 1) {
      conf.jPica = Math.max(conf.jPica, hasEntry ? 0.90 : 0.5); // fără intrare → mult mai slab
    }

    // Variantă mai slabă: multe pici + o pică peste J + pică mică, dar tot are nevoie de
    // intrare ca să fructifice; fără intrare rămâne incertă.
    if(lotsOfSpades && highSpadesOverJ >= 1 && spadesBelowJ >= 1) {
      conf.jPica = Math.max(conf.jPica, hasEntry ? 0.78 : 0.5);
    }
  }

  // Dacă AM J♠ dar NU am pici mari peste el să-l plasez în siguranță → e un risc:
  // s-ar putea să fiu forțat să-l joc într-o mână pe care o ia adversarul. Scade încrederea.
  if(hasJ && highSpadesOverJ === 0) conf.jPica = Math.min(conf.jPica, 0.08);

  // CERINȚĂ: cu DOAR 2 pici (sau mai puțini) din care unul e J♠ (ex. J♠+A♠, J♠+10♠, doar J♠),
  // controlul culorii e prea subțire → în niciun caz nu aleg J♠. Excepțiile sunt acoperite
  // automat de selecția ponderată pe modurile DISPONIBILE: dacă J♠ e singurul rămas, e oricum
  // singurul selectabil; dacă toate celelalte sunt la fel de proaste, redevine comparabil.
  if(hasJ && spadesCount <= 2) conf.jPica = Math.min(conf.jPica, 0.05);

  // ── 2) Cărți mici peste tot (bune la „avoidance": totale / dame / romb) ──
  // Multe cărți mici + puține mâini lungi de o culoare = nu vom lua mâini. 95%.
  const heartsCount = cardsBySuit('♥').length;
  const diamondCount = cardsBySuit('♦').length;
  const qCount = countRank('Q');
  const hasKHeart = has('K','♥');
  const hasAHeart = has('A','♥');
  // „solist periculos" = o carte rea singură pe culoarea ei, fără cărți mici s-o acopere
  const kHeartSolo = hasKHeart && heartsCount <= 2;
  const qDiamondSolo = has('Q','♦') && diamondCount <= 2;

  // ── 3) K♥ (kInima) ── (strategie de ales)
  // Bun dacă NU ai K♥, sau dacă ai K♥ dar e bine „acoperit" de multe ♥ (îl ascunzi).
  if(hasKHeart) {
    // expus dacă ai puține ♥ și nu ai A♥ ca scut → foarte slab
    conf.kInima = kHeartSolo && !hasAHeart ? 0.05 : Math.min(0.6, 0.2 + (heartsCount-1)*0.12);
  } else {
    // nu ai K♥: cu cât ai mai multe ♥ mici (acoperire) cu atât mai bine.
    let cK = 0.55 + lowRatio*0.4 - highWinners*0.04; // A/K (orice culoare) câștigă levate → K♥ aruncat poate fi prins (penalizare mică: o singură carte)
    // DAR un ♥ MARE prost acoperit (mai ales A♥ singuratic) e periculos: ești FORȚAT să
    // câștigi o levată de cupă cu el și poți „prinde" K♥. Penalizăm după cât e de expus.
    const lowHearts = cardsBySuit('♥').filter(x => RV[x.rank] <= RV['10']).length;
    if(hasAHeart && lowHearts === 0)      cK = Math.min(cK, 0.12); // A♥ fără cupe-scut (ex. solist)
    else if(hasAHeart && lowHearts === 1) cK = Math.min(cK, 0.30); // A♥ slab acoperit
    else if(heartsCount > 0) {
      const topHeart = Math.max(...cardsBySuit('♥').map(x => RV[x.rank]));
      if(topHeart >= RV['Q']) cK -= 0.12 / (1 + lowHearts);        // alt ♥ mare prost acoperit
    }
    conf.kInima = Math.max(0.05, Math.min(0.95, cK));
  }

  // ── 4) Romb (♦) ── Cheia = ROMBII MICI (duck garantat, nu câștigă levate de caro):
  //    7,8,9♦ la 4 jucători / 9,10♦ la 3. Cel mai mic (7♦/9♦) e esențial. Șansa crește puternic
  //    cu câți rombi mici ai; cu TOȚI → fffff bun. Rombii MARI (Q/K/A♦) câștigă levate → strică;
  //    atunci doar cărți MICI pe celelalte culori mai salvează — și DOAR dacă ai CEI DOI rombi mici
  //    (7+8♦ la 4j / 9+10♦ la 3j = ducking real). Fără ei, celelalte culori nu contează (pot fi mari).
  const avgD = 8 / maxP;
  const lowDiaRanks   = (maxP === 3) ? ['9','10'] : ['7','8','9'];
  const lowDiaHeld    = lowDiaRanks.filter(r => has(r,'♦')).length;
  const hasLowestDia  = has(lowDiaRanks[0], '♦');            // 7♦ (4p) / 9♦ (3p) — cel mai mic
  const hasTwoLowestDia = has(lowDiaRanks[0],'♦') && has(lowDiaRanks[1],'♦'); // 7+8♦ (4p) / 9+10♦ (3p) = ducking real
  const maxLowDia     = lowDiaRanks.length;                  // 3 (4p) / 2 (3p)
  const highDiaDanger = (has('Q','♦')?1:0) + (has('K','♦')?1:0) + (has('A','♦')?1:0); // Q/K/A♦ = câștigă levate
  const lowOtherSuits = hand.filter(c => c.suit !== '♦' && RV[c.rank] <= lowThreshold).length;

  let rombConf;
  if(lowDiaHeld === 0)              rombConf = 0.12;          // niciun romb mic → slab
  else if(lowDiaHeld >= maxLowDia)  rombConf = 0.95;          // TOȚI rombii mici (cu cel mai mic) → fffff bun
  else if(maxP === 3)              rombConf = hasLowestDia ? 0.80 : 0.78; // 3 juc.: numai 9♦ / numai 10♦
  else if(lowDiaHeld === 2)        rombConf = hasLowestDia ? 0.88 : 0.78; // 4 juc.: 7+(8 sau 9) / 8,9
  else                             rombConf = hasLowestDia ? 0.62 : 0.45; // 4 juc.: numai 7♦ / numai 8♦ sau 9♦

  // Rombii MARI (Q/K/A♦) strică. Compensare: cărți MICI din celelalte culori — dar DOAR dacă ai
  // CEI DOI rombi mici (7+8♦ la 4j / 9+10♦ la 3j) = ducking real. Fără ei, scutul nu se aplică.
  if(highDiaDanger > 0) {
    let pen = highDiaDanger * 0.17;
    if(hasTwoLowestDia) {
      const shield = Math.min(1, lowOtherSuits / 4);          // ~4 cărți mici altundeva = scut bun
      pen *= (1 - 0.65 * shield);
    }
    rombConf -= pen;
  }
  conf.romb = Math.max(0.05, Math.min(0.95, rombConf));

  // ── Dame (qMinus) ──
  // Ași/popi = câștigă levate → adună damele aruncate de adversari. Lipsa damelor din mână NU
  // ajută dacă ai cărți mari (cazul: A♠ K♠ A♥ K♥ fără dame = ia levate, prinde dame = minus).
  conf.qMinus = Math.max(0.05, Math.min(0.95, 0.6 - qCount*0.22 + lowRatio*0.2 - highWinners*0.085));

  // ── Totale (totale) — toate minusurile odată ──
  // Bun doar dacă mâna e „curată": multe cărți mici, puține pericole.
  const dangerCount = (hasKHeart?1:0) + qCount + Math.max(0, diamondCount - avgD);
  // La TOTALE fiecare LEVATĂ luată = -1, deci cărțile MARI (A/K de orice culoare) sunt
  // liabilitate directă: câștigă levate. „Multe ași și popi = dezastruos pentru totale."
  conf.totale = Math.max(0.05, Math.min(0.95, 0.3 + lowRatio*0.7 - dangerCount*0.12 - highWinners*0.09));
  // procentaj scade DRASTIC dacă are K♥ solist sau Q♦ solist (chiar dacă restul mici)
  if(kHeartSolo || qDiamondSolo) conf.totale = Math.min(conf.totale, 0.2);

  // ── 5) Rentz — cât mai puține „capete" (7/A) și cât mai multe lipituri (secvențe) ──
  const jCount = countRank('J');
  let bestRun = 0, totalRun = 0;
  ['♠','♥','♦','♣'].forEach(su => {
    const idxs = cardsBySuit(su).map(c => RANKS.indexOf(c.rank)).sort((a,b)=>a-b);
    let cur = idxs.length ? 1 : 0;
    for(let k=1;k<idxs.length;k++){ if(idxs[k]===idxs[k-1]+1){cur++;} else { totalRun += Math.max(0,cur-1); cur=1; } }
    totalRun += Math.max(0, cur-1);
    bestRun = Math.max(bestRun, idxs.length ? cur : 0);
  });
  const ends = countRank('7') + countRank('A'); // „capete" greu de plasat
  conf.rentz = Math.max(0.05, Math.min(0.92, 0.2 + jCount*0.12 + totalRun*0.12 - ends*0.07));

  // ── Ajustări din PROFILUL PER-MOD al umanului (doar hard/adaptive) ──
  // Semnal principal: humanScore — cât de bine îi iese MODUL umanului. Botul preferă
  // modurile în care el scorează SLAB. Secundar: trăsături mod-aware + calitatea mâinii
  // botului în acel mod (botEdge). Totul ponderat cu ÎNCREDEREA pe acel mod.
  if(diff === 'hard' || diff === 'adaptive') {
    const W = _memoryWeight(diff);
    MODE_IDS.forEach(m => {
      if(conf[m] == null) return;
      const p = mem.modes[m]; if(!p) return;
      const mc = _modeConf(p); if(mc < 0.05) return;       // prea puțină experiență → nu atingem
      let adj = 0;
      adj += (clamp01(0.5 - (p.humanScore || 0) / 12) - 0.25); // humanScore mic ⇒ bonus
      adj += clamp01((p.botEdge || 0) / 12) * 0.15;            // mâna botului merge bine aici
      const t = p.traits;
      const holds = t.holdsDanger.v - 0.5, avoid = t.avoidsPenalty.v - 0.5;
      const aggr  = t.aggression.v - 0.5,  voids = t.voidsEarly.v - 0.5, ctrl = t.suitControl.v - 0.5;
      if(m === 'jPica'){
        // J♠ (pradă) e mai ușor de luat dacă umanul e PASIV (joacă mic, nu se bate).
        adj += (-aggr * 0.30) + (avoid * 0.15);
      } else if(_modeHasPenalty(m)){
        // Modurile de minus prind umanul dacă ține pericolul, rămâne fără culori și
        // NU evită bine penalizările (și nu controlează culori).
        adj += (holds * 0.30) + (voids * 0.12) - (avoid * 0.25) - (ctrl * 0.10);
      }
      adj = Math.max(-0.4, Math.min(0.4, adj * mc * W * 0.5));
      conf[m] = Math.max(0.02, Math.min(1, conf[m] + adj));
    });
  }

  // ── ALEGERE: ruletă ponderată după încredere, doar dintre modurile disponibile ──
  // Punctul 6: dacă nimic nu e bun, tot alegem ceva (iese modul cu cea mai mare
  // încredere relativă). Punctul 7: memoria per-mod e deja inclusă mai sus.
  const pool = available.map(id => ({id, c: conf[id] ?? 0.1}));
  pool.sort((a,b) => b.c - a.c);

  // Dacă cel mai bun mod e (aproape) cert (≥0.9), îl alegem direct — respectăm
  // procentajele explicite (ex. A,K,Q♠ → jPica ~100%). Mici excepții probabilistice
  // doar pe Hard/Adaptive ca să nu fie 100% previzibil, dar foarte rar.
  const best = pool[0];
  if(best.c >= 0.9) {
    const certainty = (diff === 'medium') ? 0.85 : best.c; // medium mai relaxat
    if(Math.random() < certainty) return best.id;
  }

  // HARD/ADAPTIVE accentuează diferențele; MEDIUM mai blând. Exponenți MODERAȚI: la valori prea mari
  // ruleta devine cvasi-deterministă spre jocul „cel mai sigur", iar pickeri diferiți converg pe același
  // joc → pare că botul repetă jocul precedent. Mai jos = mai multă varietate, dar tot alege bine.
  const sharpen = (diff === 'adaptive') ? 2.8 : (diff === 'hard') ? 2.4 : 1.6;
  let total = 0;
  pool.forEach(p => { p.weight = Math.pow(p.c, sharpen); total += p.weight; });

  let r = Math.random() * total;
  for(const p of pool) { r -= p.weight; if(r <= 0) return p.id; }
  return pool[0].id; // fallback determinist
}

async function botConfirmTrick(botIdx, key) {
  const s = roomData;
  if(!s || !s.gameState.pendingTrick) { window._botActing = false; return; }
  if(key) window._botActedKey = key;
  const savedMyIndex = myIndex;
  myIndex = botIdx;
  window._suppressRender = true;
  try {
    await confirmTrick();
  } catch(e) {
    console.error('botConfirmTrick error:', e);
  } finally {
    myIndex = savedMyIndex;
    window._suppressRender = false;
    window._botActing = false;
  }
  onRoomUpdate();
  scheduleBotTurnIfNeeded();
}

async function botPlayTurn(botIdx, key) {
  const s = roomData;
  if(!s || !s.gameState || s.gameState.currentPlayer !== botIdx || !s.players[botIdx] || !s.players[botIdx].isBot) { window._botActing = false; return; }
  if(key) window._botActedKey = key;
  const gs = s.gameState;
  const savedMyIndex = myIndex;
  myIndex = botIdx;
  window._suppressRender = true;

  try {
    if(gs.mode === 'rentz') {
      const hand = gs.hands[botIdx];
      const validCards = hand.filter(c => isValidRentzCard(c, gs, hand));
      if(validCards.length === 0) {
        await executeRentzPass();
      } else {
        const card = chooseBestRentzCard(validCards, gs, hand);
        await executeRentzPlay(card);
      }
    } else {
      const hand = gs.hands[botIdx];
      let playable = hand;
      if(gs.currentTrick.length > 0) {
        const lead = gs.leadSuit;
        const hasSuit = hand.some(c => c.suit === lead);
        if(hasSuit) playable = hand.filter(c => c.suit === lead);
      }
      const card = chooseBestTrickCard(playable, gs, hand, botIdx);
      await executeTrickPlay(card);
    }
  } catch(e) {
    console.error('botPlayTurn error:', e);
  } finally {
    myIndex = savedMyIndex;
    window._suppressRender = false;
    window._botActing = false;
  }
  onRoomUpdate(); // randăm acum, cu myIndex corect (jucătorul uman)
  scheduleBotTurnIfNeeded();
}

// Strategie inteligentă Rentz: analizează mâna botului și alege cartea
// care îi deschide cele mai multe continuări viitoare din propria mână.
function chooseBestRentzCard(validCards, gs, hand) {
  // EASY: alegere aleatorie dintre mutările valide (joc neglijent).
  if(getBotDifficulty() === 'easy') {
    return validCards[Math.floor(Math.random() * validCards.length)];
  }

  // Pentru fiecare carte validă, simulăm jucarea ei și calculăm un scor:
  // +1 pentru fiecare carte din propria mână rămasă care ar deveni jucabilă imediat după
  // +bonus dacă elimină o carte "blocantă" (extremă: 7/9 sau A)
  // -penalizare dacă jucăm J pe o coloană nouă inutil (ar trebui evitat dacă am alte opțiuni)

  const scored = validCards.map(card => {
    let score = 0;
    const suit = card.suit;
    const ri = RANKS.indexOf(card.rank);

    // Simulăm starea coloanei după ce am juca această carte
    let simUpNext = gs.upNext[suit];
    let simDownNext = gs.downNext[suit];
    let simColStarted = gs.colStarted[suit];

    if(card.rank === 'J') {
      simColStarted = true;
      simUpNext = ri + 1;
      simDownNext = ri - 1;
    } else if(ri === gs.upNext[suit]) {
      simUpNext = ri + 1;
    } else if(ri === gs.downNext[suit]) {
      simDownNext = ri - 1;
    }

    // Câte alte cărți din mâna proprie ar deveni jucabile pe ACEEAȘI coloană
    // după ce jucăm cartea curentă (excludem cartea curentă din verificare)
    const restOfHand = hand.filter(c => ck(c) !== ck(card));
    restOfHand.forEach(c => {
      if(c.suit !== suit) return;
      const ci = RANKS.indexOf(c.rank);
      if(ci === simUpNext || ci === simDownNext) score += 2; // deschide direct o carte proprie
    });

    // Bonus pentru Aşi — dă tură bonus, deci e aproape mereu avantajos
    if(card.rank === 'A') score += 3;

    // Bonus mic pentru cărțile "capăt" (7/9) — elimină riscul de skip pentru noi înșine mai târziu
    // (folosim RANKS[0] ca reper pentru capătul de jos)
    if(card.rank === RANKS[0]) score += 1;

    // Penalizare pentru J pus pe coloană nouă dacă botul are alte mutări valide pe coloane deja deschise
    if(card.rank === 'J' && !gs.colStarted[suit]) {
      const hasOtherOpenMove = validCards.some(c => ck(c) !== ck(card) && gs.colStarted[c.suit]);
      if(hasOtherOpenMove) score -= 5; // ar trebui să evite, dar regula nu-i interzice explicit
    }

    // Bonus pentru cărțile care reduc mâna la mai puține "lanțuri" diferite —
    // preferăm să continuăm o coloană pe care mai avem cărți, ca să nu rămânem blocați
    const sameSuitCount = restOfHand.filter(c => c.suit === suit).length;
    score += sameSuitCount * 0.5;

    // ── ANTI-„deschid adversarul": penalizăm jucarea unei cărți care deschide
    // sloturi (rangul de sus/jos pe coloană) pe care NOI nu le putem continua.
    // Un slot deschis pe care nu-l avem în mână e, practic, un cadou pentru adversari.
    // Excepție: Așii oricum dau tură bonus, deci nu-i penalizăm.
    if(card.rank !== 'A') {
      const iHaveRank = (idx) => idx >= 0 && idx < RANKS.length &&
        restOfHand.some(c => c.suit === suit && RANKS.indexOf(c.rank) === idx);
      let opensForOthers = 0;
      // slotul nou de sus
      if(simUpNext >= 0 && simUpNext < RANKS.length && simUpNext !== gs.upNext[suit] && !iHaveRank(simUpNext)) opensForOthers++;
      // slotul nou de jos
      if(simDownNext >= 0 && simDownNext < RANKS.length && simDownNext !== gs.downNext[suit] && !iHaveRank(simDownNext)) opensForOthers++;
      // La J pe coloană nouă se deschid DOUĂ sloturi deodată → cel mai riscant.
      const diff = getBotDifficulty();
      const penalty = (diff === 'hard' || diff === 'adaptive') ? 1.6 : 0.8;
      score -= opensForOthers * penalty;
    }

    return {card, score};
  });

  // MEMORIE (hard/adaptive): nu hrăni culorile pe care umanul le CONTROLEAZĂ în Rentz.
  // Dacă el ține cărți mari pe o culoare (suitGuard), a deschide/extinde acea coloană
  // îi oferă plasări → penalizăm ușor cărțile de pe acele culori, scalat cu încrederea.
  {
    const _d = getBotDifficulty();
    if(_d === 'hard' || _d === 'adaptive'){
      const p = _modeProfile('rentz'), mc = _modeConf(p);
      if(mc >= 0.2) scored.forEach(s => { s.score -= (p.suitGuard[s.card.suit] || 0) * mc * 1.2; });
    }
  }

  scored.sort((a, b) => b.score - a.score);
  // Alegem cea mai bună, cu mică variație random între cele apropiate ca scor (evită determinism robotic)
  const topScore = scored[0].score;
  const topChoices = scored.filter(s => s.score >= topScore - 1);
  return topChoices[Math.floor(Math.random() * topChoices.length)].card;
}

// Plasă de siguranță universală: în jocurile de minus (nu J♠/Rentz), botul NU trebuie să
// CONDUCĂ niciodată cu o culoare în care toți adversarii sunt void (doar el o mai are) — ar
// câștiga GARANTAT levata și fiecare i-ar arunca penalizări (Q/K♥/♦) în mână. Verificăm din
// cărțile IEȘITE public + ce ține botul în mână pe acea culoare; dacă are MĂCAR o carte pe o
// culoare pe care adversarii o MAI au, conduce cu aceea (preferând o carte ne-penalizatoare,
// apoi cea mai mică). E un ULTIM filtru peste TOATE căile de decizie de mai jos.
function guardLeadDeadSuit(card, playable, gs, hand) {
  if(!card) return card;
  const mode = gs.mode;
  if(mode === 'jPica' || mode === 'rentz') return card; // se aplică doar la jocurile de minus
  if(gs.currentTrick.length !== 0) return card;          // doar când botul CONDUCE (e primul)
  const playedBySuit = {'♠':new Set(),'♥':new Set(),'♦':new Set(),'♣':new Set()};
  (gs.tricks || []).forEach(t => (t.cards || []).forEach(c => { if(c && playedBySuit[c.suit]) playedBySuit[c.suit].add(c.rank); }));
  (gs.currentTrick || []).forEach(p => { if(p.card && playedBySuit[p.card.suit]) playedBySuit[p.card.suit].add(p.card.rank); });
  // Mai au adversarii VREO carte de culoarea asta? = există un rang neieșit ȘI nedeținut de mine.
  const oppHasSuit = (suit) => RANKS.some(r => !playedBySuit[suit].has(r) && !hand.some(c => c.suit === suit && c.rank === r));
  if(oppHasSuit(card.suit)) return card; // culoarea aleasă e încă vie la adversari → totul OK
  const live = (playable || hand).filter(c => oppHasSuit(c.suit));
  if(live.length === 0) return card;     // toate culorile mele sunt moarte la adversari → n-am încotro
  const isBad = c =>
    (mode === 'kInima'  && c.rank === 'K' && c.suit === '♥') ||
    (mode === 'qMinus'  && c.rank === 'Q') ||
    (mode === 'romb'    && c.suit === '♦') ||
    (mode === 'totale'  && ((c.rank === 'K' && c.suit === '♥') || c.rank === 'Q' || c.suit === '♦'));
  const liveSafe = live.filter(c => !isBad(c));
  const pool = liveSafe.length ? liveSafe : live; // întâi non-penalizare; altfel orice culoare vie
  return [...pool].sort((a,b) => RV[a.rank] - RV[b.rank])[0];
}

// Strategie pentru jocurile cu trick-uri (J♠, Q-, K♥, ♦, Totale)
// Evită să ia cărți periculoase, joacă cea mai mică/mare carte validă în funcție de mod
function chooseBestTrickCard(playable, gs, hand, botIdx) {
  return guardLeadDeadSuit(_decideTrickCard(playable, gs, hand, botIdx), playable, gs, hand);
}
function _decideTrickCard(playable, gs, hand, botIdx) {
  const diff = getBotDifficulty();

  // EASY: joc aproape aleatoriu (urmează regulile, dar fără strategie).
  if(diff === 'easy') {
    return playable[Math.floor(Math.random() * playable.length)];
  }

  const mode = gs.mode;
  const leading = gs.currentTrick.length === 0;
  const lead = gs.leadSuit;
  const sameSuit = leading ? [] : playable.filter(c => c.suit === lead);
  const offSuit = leading ? playable : playable.filter(c => c.suit !== lead);
  const hasSuit = sameSuit.length > 0;

  // Sortări utile
  const byRankAsc = (a,b) => RV[a.rank] - RV[b.rank];
  const byRankDesc = (a,b) => RV[b.rank] - RV[a.rank];

  // ═══════════════════════════════════════════════════════════════════════════
  // FINEȚURI TACTICE (gândire de jucător experimentat). Aceste helpere sunt
  // folosite de toate modurile de mai jos ca să joace „uman", nu robotic.
  // ═══════════════════════════════════════════════════════════════════════════
  const maxP = gs.hands ? gs.hands.length : 4;
  // Câți jucători au pus deja în acest trick + dacă SUNT ULTIMUL care joacă.
  // Dacă sunt ultimul, am informație completă: știu sigur dacă o carte câștigă sau nu.
  const playedSoFar = gs.currentTrick.length;
  const amLast = !leading && (playedSoFar === maxP - 1);

  // Cea mai mare carte de pe culoarea cerută aflată ACUM în trick (cine conduce).
  const topInLead = playedSoFar
    ? Math.max(...gs.currentTrick.filter(p => p.card.suit === lead).map(p => RV[p.card.rank]), 0)
    : 0;

  // O carte „pierde mâna sigur" dacă urmează culoarea și e sub cartea care conduce.
  // (Valabil cu certitudine doar dacă sunt ultimul; altfel e doar probabil.)
  const losesTrick = c => c.suit === lead && RV[c.rank] < topInLead;

  // Câte cărți am pe fiecare culoare — pentru „void creation" (golirea unei culori).
  const suitCounts = {'♠':0,'♥':0,'♦':0,'♣':0};
  hand.forEach(c => { if(suitCounts[c.suit] !== undefined) suitCounts[c.suit]++; });

  // „Descărcare inteligentă" când NU am culoarea cerută (off-suit) și vreau să arunc
  // o carte fără valoare negativă: aleg cartea cea mai bună de aruncat ținând cont de:
  //  • scap de cărți MARI periculoase (mai greu de plasat în siguranță mai târziu),
  //  • prefer să GOLESC o culoare pe care am puține cărți (1-2) → rămân „liber" pe ea,
  //    ca să pot arunca cărți rele acolo în viitor (exact tactica A-K-10-9 pe roșu).
  const smartDiscard = (cards) => {
    if(cards.length === 1) return cards[0];
    const lowCoverInSuit = (suit) => hand.filter(c => c.suit === suit && RV[c.rank] <= RV['9']).length;
    const scored = cards.map(c => {
      let s = RV[c.rank];                              // cărțile mari sunt mai bune de aruncat
      if(suitCounts[c.suit] <= 2) s += 6;              // golim culorile scurte (creăm void)
      if(c.rank === 'A') s += 3;                       // Asul nu prea ajută în defensivă
      if(RV[c.rank] >= RV['J'] && lowCoverInSuit(c.suit) === 0) s += 5; // mare + neacoperit
      // STRATEGIA 2: dacă pe culoarea cărții sunt deja „acoperit" (minor), n-am nevoie
      // de cărțile de acolo ca protecție → le pot arunca liber (+). Dacă NU sunt acoperit,
      // cărțile mici de acolo îmi sunt prețioase ca să fac duck mai târziu → le țin (−).
      if(amCoveredInSuit(c.suit)) s += 2;
      else if(RV[c.rank] <= RV['9']) s -= 3;
      return {c, s};
    }).sort((a,b) => b.s - a.s);
    return scored[0].c;
  };

  // „Urmează culoarea încercând să PIERZI mâna" (folosit de toate jocurile de minus):
  //  1) dacă pot pierde, dau cea mai MARE carte care tot pierde (duck high, curăț în siguranță);
  //  2) dacă IAU inevitabil (sunt ultimul, toate cărțile mele bat masa) → dau cea mai mare
  //     carte ca să scap de ea, DAR niciodată cartea-penalizare în sine (aș lua chiar EU
  //     K♥/Q!) → dau cea mai mare care NU e penalizare proprie pe acest mod;
  //     dacă nu sunt ultimul → joc mic (poate mă salvează cineva care pune peste).
  const followToLose = (cardsOnSuit) => {
    const sorted = [...cardsOnSuit].sort(byRankAsc);
    const ducking = sorted.filter(c => RV[c.rank] < topInLead);
    if(ducking.length > 0) {
      // La DAME/TOTALE, dacă printre cărțile care PIERD mâna am o DAMĂ (-3), o arunc pe EA, nu
      // „cea mai mare care pierde" (ex. K, care NU penalizează). Tipic: un adversar din fața mea
      // a luat mâna cu Asul, iar eu am K+Q pe culoare → dau Q (penalizează mai mult, o înghite
      // cel ce ia levata) și păstrez K. Când n-am damă printre ele, rămâne duck-high normal.
      if(mode === 'qMinus' || mode === 'totale') {
        const queenDuck = ducking.find(c => c.rank === 'Q');
        if(queenDuck) return queenDuck;
      }
      return ducking[ducking.length - 1];
    }
    // Voi LUA sigur mâna dacă sunt ULTIMUL SAU dețin cea mai mare carte rămasă pe culoare
    // (nimeni nu mă mai poate depăși). În ambele cazuri NU-mi livra singur o penalizare:
    // dau cea mai mare carte NEpenalizatoare; doar dacă am EXCLUSIV penalizări dau cea mai mică.
    const selfPen = c =>
      ((mode === 'kInima' || mode === 'totale') && c.rank === 'K' && c.suit === '♥') ||
      ((mode === 'qMinus' || mode === 'totale') && c.rank === 'Q');
    const willWin = amLast || !amCoveredInSuit(lead);
    if(willWin) {
      const safe = sorted.filter(c => !selfPen(c));
      if(safe.length > 0) return safe[safe.length - 1]; // cea mai mare carte care NU e K♥/Q
      return sorted[0];                                 // am doar penalizări → dau cea mai mică
    }
    // Pot fi depășit de cineva de după mine → joc mic; dacă e penalizare, o pasez celui ce ia.
    return sorted[0];
  };

  // „CE BINE E SĂ FII ULTIMUL" (jocuri de minus, FĂRĂ romb): dacă sunt ULTIMUL, urmez
  // culoarea, am o carte MARE (As sau K — NU K♥ la K♥/Totale, dar la Dame K♥ e permis) +
  // o carte mai mică pe acea culoare,
  // iar mâna e CURATĂ (fără K♥ și fără nicio damă pe masă — la totale romburile-număr se
  // tolerează ca -1, Q♦ fiind damă e oricum exclusă), atunci PRIND mâna cu As/K: scap de
  // cartea mare inofensiv ȘI iau inițiativa. Marjă: 85%. Cu ce prind e indiferent (cea mai mare).
  const tryLastCleanWin = () => {
    if(mode !== 'kInima' && mode !== 'qMinus' && mode !== 'totale') return null;
    if(diff === 'easy') return null;
    if(!amLast || !hasSuit) return null;
    const trickCards = gs.currentTrick.map(p => p.card);
    // Mâna trebuie să fie CURATĂ: nicio penalizare „scumpă" (K♥ sau orice damă) pe masă.
    if(trickCards.some(c => (c.rank === 'K' && c.suit === '♥') || c.rank === 'Q')) return null;
    // Cărțile cu care POT prinde: As / K (NU K♥ la K♥/Totale; la Dame K♥ e permis), bat vârful.
    const highWinners = sameSuit.filter(c =>
      (c.rank === 'A' || (c.rank === 'K' && (mode === 'qMinus' || c.suit !== '♥'))) && RV[c.rank] > topInLead);
    if(highWinners.length === 0) return null;
    // Trebuie să am ȘI o carte mai mică de aceeași culoare (adâncime / flexibilitate ulterioară).
    const minWinner = Math.min(...highWinners.map(c => RV[c.rank]));
    if(!sameSuit.some(c => RV[c.rank] < minWinner)) return null;
    // NU prelua dacă pot ARUNCA aici o penalizare proprie (K♥/damă de culoarea cerută) care
    // pierde mâna — mai valoros e să scap de penalizare decât să prind cu Asul.
    const canDumpOwnPenalty = sameSuit.some(c =>
      (((mode === 'kInima' || mode === 'totale') && c.rank === 'K' && c.suit === '♥') ||
       ((mode === 'qMinus' || mode === 'totale') && c.rank === 'Q')) && RV[c.rank] < topInLead);
    if(canDumpOwnPenalty) return null;
    if(Math.random() > 0.85) return null; // marja 85%
    return [...highWinners].sort(byRankDesc)[0]; // prind cu cea mai mare (indiferent care)
  };
  // STRATEGIA 2 (urmărirea minor/major a culorilor). Calculate din istoricul rundei.
  // ═══════════════════════════════════════════════════════════════════════════

  // Probabilitate per dificultate de a aplica o strategie „fină".
  const stratChance = () => (diff === 'adaptive' ? 0.95 : diff === 'hard' ? 0.85 : diff === 'medium' ? 0.55 : 0);
  const rollStrat = (mult = 1) => Math.random() < stratChance() * mult;

  // Ce culori au fost deja CONDUSE (deschise) în rundă — pt. strategia „void".
  const suitsLed = {'♠':false,'♥':false,'♦':false,'♣':false};
  (gs.tricks || []).forEach(t => {
    const ls = t.leadSuit || (t.cards && t.cards[0] && t.cards[0].suit);
    if(ls && suitsLed[ls] !== undefined) suitsLed[ls] = true;
  });
  if(lead && suitsLed[lead] !== undefined) suitsLed[lead] = true;

  // STRATEGIA 2: ce ranguri au IEȘIT pe fiecare culoare → știm dacă suntem „minori".
  const playedBySuit = {'♠':new Set(),'♥':new Set(),'♦':new Set(),'♣':new Set()};
  (gs.tricks || []).forEach(t => (t.cards || []).forEach(c => {
    if(c && playedBySuit[c.suit]) playedBySuit[c.suit].add(c.rank);
  }));
  (gs.currentTrick || []).forEach(p => {
    if(p.card && playedBySuit[p.card.suit]) playedBySuit[p.card.suit].add(p.card.rank);
  });
  // Cea mai mare carte încă „în viață" pe o culoare (neieșită ȘI nedeținută de mine).
  const highestOutstanding = (suit) => {
    for(let i = RANKS.length - 1; i >= 0; i--) {
      const r = RANKS[i];
      if(!playedBySuit[suit].has(r) && !hand.some(c => c.suit === suit && c.rank === r)) return RV[r];
    }
    return -1;
  };
  // Sunt „minor/acoperit" pe o culoare dacă cea mai mare carte a mea de pe ea e sub
  // cea mai mare rămasă la adversari (deci nu pot fi forțat să câștig cu ea).
  const amCoveredInSuit = (suit) => {
    const mine = hand.filter(c => c.suit === suit).map(c => RV[c.rank]);
    if(mine.length === 0) return true;
    return highestOutstanding(suit) > Math.max(...mine);
  };
  // Mai au adversarii VREO carte de culoarea asta? Dacă NU (toate celelalte au ieșit și
  // singurele rămase sunt la mine), a CONDUCE cu ea = câștig garantat pe mâna mea
  // (toți dau altceva) → în jocurile de minus NU vreau asta.
  const oppHasSuit = (suit) => RANKS.some(r => !playedBySuit[suit].has(r) && !hand.some(c => c.suit === suit && c.rank === r));
  // Dintr-o listă de cărți de deschidere, le preferă pe cele de culori pe care adversarii
  // încă le au (evită culorile unde sunt solist). Dacă toate-s „solist", le întoarce pe toate.
  const dropSoleSuits = (cards) => { const ok = cards.filter(c => oppHasSuit(c.suit)); return ok.length ? ok : cards; };

  // Cine NU mai are o anumită culoare — DEDUS din joc PUBLIC: dacă un jucător n-a urmat
  // culoarea cerută într-o levată trecută (a dat off-suit), e sigur VOID pe ea. (Info corectă,
  // nu trișare — am văzut-o pe masă. Folosit de squeeze-ul de final pentru a ținti adversarul.)
  const playerVoid = {}; // playerVoid[idx] = Set de culori pe care jucătorul sigur nu le mai are
  (gs.tricks || []).forEach(t => {
    const ls = t.leadSuit || (t.cards && t.cards[0] && t.cards[0].suit);
    if(!ls) return;
    (t.players || []).forEach((pl, k) => {
      const card = t.cards && t.cards[k];
      if(card && card.suit !== ls) {
        if(!playerVoid[pl]) playerVoid[pl] = new Set();
        playerVoid[pl].add(ls);
      }
    });
  });

  // STRATEGIA 1 — „rămâi fără o culoare" (void creation pe lead), cu excepțiile cerute.
  const tryVoidLead = () => {
    if(!leading) return null;
    if(mode === 'jPica' || mode === 'rentz') return null; // doar jocuri de minus
    if(!rollStrat()) return null;
    const candidates = [];
    ['♠','♥','♦','♣'].forEach(su => {
      if(suitsLed[su]) return;
      if(!oppHasSuit(su)) return; // sunt SOLIST pe culoarea asta → a o conduce = câștig sigur, NU
      const myCards = hand.filter(c => c.suit === su);
      if(myCards.length === 0 || myCards.length > 2) return; // vrem culori scurte (1-2 cărți)
      const hasAceHere = myCards.some(c => c.rank === 'A');
      const hasKHere   = myCards.some(c => c.rank === 'K');
      const hasQHere   = myCards.some(c => c.rank === 'Q');
      // EXCEPȚII:
      if(su === '♥' && (hasAceHere || hasKHere) && (mode === 'kInima' || mode === 'totale')) return;
      if(su === '♦' && (hasAceHere || hasKHere || hasQHere) && (mode === 'romb' || mode === 'totale')) return;
      if(hasQHere && su !== '♦' && (mode === 'qMinus' || mode === 'totale') && Math.random() < 0.5) return;
      const low = [...myCards].sort(byRankAsc)[0];
      if(RV[low.rank] <= RV['10']) candidates.push({card: low, count: myCards.length});
    });
    if(candidates.length === 0) return null;
    candidates.sort((a,b) => a.count - b.count || RV[a.card.rank] - RV[b.card.rank]);
    return candidates[0].card;
  };

  // ── A DOUA JUMĂTATE a tacticii „loading" (jocuri de minus, FĂRĂ romb) ──────────
  // După ce am prins o mână SLABĂ cu o carte mare (vezi tryLastCleanWin), acum CONDUC.
  // Ies cu cea mai MICĂ carte dintr-o culoare unde: (1) dețin cel mai mic rang rămas
  // (NIMENI nu poate pune SUB mine → nu pot rămâne EU cu levata), (2) adversarii încă au
  // culoarea cu o carte MAI MARE (sunt forțați să urmeze și unul ia levata) ȘI (3) culoarea
  // ascunde o PENALIZARE relevantă pentru mod (la Dame: dama culorii încă la adversari; la
  // K♥: e ♥ și K♥ încă afară; la Totale: ♦, ori dama culorii, ori ♥ cu K♥ afară). Așa „cea
  // mică" scoate o levată GRASĂ — un adversar e nevoit să-și care cartea mare / penalizarea.
  // Romb-ul e EXCLUS intenționat (are deja conducerea lui ofensivă de ♦ mic, mai sus).
  const tryLoadingLead = () => {
